name: Validar Scripts de NPC e Alterações no Banco de Dados
# npc_db_validation.yml

# Para validação de NPC e DB, precisamos apenas de duas builds: uma de Renewal e uma de Pre-Renewal.
# Scripts de NPC e arquivos de banco de dados não dependem da plataforma, então podemos realizar essa validação usando apenas um ambiente Linux simples.

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      # Sempre executar todas as GitHub Actions se uma action ou algo relacionado ao CI for alterado
      - '.github/workflows/**'
      - 'tools/ci/**'
      # Este workflow deve rodar quando um arquivo nos diretórios db/ ou npc/ for modificado.
      - 'db/**'
      - 'npc/**'

jobs:
  build:
    # O GitHub Actions verifica por '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]' ou '[actions skip]', mas não por versões com hífen.
    # Isso é um coringa caso um Pull Request seja aberto e alguém esteja no piloto automático.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          # O rótulo ubuntu-latest atualmente aponta para ubuntu-24.04.
          # Disponíveis: ubuntu-24.04, ubuntu-22.04
          os: [ubuntu-latest]
          # Apenas uma versão do GCC é necessária para validar scripts de NPC e alterações no banco de dados.
          gcc: ['11']
          # Executamos as verificações de build tanto para Renewal quanto para Pre-Renewal
          mode: ['PRE', 'RE']

    steps:
      - uses: actions/checkout@v4
      
      # Um simples 'yes' e 'no' pode ser confuso, então usamos nomes para exibir no job atual e depois convertê-los para uso no compilador.
      - name: Processamento de Variáveis - PRE
        if: ${{ matrix.mode == 'PRE' }} 
        run: |
          echo "PRERE=yes" >> $GITHUB_ENV
      - name: Processamento de Variáveis - RE
        if: ${{ matrix.mode == 'RE' }} 
        run: |
          echo "PRERE=no" >> $GITHUB_ENV

      - name: Atualizar e Instalar Pacotes
        # Os runners do Ubuntu já possuem a maioria dos pacotes necessários para compilar o rAthena.
        # https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-Readme.md
        run: |
          sudo apt update
          sudo apt install zlib1g-dev libpcre3-dev gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}
          
      - name: Iniciar MySQL
        run: sudo systemctl start mysql.service

      - name: Comando - configure
        env:
            CONFIGURE_FLAGS: 'CC=gcc-${{ matrix.gcc }} CXX=g++-${{ matrix.gcc }} --enable-prere=${{ env.PRERE }} --enable-buildbot=yes'
        run: ./configure $CONFIGURE_FLAGS
      
      # npc.sh habilita todos os scripts de NPC nas pastas custom e test.
      - name: Habilitar Todos os NPCs para Teste
        run: ./tools/ci/npc.sh

      - name: Comando - make clean
        run: make clean

      # Criar diretórios de importação
      - name: Comando - make import
        run: make import

      - name: Comando - make tools
        run: make tools

      - name: Executar Uma Vez - yaml2sql
        run: ./yaml2sql

      - name: Configurar Banco de Dados e Importar Dados das Tabelas
        run: ./tools/ci/sql.sh

      - name: Comando - make map
        run: make map

      - name: Executar Uma Vez - map-server
        run: ./map-server --run-once
