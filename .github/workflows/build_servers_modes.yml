name: Compilar servidores em Pre-Renewal e Renewal
# build_servers_modes.yml

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      # Sempre executar todas as GitHub Actions se uma action ou algo relacionado ao CI for alterado
      - '.github/workflows/**'
      - 'tools/ci/**'
      # Este workflow deve rodar quando um arquivo em um diretório de código-fonte for modificado.
      - 'src/**'
      - '3rdparty/**'

jobs:
  build:
    # O GitHub Actions verifica por '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]' ou '[actions skip]', mas não por versões com hífen.
    # Isso é um coringa caso um Pull Request seja aberto e alguém esteja no piloto automático.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          # O rótulo ubuntu-latest atualmente aponta para ubuntu-24.04.
          # Disponíveis: ubuntu-24.04, ubuntu-22.04
          os: [ubuntu-latest]
          # Versões mais antigas do GCC não estão disponíveis via listas padrão do repositório aptitude.
          gcc: ['11']
          # Executamos verificações de build tanto para Renewal quanto para Pre-Renewal
          mode: ['PRE','RE']

    steps:
      - uses: actions/checkout@v4

      # Um simples 'yes' e 'no' pode ser confuso, então usamos nomes para exibir no job atual e depois convertê-los para uso no compilador.
      - name: Processamento de Variáveis - PRE
        if: ${{ matrix.mode == 'PRE' }} 
        run: |
          echo "PRERE=yes" >> $GITHUB_ENV
      - name: Processamento de Variáveis - RE
        if: ${{ matrix.mode == 'RE' }} 
        run: |
          echo "PRERE=no" >> $GITHUB_ENV

      - name: Atualizar e Instalar Pacotes
        # Os runners do Ubuntu já possuem a maioria dos pacotes necessários para compilar o rAthena.
        # https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-Readme.md
        run: |
          sudo apt update
          sudo apt install zlib1g-dev libpcre3-dev gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}

      - name: Iniciar MySQL
        run: sudo systemctl start mysql.service

      - name: Configurar Banco de Dados e Importar Dados das Tabelas
        run: ./tools/ci/sql.sh

      - name: Comando - configure
        env:
            CONFIGURE_FLAGS: 'CC=gcc-${{ matrix.gcc }} CXX=g++-${{ matrix.gcc }} --enable-prere=${{ env.PRERE }} --enable-buildbot=yes'
        run: ./configure $CONFIGURE_FLAGS

      - name: Comando - make clean
        run: make clean

      - name: Comando - make server
        run: make server

      - name: Executar Uma Vez - login-server
        run: ./login-server --run-once

      - name: Executar Uma Vez - char-server
        run: ./char-server --run-once

      - name: Executar Uma Vez - map-server
        run: ./map-server --run-once
