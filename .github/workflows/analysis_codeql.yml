name: Analisar servidores com CodeQL
# analysis_codeql.yml

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      # Sempre executar todas as GitHub Actions se uma action ou algo relacionado ao CI for alterado
      - '.github/workflows/**'
      - 'tools/ci/**'
      # Este workflow deve rodar quando um arquivo em um diretório de código-fonte for modificado.
      - 'src/**'
      - '3rdparty/**'

jobs:
  analyze:
    # O GitHub Actions verifica por '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]' ou '[actions skip]', mas não por versões com hífen.
    # Isso é um coringa caso um Pull Request seja aberto e alguém esteja no piloto automático.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
          # O rótulo ubuntu-latest atualmente aponta para ubuntu-20.04.
          # Disponíveis: ubuntu-24.04, ubuntu-22.04
          os: [ubuntu-latest]
          # Versões mais antigas do GCC não estão disponíveis via listas padrão do repositório aptitude.
          gcc: ['10']
          # Executamos as verificações de build tanto para Renewal quanto para Pre-Renewal
          mode: ['PRE','RE']

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Inicializa as ferramentas do CodeQL para varredura.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
           # O CodeQL oferece suporte a [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
           # Saiba mais sobre o suporte de linguagens do CodeQL em https://aka.ms/codeql-docs/language-support
           languages: cpp
           # Acionar verificações de segurança e qualidade
           queries: +security-and-quality

      # Um simples 'yes' e 'no' pode ser confuso, então usamos nomes para exibir no job atual e depois convertê-los para uso no compilador.
      - name: Processamento de Variáveis - PRE
        if: ${{ matrix.mode == 'PRE' }} 
        run: |
          echo "PRERE=yes" >> $GITHUB_ENV
      - name: Processamento de Variáveis - RE
        if: ${{ matrix.mode == 'RE' }} 
        run: |
          echo "PRERE=no" >> $GITHUB_ENV

      - name: Atualizar e Instalar Pacotes
        # Os runners do Ubuntu já possuem a maioria dos pacotes necessários para compilar o rAthena.
        # https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-Readme.md
        run: |
          sudo apt update
          sudo apt install zlib1g-dev libpcre3-dev gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}

      # O Autobuild tenta compilar automaticamente qualquer linguagem compilada (C/C++, C# ou Java).
      # Se este passo falhar, você deve removê-lo e executar a build manualmente (veja abaixo)
      #- name: Autobuild
      #  uses: github/codeql-action/autobuild@v2

      # ?? Se o Autobuild acima falhar, remova-o e descomente as
      #    três linhas abaixo e modifique-as (ou adicione mais) para compilar seu código caso
      #    o projeto utilize uma linguagem compilada
      - name: Comando - configure
        env:
            CONFIGURE_FLAGS: 'CC=gcc-${{ matrix.gcc }} CXX=g++-${{ matrix.gcc }} --enable-prere=${{ env.PRERE }} --enable-buildbot=yes'
        run: ./configure $CONFIGURE_FLAGS

      - name: Comando - make clean
        run: make clean

      - name: Comando - make server
        run: make server

      - name: Executar Análise do CodeQL
        uses: github/codeql-action/analyze@v3
