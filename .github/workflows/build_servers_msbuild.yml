name: Compilar servidores com MSVS
# build_servers_msbuild.yml

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      # Sempre executar todas as Github Actions se um workflow ou algo relacionado ao CI for alterado
      - '.github/workflows/**'
      - 'tools/ci/**'
      # Este workflow deve rodar quando um arquivo em um diretório de código-fonte for modificado
      - 'src/**'
      - '3rdparty/**'

jobs:
  build:
    # O Github Actions verifica por '[ci skip]', '[skip ci]', '[no ci]', '[skip actions]' ou '[actions skip]'
    # (mas não versões com hífen). Isso é um pega-tudo caso alguém abra um Pull Request no automático.
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          # O label windows-latest atualmente aponta para windows-2019.
          # Disponíveis: windows-2016, windows-2019 e windows-2022
          os: [windows-latest]
          # Executamos verificações de build tanto para Renewal quanto para PRE-Renewal
          mode: ['PRE', 'RE']

    steps:
      - uses: actions/checkout@v4

      - name: Adicionar msbuild ao PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compilar solução em Debug (PRE-Renewal)
        if: ${{ matrix.mode == 'PRE' }}
        run: msbuild rAthena.sln -t:rebuild -property:Configuration=Debug /p:DefineConstants="BUILDBOT%3BPRERE" /warnaserror

      - name: Compilar solução em Debug (Renewal)
        if: ${{ matrix.mode == 'RE' }}
        run: msbuild rAthena.sln -t:rebuild -property:Configuration=Debug /p:DefineConstants="BUILDBOT" /warnaserror
