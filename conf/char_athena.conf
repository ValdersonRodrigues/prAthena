// Arquivo de configuração do Personagem (Character) do Athena.

// Nota: "Comentários" são todos os textos à direita de uma barra dupla "//".
// Todo texto comentado não será interpretado pelos servidores e serve
// apenas como informação/referência.

// Nome de usuário e senha de comunicação do servidor.
userid: s1
passwd: p1

// Nome do servidor, use caracteres alternativos como ASCII 160 para espaços.
// NOTA: Não use espaços nem nenhum destes caracteres que não são permitidos em
//       nomes de arquivos do Windows \/:*?"<>|
//       ... caso contrário, os emblemas de guilda não funcionarão no cliente!
server_name: rAthena

// Nome do servidor para wisp: usado para enviar mensagens privadas do servidor aos jogadores (entre 4 e 23 caracteres)
wisp_server_name: Server

// IP do Login Server
// O character server conecta-se ao login server usando este endereço IP.
// NOTA: Isto é útil quando você está atrás de um firewall ou em uma máquina
// com múltiplas interfaces.
//login_ip: 127.0.0.1

// O character server escuta na interface com este endereço IP.
// NOTA: Isso permite rodar múltiplos servidores em múltiplas interfaces
// usando as mesmas portas.
//bind_ip: 127.0.0.1

// Porta do Login Server
login_port: 6900

// IP do Character Server
// O endereço IP que os clientes usarão para se conectar.
// Configure com o IP público do seu servidor.
//char_ip: 127.0.0.1

// Porta do Character Server
char_port: 6121

// Formato do timestamp que será exibido antes de todas as mensagens.
// Pode ter no máximo 20 caracteres.
// Formatos comuns:
// %I:%M:%S %p (hora:minuto:segundo em formato 12h, AM/PM)
// %H:%M:%S (hora:minuto:segundo em formato 24h)
// %d/%b/%Y (dia/mês/ano)
// Para formato completo, consulte o manual do strftime().
//timestamp_format: [%d/%b %H:%M]

// Se a saída redirecionada contém sequências de escape (códigos de cor)
stdout_with_ansisequence: no

// Faz o servidor gravar certos tipos de mensagens em arquivo na pasta /log/
//1: Registrar mensagens de aviso (Warning)
//2: Registrar mensagens de erro e erro SQL.
//4: Registrar mensagens de depuração (Debug)
//Exemplo: "console_msg_log: 7" registra os 3 tipos
//Mensagens registradas aqui ignoram a configuração console_silent
console_msg_log: 0

// Caminho do arquivo para armazenar as mensagens do console acima
console_log_filepath: ./log/char-msg_log.log

// Torna a saída do servidor mais silenciosa omitindo certos tipos de mensagens:
//1: Ocultar mensagens de informação
//2: Ocultar mensagens de status
//4: Ocultar mensagens de aviso geral (Notice)
//8: Ocultar mensagens de warning
//16: Ocultar mensagens de erro e erro SQL.
//32: Ocultar mensagens de debug
//Exemplo: "console_silent: 7" oculta mensagens de informação, status e notice (1+2+4)
console_silent: 0

// Comandos de Console
// Ativa ou desativa o uso de comandos no console
// Isto previne o uso de >& log.file
console: off

// Tipo de servidor.
// Sem efeitos funcionais no momento.
// Exibido ao lado do nome do servidor no cliente.
// 0=normal, 1=manutenção, 2=maior de 18, 3=pago, 4=P2P
char_maintenance: 0

// Ativar ou desativar criação de novos personagens.
// Agora é realmente suportado [Kevin]
char_new: yes

// Exibir (New) na lista de servidores.
char_new_display: 0

// Máximo de usuários que podem se conectar ao servidor.
// Defina como 0 para impedir logins. (-1 significa ilimitado)
max_connect_user: -1

// ID do grupo que pode ignorar o limite máximo de usuários.
// Ou conectar quando o char server está em manutenção (groupid >= allow)
// Padrão: -1 = ninguém (não há grupos com ID < 0)
// Veja: conf/groups.conf
gm_allow_group: 99

// Com que frequência o servidor salva informações de guilda? (em segundos)
// (o intervalo de salvamento de personagens é definido no map config (autosave_time))
autosave_time: 60

// Exibir informações no console sempre que personagens/guildas/parties/pets forem carregados/salvos?
save_log: yes

// Ponto inicial para novos personagens
// Formato: <nome_do_mapa>,<x>,<y>{:<nome_do_mapa>,<x>,<y>...}
// Número máximo de pontos é MAX_STARTPOINT em char.hpp (padrão 5)
// A localização é escolhida aleatoriamente na criação do personagem.
// NOTA: Para Doram, requer cliente 20151001 ou mais novo.
start_point: iz_int,18,26:iz_int01,18,26:iz_int02,18,26:iz_int03,18,26:iz_int04,18,26
start_point_pre: new_1-1,53,111:new_2-1,53,111:new_3-1,53,111:new_4-1,53,111:new_5-1,53,111
start_point_doram: lasa_fild01,48,297

// Itens iniciais para novos personagens
// Número máximo de itens é MAX_STARTITEM em char.cpp (padrão 32)
// Formato: <id>,<quantidade>,<posição>{:<id>,<quantidade>,<posição>...}
// Para equipar automaticamente, informe a posição; caso contrário, use zero.
// NOTA: Para Doram, requer cliente 20151001 ou mais novo.
start_items: 1201,1,2:2301,1,16:23484,1,0
start_items_pre: 1201,1,2:2301,1,16
start_items_doram: 1681,1,2:2301,1,16

// Zeny inicial para novos personagens
start_zeny: 0

// Tamanho das listas de fama
fame_list_alchemist: 10
fame_list_blacksmith: 10
fame_list_taekwon: 10

// Modificador de experiência da guilda.
// Ajusta a EXP taxada antes de adicionar à EXP da guilda.
// Exemplo: se definido como 200, a guilda recebe o dobro da EXP taxada.
guild_exp_rate: 100

// Nome usado para personagens desconhecidos
unknown_char_name: Unknown

// Registrar o character server em log?
log_char: yes

// Comprimento mínimo do nome do personagem.
// Deve ser '4' a menos que seu cliente use o diff 'Remove 4/6 letter Character Name limit'.
char_name_min_length: 4

// Permitir nomes idênticos com diferença apenas de maiúsculas/minúsculas:
// exemplo: Test-test-TEST-TesT; Valor: 0 não permitido (padrão), 1 permitido
name_ignoring_case: no

// Gerenciar letras/símbolos permitidos no nome do personagem.
// Caracteres de controle (0x00-0x1f) nunca são aceitos.
// Valores possíveis:
// NOTA: Aplica-se a nomes de personagens, parties e guildas.
// 0: sem restrição (padrão)
// 1: apenas letras/símbolos em 'char_name_letters' são permitidos.
// 2: letras/símbolos em 'char_name_letters' são proibidos. Todos os outros são permitidos.
char_name_option: 1

// Defina as letras/símbolos permitidos com 'char_name_option'.
// Nota: Não adicione espaços a menos que queira permitir espaço.
char_name_letters: abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890

// Restringir exclusão de personagens pelo BaseLevel
// 0: sem restrição (pode excluir qualquer nível)
// -X: não pode excluir personagens com BaseLevel <= X
// Y: não pode excluir personagens com BaseLevel >= Y
// ex: char_del_level: 80 (não pode excluir personagens com BaseLevel 80+)
char_del_level: 0

// Tempo em segundos para atrasar a exclusão de personagens.
// Padrão: 86400 (24 horas)
// NOTA: Requer cliente 2010-08-03aRagexeRE ou mais novo.
char_del_delay: 86400

// Restringir exclusão de personagem por email ou data de nascimento.
// Impede que jogadores mudem langtype e excluam personagens.
// Valores padrão dependem da data do cliente.
// 1: Email
// 2: Data de nascimento
// 3: Email ou data de nascimento
// IMPORTANTE!
// - Só funciona para clientes que enviam 0x0068 ou 0x01fb.
// - Use langtype 1 para clientes novos (2013+), para usar 0x01fb.
// - Clientes que não usam 0x0068 ou 0x01fb usam apenas data de nascimento (YYMMDD).
char_del_option: 2

// Restringir exclusão de personagem enquanto estiver em party ou guild
// 0: sem restrição
// 1: não pode excluir enquanto estiver em party
// 2: não pode excluir enquanto estiver em guild
// 3: não pode excluir enquanto estiver em party ou guild (padrão)
char_del_restriction: 3

// Restringir criação de certas classes. (Funciona apenas em 20151001aRagexe ou superior)
// 0: nenhuma criação permitida
// 1: apenas novice pode ser criado (padrão pre-renewal)
// 2: apenas summoner pode ser criado
// 3: novice e summoner podem ser criados (padrão renewal)
// Descomente para personalizar
//allowed_job_flag: 3

// Parties sem membros devem ser removidas da tabela party_db ao iniciar?
clear_parties: no

// Pasta que contém os arquivos de banco de dados.
db_path: db

//===================================
// Sistema de Pincode
//===================================
// NOTA: Requer cliente 2011-03-09aRagexeRE ou mais novo.
// Uma janela é aberta antes de selecionar o personagem e você deve digitar o pincode usando apenas o mouse.
// Padrão: yes
pincode_enabled: 0

// Com que frequência o usuário deve trocar o pincode?
// 0: nunca (padrão)
// X: a cada X dias
pincode_changetime: 0

// Quantas tentativas erradas são permitidas?
// Padrão: 3 (máximo do cliente)
pincode_maxtry: 3

// Usuários são obrigados a usar pincode quando o sistema está ativo?
// Padrão: yes
pincode_force: yes

// Números repetidos são permitidos?
// Padrão: no
pincode_allow_repeated: no

// Números sequenciais são permitidos?
// Padrão: no
pincode_allow_sequential: no

//===================================
// Sistema de Addon
//===================================
// Movimentação de personagens
// NOTA: Requer cliente 2011-09-28aRagexeRE ou mais novo.
// Permite mover personagens entre slots.
// Padrão: yes
char_move_enabled: yes

// Permitir mover um personagem para um slot ocupado?
// Se ativado, os personagens são trocados.
// Padrão: yes
char_movetoused: yes

// Permitir mover personagens quantas vezes quiser?
char_moves_unlimited: no

// Renomear personagem
// Permitir renomear personagem estando em party?
// Padrão: no
char_rename_party: no

// Permitir renomear personagem estando em guild?
// Padrão: no
char_rename_guild: no

// Verificar se as tabelas SQL estão corretas ao iniciar o servidor?
char_checkdb: yes

// Mapa padrão se o personagem estiver em um mapa inexistente ao carregar.
default_map: prontera
default_map_x: 156
default_map_y: 191

// Após quantos dias membros inativos do clã devem ser removidos?
// 0: nunca remover
// X: remover se não logar por X dias
// Padrão: 14
clan_remove_inactive_days: 14

//===================================
// RODEX
//===================================
// Após quantos dias as cartas serão devolvidas ao remetente?
// 0: nunca devolver
// X: devolver após X dias
// Padrão: 15
mail_return_days: 15

// Quantos dias após a devolução a carta será apagada completamente?
// 0: nunca apagar
// X: apagar X dias após a devolução
// Padrão: 15
mail_delete_days: 15

// O botão "Recuperar Tudo" ignora o status de não lido?
// no: só retorna anexos de cartas lidas
// yes: retorna anexos de todas as cartas
// Padrão: yes
mail_retrieve: yes

// Cartas sem anexos devem ser devolvidas ao remetente?
// Padrão: yes
mail_return_empty: yes

import: conf/import/char_conf.txt