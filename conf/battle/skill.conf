//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Tornado em um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um seletor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor está em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for dada,
//         assuma tipos de unidade (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário)
//--------------------------------------------------------------

// A taxa de tempo que leva para conjurar uma magia (Nota 2, 0 = Sem tempo de conjuração)
casting_rate: 100

// Tempo de atraso após conjurar (Nota 2)
delay_rate: 100

// O tempo de atraso depende da DEX e/ou AGI do conjurador? (Nota 1)
// Nota: Nos servidores oficiais, nem Dex nem Agi afetam o tempo de atraso
delay_dependon_dex: no
delay_dependon_agi: no

// Atraso mínimo permitido para QUALQUER habilidade após o início da conjuração (em milissegundos) (Nota 1)
// Nota: Definir isso acima de 0 pode impedir speedhacks.
min_skill_delay_limit: 100

// O movimento de ataque deve ser aplicado como atraso mínimo de habilidade no início da conjuração? (Nota 1)
// O cliente normalmente não envia comandos de habilidade mais rápido que o movimento de ataque.
// Porém, existem alguns truques para fazer o cliente enviar comandos mais rápido.
// Para alguns tipos de unidade como mercenários e homúnculos, não existe um atraso adequado
// do lado do servidor em algumas situações, então é possível usar habilidades mais rápido
// que o movimento de ataque usando esses truques.
// Defina como "yes" se quiser impedir esses truques e garantir que o
// atraso entre o uso de habilidades no início da conjuração seja no mínimo o movimento de ataque.
amotion_min_skill_delay: no

// Este atraso é o mínimo "tempo sem poder andar" de todas as habilidades.
// NOTA: Não defina isso muito baixo, se um personagem começar a se mover muito cedo
// após usar uma habilidade, o cliente não atualizará isso, e o jogador irá aparentar
// "teleportar" depois. Monstros usam AttackMotion em vez disso.
default_walk_delay: 300

// Desativar completamente o atraso de habilidades dos seguintes tipos (Nota 3)
// NOTA: Por padrão, monstros não usam o atraso definido no banco de dados de habilidades,
// mas seguem seu próprio atraso de reutilização definido no banco de dados de habilidades dos monstros.
// Quando ativado, o atraso de todas as habilidades passa a ser
// min_skill_delay_limit.
no_skill_delay: 2

// Em qual valor de DEX o tempo de conjuração se torna zero (instacast)?
castrate_dex_scale: 150

// Em qual valor (dex*2+int) a conjuração variável se torna zero?
vcast_stat_scale: 530

// Nos servidores oficiais, o atraso de amotion é aplicado no início da conjuração. Não há atraso de amotion aplicado
// no final da conjuração. Defina acima de 0 para também aplicar atraso de amotion no final da conjuração. (Nota 2)
// NOTA: Definir isso quebrará o encadeamento de habilidades com tempo de conjuração mas sem atraso pós-conjuração.
// Os atrasos do lado do cliente variam de habilidade para habilidade e normalmente ficam entre 140 e 180.
// Se quiser mais segurança, recomenda-se um valor entre 90 e 140.
skill_amotion_leniency: 0

// Ataques normais poderão ignorar o atraso após habilidades? (Nota 1)
skill_delay_attack_enable: yes

// Alcance adicionado às habilidades após o término da conjuração.
// Decide o quão longe o alvo pode se mover após a habilidade começar a ser conjurada antes de falhar.
// 0 desativa esta verificação de alcance (padrão)
skill_add_range: 0

// Se o alvo sair do alcance durante a conjuração, ainda consumimos os itens e SP da habilidade? (Nota 1)
skill_out_range_consume: no

// A distância entre conjurador e alvo define se a habilidade é de longo alcance? (Nota 3)
// Se ativado, quando a distância entre conjurador e alvo for maior que 3, a habilidade é considerada de longo alcance,
// caso contrário, é considerada corpo a corpo.
// Se desativado, então o alcance é determinado pelo alcance da habilidade (se for maior que 5, a habilidade é de longo alcance).
// Padrão 14 (mobs + pets + homun)
skillrange_by_distance: 14

// O alcance da arma equipada deve sobrescrever o alcance da habilidade definido no skill_db
// para a maioria das habilidades baseadas em arma? (Nota 3)
// NOTA: As habilidades afetadas por esta opção são aquelas cujo alcance no skill_db é negativo.
// Por padrão, sempre é usado o alcance da habilidade.
// Observe que se você quiser que todas as habilidades dos monstros tenham alcance 9,
// você precisa definir monster_ai&0x400.
skillrange_from_weapon: 0

// Deve ser feita uma verificação do estado do conjurador em todos os ataques de habilidades?
// Quando definido como yes, meteoros, storm gust e quaisquer outras habilidades de chão
// não terão efeito enquanto o conjurador estiver incapaz de lutar (ex: atordoado).
skill_caster_check: yes

// Habilidades colocadas no chão devem ser removidas assim que o conjurador morrer? (Nota 3)
clear_skills_on_death: 0

// Habilidades colocadas no chão devem ser removidas quando o conjurador mudar de mapa? (Nota 3)
clear_skills_on_warp: 15

// Definir como YES irá sobrescrever o modo de alvo das habilidades baseadas em chão com a flag 0x01 para "Sem Inimigos"
// As duas habilidades afetadas por padrão são Pneuma e Safety Wall (se definido como yes, essas duas habilidades não protegerão todos, apenas aliados)
// Veja db/(pre-)re/skill_db.yml para mais informações.
defunit_not_enemy: no

// As habilidades devem sempre causar pelo menos "hits" de dano quando não errarem/não forem bloqueadas?
// Muitas habilidades terão seu dano multiplicado pelo número de hits (ver skill_db), estas sempre causarão 1 HP
// de dano por hit, mesmo contra plantas. Porém, algumas habilidades são na verdade um único golpe que apenas é exibido como múltiplos hits.
// Para essas habilidades, o dano é dividido pelo número de hits e arredondado para baixo. Isso significa que plantas não receberão
// nenhum dano dessas habilidades. Exemplos: Sonic Blow, Lord of Vermillion
// Com esta configuração, você pode mudar o comportamento oficial e fazer com que essas habilidades causem pelo menos 1 HP de dano por hit.
// Valores: 1 para ataques baseados em arma, 2 para ataques mágicos, 4 para ataques diversos.
skill_min_damage: 0

// A taxa de atraso do combo do monge (Nota 2)
combo_delay_rate: 100

// Usar tipo alternativo da habilidade Auto Counter Attack? (Nota 3)
// Para os personagens em que está definido, 100% Crítico,
// Caso contrário, ignora DEF e HIT+20, CRI*2
auto_counter_type: 15

// Habilidades de chão podem ser colocadas umas sobre as outras? (Nota 3)
// Por padrão, habilidades com UF_NOREITERATION não podem ser empilhadas umas sobre as outras,
// esta configuração irá sobrescrever isso.
skill_reiteration: 0

// Habilidades de chão NÃO podem ser colocadas embaixo/próximo de jogadores/monstros? (Nota 3)
// Se definido, apenas habilidades com UF_NOFOOTSET serão afetadas.
skill_nofootset: 1

// As armadilhas (armadilhas de caçador + quagmire) devem mudar seu alvo para "todos" dentro de terrenos gvg/pvp? (Nota 3)
// Padrão nos servidores oficiais: 1 (para jogadores)
gvg_traps_target_all: 1

// Configuração de visibilidade das armadilhas (armadilhas com a flag UF_HIDDEN_TRAP):
// 0 = Sempre visíveis
// 1 = Habilitar invisibilidade em mapas versus (GVG/PVP/BG)
// 2 = Habilitar invisibilidade em todos os mapas
// Padrão nos servidores oficiais: 0 para Pre-renewal, 2 para Renewal
//traps_setting: 0

// Restrições aplicadas às habilidades de Invocação do Alquimista (adicione conforme necessário)
// 1: Permitir que jogadores causem dano às floras fora de mapas versus.
// 2: Permitir que jogadores causem dano às marine spheres fora de mapas versus.
// 4: Desabilitar ter tipos diferentes ao mesmo tempo
//    (ex: proibir invocar qualquer coisa exceto hydras quando já existir
//     uma hydra ativa)
// 8: Permitir que Marine Spheres causem dano ao próprio Homúnculo e invocações fora de PVP
// Padrão nos servidores oficiais: 15 para Pre-renewal, 12 para Renewal
//alchemist_summon_setting: 15

// Habilidades colocadas no chão devem verificar paredes? (Nota 1)
// (ex: Storm Gust lançado contra uma parede não atingirá o outro lado.)
// Habilidades que não possuem a flag de unidade "PathCheck" ignoram esta configuração.
skill_wall_check: yes

// Ao usar Cloaking, a parede é verificada ou não. (Nota 1)
// Nota: Quando a habilidade não verifica paredes, você será sempre considerado
//  como se estivesse ao lado de uma parede (sempre recebe a velocidade baseada em parede).
//  Adicione as configurações conforme necessário, ser atingido sempre cancela Cloaking.
//
// 0 = não verifica paredes
// 1 = Verifica paredes
// 2 = Cloaking não é cancelado ao atacar.
// 4 = Cloaking não é cancelado ao usar habilidades
player_cloak_check_type: 1
monster_cloak_check_type: 4

// Não é possível colocar habilidades de chão ilimitadas ao mesmo tempo (Nota 3)
land_skill_limit: 9

// Determina que tipo de mensagens de falha de habilidade devem ser enviadas:
// 1 - Desabilitar todas as mensagens de falha de habilidade.
// 2 - Desabilitar mensagens de falha devido a atrasos de ação.
// 4 - Desabilitar mensagem de falha do Snatcher
// 8 - Desabilitar mensagem de falha do Envenom
display_skill_fail: 2

// Um jogador em sala de chat (in-game) pode ser teleportado por um portal de warp? (Nota 1)
chat_warpportal: no

// O que a habilidade "Sense" do mago deve mostrar nos campos de defesa?
// 0: Não mostrar defesa
// 1: Defesa base [padrão RE]
// 2: Defesa de Vit/Int
// 3: Ambos (a soma dos dois)
sense_type: 1

// Qual estilo ofensivo do dedo será usado?
// 0 = Estilo Aegis (um único ataque multi-hit)
// 1 = Estilo Athena (múltiplos ataques consecutivos)
finger_offensive_type: 0

// Configurações do Grand Cross (não mexa nisso)
// Oficialmente, Grand Cross possui quatro ondas de dano, mas cada célula irá parar
// de causar dano na próxima onda depois de já ter causado pelo menos 3 hits.
// Um monstro em movimento pode receber até 4 hits, enquanto um grupo de monstros pode
// receber apenas 1 a 3 hits.
// Defina como yes se quiser que todas as ondas causem dano a todos os alvos.
// Dica: Se quiser reduzir o número de ondas, é necessário reduzir a
// duração da habilidade (ex: para 800ms para três ondas de dano).
gx_allhit: no

// Tipo de exibição do Grandcross (Padrão 1)
// 0: Personagem amarelo
// 1: Personagem branco
gx_disptype: 1

// Diferença máxima de nível para Devoção
devotion_level_difference: 10

// Usar comportamento "antigo" para devoção vs dano refletido? (Nota 2)
// O padrão é 0 (oficial). Se 'devotion_rdamage' for > 0 (chance de devotar o dano refletido),
// quando um jogador com devoção ataca um jogador com habilidade de refletir dano (bônus de item ou habilidade),
// o dano será recebido pela pessoa que fornece a devoção em vez do atacante.
devotion_rdamage: 0

// Oficialmente, o escudo refletor (SC_REFLECTDAMAGE) reflete dano físico por habilidade ou ataque normal.
// Mas se o alvo estiver sob devoção, ele APENAS reflete o dano de habilidades corpo a corpo. (Nota 1)
devotion_rdamage_skill_only: yes

// No AEGIS existe um bug quando o jogador sob devoção está sentado e recebendo dano.
// O jogador se levanta no lado do cliente, mas continuará sentado no lado do servidor.
// Por causa disso, o jogador não poderá mais andar, até sentar/levantar novamente ou usar @refresh.
// Você pode ler mais sobre isso em https://github.com/rathena/rathena/issues/1927
// Padrão: yes (porque é uma correção de bug recomendada da nossa parte)
// Oficial: no
devotion_standup_fix: yes

// Se não, então você pode usar as habilidades de conjunto (ensemble) sozinho. (Nota 1)
player_skill_partner_check: yes

// Tipo de remoção de armadilha
// 0 = Sistema Aegis : Retorna 1 item "Trap"
// 1 = Sistema Athena : Retorna todos os itens usados para colocar a armadilha
skill_removetrap_type: 0

// Usar arco para dar backstab gera penalidade de 50% no dano? (Nota 1)
backstab_bow_penalty: yes

// Quantas vezes é possível tentar roubar de um monstro.
// Nota: Ajuda a evitar exploits de roubo em monstros com poucos itens raros
// Use 0 para desativar (valor máximo permitido é 255)
skill_steal_max_tries: 0

// Opções aleatórias devem ser aplicadas aos itens roubados? (Nota 1)
// Oficial: no
skill_steal_random_options: no

// Nível e força do "MVP heal". Quando alguém lança um heal desse nível ou
// acima, a fórmula de cura é ignorada e este valor é usado no lugar.
max_heal: 9999
max_heal_lv: 11

// Configuração da habilidade de guilda Emergency Recall (adicione conforme necessário).
// Note que para a habilidade ser utilizável,
// você precisa de pelo menos um dos valores 1/2 e 4/8
// 1: A habilidade pode ser usada fora da WoE.
// 2: A habilidade pode ser usada durante a WoE.
// 4: A habilidade pode ser usada fora de terrenos GvG
// 8: A habilidade pode ser usada em terrenos GvG
//16: Desabilitar a habilidade em mapas "nowarpto"
//    (ela ainda funcionará em castelos GVG mesmo que estejam como nowarpto)
emergency_call: 11

// Configuração das habilidades de Aura de Guilda (adicione conforme necessário).
// (Isso afeta GD_LEADERSHIP, GD_GLORYWOUNDS, GD_SOULCOLD e GD_HAWKEYES)
// Note que para a habilidade ser utilizável,
// você precisa de pelo menos um dos valores 1/2 e 4/8
// 1: A habilidade funciona fora da WoE.
// 2: A habilidade funciona durante a WoE.
// 4: A habilidade funciona fora de terrenos GvG
// 8: A habilidade funciona em terrenos GvG
//16: Desabilitar a habilidade de afetar o Guild Master
guild_aura: 31

// Nível máximo possível das habilidades dos monstros
// Nota: Se seus MVPs estiverem muito fortes, reduza para 10.
mob_max_skilllvl: 100

// Permite que jogadores pulem o menu ao lançar Teleport nível 1
// O menu contém duas opções: "Random" e "Cancel"
skip_teleport_lv1_menu: no

// Permitir uso das habilidades SG sem o dia correto (Sol/Lua/Estrela)?
allow_skill_without_day: no

// Permitir uso de magias do tipo ES em jogadores?
allow_es_magic_player: no

// Taxa da habilidade Milagre do Sol, Lua e Estrelas
// Valores válidos vão de 1 (0,005% por hit) até 20000 (100% por hit)
// Esta chance é ainda reduzida se AGI estiver acima de 46 (92 = chance pela metade)
sg_miracle_skill_ratio: 1

// Duração da habilidade Milagre do Sol, Lua e Estrelas em milissegundos
sg_miracle_skill_duration: 3600000

// Taxa da habilidade Anjo do Sol, Lua e Estrelas (100% = 10000)
sg_angel_skill_ratio: 10

// Habilidades afetadas por bHealPower
// 1: Heal, 2: Sanctuary, 4: Potion Pitcher, 8: Slim Pitcher, 16: Apple of Idun,
// 32: Coluceo Heal, 64: Highness Heal, 128: Mediale Votum, 256: Dilectio Heal
skill_add_heal_rate: 487

// Define se o dano do EarthQuake com apenas um alvo na tela pode ser refletido.
// Nota: Nos servidores oficiais, EQ é refletível quando há apenas um alvo na tela,
// o que pode ser um exploit para caçar MVPs.
eq_single_target_reflectable: yes

// No servidor oficial, você recebe dano de Reflection e algumas cartas de Tarot mesmo em estado invencível.
// Quando esta configuração está ativada, você fica imune a todos os tipos de dano, incluindo os citados acima.
// (O número aparecerá, mas nenhum dano real será causado)
invincible.nodamage: no

// Troca de arma durante Dança
// Nos servidores oficiais, existe uma correção que impede a troca de armas para cancelar músicas.
// Padrão: yes
dancing_weaponswitch_fix: yes

// Tipo de armadilha de habilidade
// Nos servidores oficiais, se uma unidade for completamente imune a empurrão, ela ainda andará até o último
// tile alvo antes de parar quando afetada por um efeito de parada (incluindo armadilhas como Ankle Snare e Spiderweb).
// Todas as armadilhas no caminho serão ativadas.
// Isso NÃO inclui imunidade a empurrão por equipamento. Este bônus só ajuda contra habilidades de empurrão.
// 0: (oficial)
// 1: Efeitos de parada em GvG/WoE fazem as unidades pararem imediatamente.
// 2: Efeitos de parada fazem monstros ficarem imunes a empurrão / chefes param imediatamente.
// 3: 1+2
skill_trap_type: 0

// Disparo múltiplo de armadilhas (Nota 1)
// Até o episódio 11.2, armadilhas eram ativadas para cada unidade sobre elas no mesmo intervalo
// Ative isto se quiser restaurar esse comportamento antigo
// Esta configuração é recomendada apenas para pré-renovação, pois armadilhas causam muito mais dano em renewal
multi_trigger_trap: no

// Área da reação em cadeia do Bowling Bash (apenas pré-renovação)
// 0: Usar sistema oficial de gutter line
// 1: Sistema de gutter line sem bug de demi gutter
// 2-20: Área ao redor do conjurador (2 = 5x5, 3 = 7x7, 4 = 9x9, ..., 20 = 41x41)
// Nota: Se você empurrar o alvo para fora da área, ele será atingido apenas uma vez e não causará dano em área
bowling_bash_area: 0

// Comportamento do empurrão (Nota 1)
// Nos servidores oficiais, atingir uma parede sempre faz a unidade parar de se mover.
// Se "no", a unidade continuará se movendo ao se aproximar de paredes diagonalmente (comportamento antigo do Athena).
path_blown_halt: yes

// Verificação de nome de monstro da missão Taekwon
// A iRO Wiki afirma: Se seu alvo for Goblin, qualquer monstro chamado "Goblin" contará para a missão.
// 0: Desligado (padrão)
// 1: Todos os 5 monstros Goblin contam, independentemente do Mob ID (Mob ID: 1122-1126) - padrão iRO
// 2: Qualquer monstro com exatamente o mesmo nome contará, independentemente do Mob ID - comparação baseada em jName
taekwon_mission_mobname: 0

// Um jogador pode se teleportar em cima de um Portal de Warp do mapa? (Nota 1)
// Nos servidores oficiais, os jogadores não conseguem fazer isso.
teleport_on_portal: no

// A direção do empurrão do Cart Revolution é sempre para o Oeste? (Nota 1)
// Nos servidores oficiais, sempre empurra o alvo para o Oeste. Se desativado, empurra o alvo para trás.
cart_revo_knockback: yes

// Nos servidores oficiais, a direção do empurrão do Arrow Shower depende sempre da posição da habilidade em relação ao alvo, e não do conjurador
arrow_shower_knockback: yes

// Nos servidores oficiais, Storm Gust consiste em 81 unidades que causam dano em área 3x3 "para fora do centro". Devido às
// células do sudoeste serem processadas primeiro, isso normalmente resulta em empurrão para o nordeste. Nas bordas, o empurrão
// será para fora do SG. A direção do empurrão também pode ser influenciada por Ganbantein e Land Protector. Se você
// abrir um buraco no SG, isso pode criar um efeito de "sucção".
// Se você desativar esta configuração, a direção do empurrão será completamente aleatória (estilo eAthena).
stormgust_knockback: yes

// Para RENEWAL_CAST (Nota 2)
// Por padrão, habilidades que possuem valor '-1' para Tempo de Conjuração Fixo usarão 20% do tempo de conjuração
// como Tempo de Conjuração Fixo, e o restante (80%) como Tempo de Conjuração Variável.
// Coloque 0 para desativar o Tempo de Conjuração Fixo padrão (assim como 0 no skill_db.yml).
default_fixed_castrate: 20

// Nos servidores oficiais, habilidades que atingem todos os alvos em um caminho (ex: Focused Arrow Strike e First Wind) primeiro
// calculam uma das oito direções e então aplicam uma área baseada nessa direção. Isso significa que podem existir
// áreas que essas habilidades não conseguem atingir. Se você mirar em um monstro em uma dessas áreas, apenas esse monstro será atingido.
// As habilidades de terceira classe Flame Launcher e Cannon Spear podem errar completamente.
// Defina como "no" para calcular um caminho do conjurador até o alvo e atingir tudo próximo a esse caminho.
// Você pode ajustar splash e maxcount no skill_db para modificar a largura e o comprimento dessas habilidades.
// Nota: Brandish Spear sempre usará este algoritmo devido ao seu comportamento especial de dano.
skill_eightpath_algorithm: yes

// Habilidades que usam skill_eightpath_algorithm devem incluir alvos na célula do conjurador?
// Oficial: yes
skill_eightpath_same_cell: yes

// Pode causar dano a unidades de habilidade como icewall e armadilhas (Nota 3)
// Nos servidores oficiais, jogadores podem causar dano a icewalls e algumas armadilhas com habilidades. Quando monstros usam habilidades, o dano
// aparece nas icewalls e armadilhas, mas na verdade não é subtraído da durabilidade.
// A configuração oficial torna bastante fácil prender MVPs, defina como 31 se quiser que todas as unidades possam
// causar dano a habilidades (comportamento anterior).
can_damage_skill: 1

// Comportamento do Land Protector (Nota 1)
// Nos servidores oficiais, jogadores que estão na borda (célula externa) do Land Protector ainda podem ser afetados/atingidos
// por habilidades em área (se a habilidade tiver efeito de splash, como Storm Gust). O comportamento Athena ignora os efeitos/atingimentos
// enquanto os jogadores estão na borda.
// Oficial: 0
// Athena legado: 1
land_protector_behavior: 0

// Comportamento da habilidade NPC EMOTION (Nota 1)
// Nos servidores oficiais, certos monstros lançam a habilidade NPC EMOTION que exibe um emoticon e muda seu modo de
// Agressivo para Passivo por um certo tempo. O comportamento Athena não muda o modo para Passivo.
// Oficial: 0
// Athena legado: 1
npc_emotion_behavior: 0

// A habilidade Tarot Card of Fate deve ter a mesma chance para cada carta aparecer? (Nota 1)
// Chances oficiais: 15%: LOVERS | 10%: FOOL, MAGICIAN, HIGH PRIESTESS, STRENGTH, SUN | 8%: TEMPERANCE
// 7%: CHARIOT | 6%: THE HANGED MAN | 5%: DEATH, STAR | 2%: TOWER | 1%: WHEEL OF FORTUNE, DEVIL
// Se você definir como "yes", a chance de cada carta passa a ser 1/14.
tarotcard_equal_chance: no

// Dispel deve funcionar em músicas quando o alvo não está na área da música? (Nota 1)
// Nos servidores oficiais, é impossível dissipar músicas.
// Dica: Também afeta a habilidade "Vanishing Buster" do Rebellion.
dispel_song: no

// A duração dos buffs de música deve ser renovada ao reentrar na área da música? (Nota 1)
// Oficialmente, quando você sai da área da música, a duração do buff se torna finita e não pode ser renovada até terminar.
refresh_song: no

// O ícone do buff de música deve mostrar a duração real? (Nota 1)
// Se no, ele sempre mostrará como infinito.
// Se yes, sempre que o buff alternar entre infinito e finito (ou vice-versa), o ícone será atualizado.
// Observe que em clientes renewal, atualizar o ícone também mostra novamente a animação do buff.
refresh_song_icon: no

// Duração do estado sentado da Banana Bomb da habilidade Make Bomb do Genetic.
// A duração oficial é 1000ms * nível da classe do lançador / 4.
// 0: Usa a duração oficial
// X: Informe uma duração personalizada em milissegundos.
banana_bomb_duration: 0

