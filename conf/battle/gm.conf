//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente Traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é uma opção de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor está em porcentagem (100 significa 100%)
//--------------------------------------------------------------

// O símbolo que será usado para reconhecer comandos.
// Você pode definir qualquer caractere único, exceto:
// - caracteres de controle (0x00-0x1f),
// - '%' (símbolo do chat de grupo)
// - '$' (símbolo do chat de guilda)
// - '/' (símbolo de comandos do cliente)
// atcommand_symbol representa comandos @ usados localmente.
// charcommand_symbol representa comandos # usados em outros jogadores.
atcommand_symbol: @
charcommand_symbol: #

// Quantidade máxima de monstros que podem ser invocados por comando de GM
// (0 indica quantidade ilimitada)
atcommand_spawn_quantity_limit: 100

// Número máximo de clones escravos que podem existir ao usar o comando @slaveclone
// (0 indica quantidade ilimitada)
atcommand_slave_clone_limit: 25

// Se 'no', os comandos exigem o nome exato do jogador.
// Se 'yes', inserir um nome parcial funcionará, desde que exista apenas uma
// correspondência entre todos os jogadores no servidor de mapas atual.
// Alguns atcommands críticos como jail, ban e alguns outros ainda exigirão
// que o nome completo seja informado.
// Sempre funcionará para charcommands quando esta opção estiver habilitada.
partial_name_scan: yes

// Banir pessoas que tentarem duplicação via trade.
// Duração do banimento, em minutos (padrão: 5). Para desativar o banimento, defina como 0.
ban_hack_trade: 5

// Requer RENEWAL_EXP ou RENEWAL_DROP habilitado (src/config/renewal.hpp)
// Modifica o @mobinfo para exibir a taxa real de drop do usuário conforme a fórmula renewal_drop
// Modifica o @iteminfo para não exibir a taxa mínima de drop do item (pois não é possível saber o nível do monstro)
// Modifica o @whodrops para exibir a taxa real de drop do usuário conforme a fórmula renewal_drop
atcommand_mobinfo_type: 1

// Os atcommands devem acionar eventos de level up para NPCs? (Nota 1)
// Esta opção é para @baselevelup e @joblevelup
// Padrão: no
atcommand_levelup_events: no

// Desativar atcommands enquanto um jogador estiver anexado a um NPC? (Nota 1)
// Isto pode ser alterado pelos comandos de script 'enable_command' e 'disable_command'.
// Qualquer pessoa com a permissão 'command_enable' em 'conf/group.conf' pode ignorar isso.
// Padrão: yes
atcommand_disable_npc: yes
