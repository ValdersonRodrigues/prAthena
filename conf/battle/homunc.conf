//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um seletor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor é em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se não houver descrição,
//         assuma os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Configuração dos Homúnculos (Nota 3)
// Ativa vários "comportamentos especiais" que fazem eles se comportarem diferente dos personagens normais.
// 0x01: Não podem ser alvo de habilidades de suporte (exceto do seu mestre)
// 0x04: Monstros sempre irão atacá-los em vez dos jogadores até serem atacados
// 0x08: Copiam a velocidade do mestre ao nascer / mudar de mapa
// 0x10: Exibem luk/3+1 em vez do crítico real na janela de status
//       (por padrão eles não possuem crítico)
// 0x20: O Matk mínimo é sempre igual ao máximo
hom_setting: 0x3D

// O tempo de recarga (cooldown) ou atraso pós-conjuração das habilidades do homúnculo
// deve ser resetado quando o homúnculo é vaporizado?
// Padrão nos servidores oficiais: sim para Pré-Renovação, não para Renovação
//hom_delay_reset_vaporize: no

// O tempo de recarga (cooldown) ou atraso pós-conjuração das habilidades do homúnculo
// deve ser resetado ao teleportar ou mudar de mapa?
// Padrão nos servidores oficiais: sim para Pré-Renovação, não para Renovação
//hom_delay_reset_warp: no

// Taxa em que um homúnculo ganha afinidade ao ser alimentado. (Nota 2)
homunculus_friendly_rate: 100

// É possível renomear um homúnculo mais de uma vez? (Nota 1)
hom_rename: no

// Afinidade mínima para evoluir o homúnculo
homunculus_evo_intimacy_need: 91100

// Afinidade redefinida após a evolução para:
homunculus_evo_intimacy_reset: 1000

// Afinidade necessária para usar Bio Explosion do Vanilmirth Evoluído
hvan_explosion_intimate: 45000

// Mostrar crescimento de atributos para o dono quando o homúnculo sobe de nível
homunculus_show_growth: yes

// O autoloot funciona quando o monstro é morto apenas pelo homúnculo?
homunculus_autoloot: no

// Os homúnculos devem ser vaporizados quando o mestre morrer? (Nota 2)
// Um homúnculo não será vaporizado se o HP estiver abaixo de 80%.
homunculus_auto_vapor: 80

// Nível máximo para Homúnculos normais
homunculus_max_level: 99

// Nível máximo para Homúnculos S
homunculus_S_max_level: 275

// Nível de crescimento para Homúnculos S
// Este é o nível no qual Homúnculos S podem usar suas tabelas de crescimento
// Sem isso, um embaralhamento faz com que todos os níveis de um Homúnculo S usem
// suas tabelas de crescimento, causando atributos desbalanceados
homunculus_S_growth_level: 99

// Enviar aviso de auto-alimentação mesmo quando estiver OFF (Nota 1)
// Oficial: sim
homunculus_autofeed_always: yes

// O ganho de exp/itens do homúnculo é desativado quando o mestre está inativo?
// Defina como no, ou como o número de segundos (NÃO milissegundos) antes de considerar
// o personagem inativo.
// Personagens em chat/venda são sempre considerados inativos.
// O status de inatividade é resetado ao usar item/habilidade/atacar (ataque automático conta)/mover.
// O mestre só receberá itens se 'homunculus_autoloot' estiver ativado,
// caso contrário, eles cairão normalmente no chão.
// NOTA: Esta opção usa um temporizador especial separado do temporizador normal de inatividade.
hom_idle_no_share: no

// Como o servidor deve medir o tempo de inatividade do mestre do homúnculo?
// (apenas para compartilhamento de exp do homúnculo e autoloot) (Nota 3)
// (Funciona apenas se 'hom_idle_no_share' estiver ativado).
// 0x001 - Pedido de movimento
// 0x002 - Pedido UseSkillToID (uso de habilidade com alvo)
// 0x004 - Pedido UseSkillToPos (uso de habilidade em área)
// 0x008 - Pedido UseItem (inclui equipar/desequipar)
// 0x010 - Pedido de ataque
// 0x020 - Pedido de chat (Whisper, Party, Guild, Battlegrounds, etc)
// 0x040 - Pedido Sentar/Levantar
// 0x080 - Pedido de emoção
// 0x100 - Pedido de dropar item
// 0x200 - Pedido de comando @/#
// Observe que pelo menos 1 opção deve estar ativada.
// Quanto mais opções usadas, mais fácil se torna burlar este sistema.
// Padrão: walk (0x1) + useskilltoid (0x2) + useskilltopos (0x4) + useitem (0x8) + attack (0x10) = 0x1F
// NOTA: Isso permite configurar opções separadas para homúnculos,
// independente do temporizador normal de inatividade e da opção 'idletime_option'.
// Aplica-se apenas a mortes causadas por homúnculos e não afeta autoloot normal nem divisão de exp de party.
idletime_hom_option: 0x1F

// Taxa em que os homúnculos ganham experiência ao matar monstros. (Nota 2)
// Aplica-se apenas ao modo Renewal.
// Oficial: 10%
homunculus_exp_gain: 10

// Taxa de fome (menor ou igual a) na qual o atraso de fome do homúnculo muda. (Nota 2)
// Veja 'homunculus_starving_delay' para o valor do atraso.
// Defina como 0 para desativar.
// Oficial: 10
homunculus_starving_rate: 10

// Normalmente os homúnculos perdem fome a cada 60 segundos, mas quando
// 'homunculus_starving_rate' é atingido, o atraso cai para 20 segundos (em milissegundos).
// Oficial: 20 segundos
homunculus_starving_delay: 20000