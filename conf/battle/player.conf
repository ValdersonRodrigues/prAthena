//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um interruptor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor é em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for dada,
//         assuma os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Taxa do HP máximo dos jogadores? (Padrão é 100)
hp_rate: 100

// Taxa do SP máximo dos jogadores? (Padrão é 100)
sp_rate: 100

// As cartas e atributos da mão esquerda são aplicados ao ataque da mão direita? (Nota 1)
// (É 'yes' nos servidores oficiais)
left_cardfix_to_right: yes

// Quantidade de HP com que o jogador irá renascer, 0 é o padrão.
// (Unidade em porcentagem do HP total, 100 é cura total de HP, 0 é renascer com 1 HP total.)
restart_hp_rate: 0

// Quantidade de SP com que o jogador irá renascer, 0 é o padrão.
// (Unidade em porcentagem do SP total, 100 é cura total de SP, 0 é renascer com 1 SP total.)
restart_sp_rate: 0

// Um jogador normal pode ignorar a árvore de habilidades? (Nota 1)
player_skillfree: no

// Quando definido como yes, força os pontos de habilidade ganhos na 1ª classe
// a serem usados em habilidades da 1ª classe, e força os pontos de habilidade de aprendiz
// a serem usados na habilidade básica. (Nota 1)
player_skillup_limit: yes

// Habilidades de quest podem ser aprendidas? (Nota 1)
// Definir como yes pode abrir um exploit no seu servidor!
quest_skill_learn: no

// Quando as habilidades são resetadas, as habilidades de quest também são resetadas? (Nota 1)
// Definir como yes pode abrir um exploit no seu servidor!
// NOTA: Se quest_skill_learn estiver como yes, as habilidades de quest sempre serão resetadas.
quest_skill_reset: no

// É necessário ter habilidades básicas para sentar, negociar, formar um grupo ou criar uma sala de chat? (Nota 1)
basic_skill_check: yes

// Ao teleportar ou aparecer em um mapa, quanto tempo até um monstro te ver se você não se mover? (tempo em milissegundos)
// Ou seja, ao entrar em um mapa e não se mover, quanto tempo até os monstros te perceberem.
// Se você atacar um monstro, ele irá te atacar de volta independentemente desta configuração.
// Durante esse tempo, você também fica protegido contra dano.
// Este valor pode ser sobrescrito em mapas específicos com a mapflag 'invincible_time'.
player_invincible_time: 3000

// Intervalo de tempo para o HP se recuperar naturalmente. (em milissegundos)
natural_healhp_interval: 6000

// Intervalo de tempo para o SP se recuperar naturalmente. (em milissegundos)
natural_healsp_interval: 8000

// Intervalo de tempo da habilidade de cura automática. (em milissegundos)
natural_heal_skill_interval: 10000

// Peso máximo que um personagem pode carregar antes de parar a cura natural. (Nota 2)
// Dependendo desta configuração, pode ser necessário alterar a imagem TGA correspondente
// nos seus dados para mostrar a porcentagem correta no ícone de status.
// Padrão nos servidores oficiais: 50 para Pre-renewal, 70 para Renewal
//natural_heal_weight_rate: 70

// Peso máximo para um personagem obter item de caixas de itens. (Nota 2)
// Padrão nos servidores oficiais: 70 para Pre-renewal, 90 para Renewal
//open_box_weight_rate: 90

// Peso máximo para um personagem entrar no estado de sobrepeso grave. (Nota 2)
// Nesse estado o personagem não pode se curar naturalmente, atacar ou usar habilidades.
major_overweight_rate: 90

// Velocidade máxima de ataque (ASPD). (Padrão 190, Máximo permitido 199)
max_aspd: 199

// Igual ao max_aspd, mas para 3ª classe. (Padrão 193, Máximo permitido 199)
max_third_aspd: 197

// ASPD máxima para classes estendidas (Kagerou/Oboro e Rebellion). (Padrão 193, Máximo permitido 199)
max_extended_aspd: 197

// ASPD máxima para a classe Summoner (Doram). (Padrão 193, Máximo permitido 199)
max_summoner_aspd: 197

// Taxa máxima de velocidade de movimento (200 seria o dobro da velocidade normal)
max_walk_speed: 300

// HP máximo dependendo do nível base. Valores padrão:
// Lv 99:  330000
// Lv150:  660000
// Lv175: 1100000
max_hp_lv99: 330000
max_hp_lv150: 660000
max_hp: 1100000

// SP máximo. (Padrão é 1000000)
max_sp: 1000000

// Parâmetros/atributos máximos para cada classe. (str, agi, vit, int, dex e luk)
// 'max_parameter' para aprendiz, não-trans, não-baby e não-3ª classe
// 'max_trans_parameter' para classes trans (não-3ª trans)
// 'max_third_parameter' para 3ª classe (normal/não-trans), exceto baby 3ª classe
// 'max_third_trans_parameter' para 3ª classe trans
// 'max_baby_parameter' para classes baby exceto baby 3ª classe
// 'max_baby_third_parameter' apenas para baby 3ª classe
// 'max_extended_parameter' para 2ª classe estendida (Kagerou/Oboro e Rebellion)
// Para opções mais específicas/avançadas, veja 'db/[pre-]re/job_params_db.txt'
max_parameter: 
max_trans_parameter: 255
max_third_parameter: 255
max_third_trans_parameter: 255
max_baby_parameter: 255
max_baby_third_parameter: 255
max_extended_parameter: 255
max_summoner_parameter: 255
max_fourth_parameter: 255

// Bônus de pontos de status para classe transcendente
transcendent_status_points: 255

// Defesa/mdef máxima de armadura
// NOTA: Esta configuração não tem efeito se o servidor estiver em modo Renewal (RENEWAL)
// NOTA: Não afeta habilidades e efeitos de status como Força Mental
// Se weapon_defense_type for diferente de zero, não se aplica ao max def.
// Se magic_defense_type for diferente de zero, não se aplica ao max mdef.
max_def: 99

// Bônus de conversão de Def para Def2. Se a def/mdef da armadura exceder max_def,
// o excedente é convertido em vit def/int mdef usando este multiplicador
// (ex: se definido como 10, cada ponto acima do máximo vira 10 pontos de defesa vit)
over_def_bonus: 0

// Peso máximo que os carrinhos podem carregar.
max_cart_weight: 8000

// Impedir logout de jogadores após serem atingidos por quanto tempo (em ms, 0 desativa)?
prevent_logout: 10000

// Quando o servidor deve impedir um jogador de sair? Não tem efeito se prevent_logout estiver desativado. (Nota 3)
// Servidores oficiais impedem logout após atacar, usar habilidades e receber dano.
// 0 = Jogadores sempre podem sair
// 1 = Impedir logout ao logar
// 2 = Impedir logout após atacar
// 4 = Impedir logout após usar habilidade
// 8 = Impedir logout após ser atingido
prevent_logout_trigger: 14

// Mostrar os valores de HP/SP drenados por ataques normais? (Ex: carta Mosca Caçadora)
show_hp_sp_drain: no

// Mostrar os valores de HP/SP ganhos ao matar monstros? (Ex: carta Sky Deleter)
show_hp_sp_gain: yes

// Se ativado, quando A aceita B como amigo, B também será adicionado à lista de amigos de A,
// caso contrário, apenas A aparece na lista de B.
// NOTA: esta configuração ativa auto-adição e auto-remoção de amigos.
friend_auto_add: yes

// Convites simultâneos de trade/grupo/guilda são rejeitados automaticamente?
invite_request_check: yes

// Jogadores irão dropar uma 'Caveira' ao serem mortos?
// Nota: O item 'Skull' (ID 7420) é restrito para troca por padrão. Você precisa
// remover a flag "NoTrade" do item para este recurso funcionar.
// 0 = Desativado
// 1 = Dropa apenas em mapas PvP
// 2 = Dropa em todas as situações
bone_drop: 0

// Personagens montados (em Peco) aumentam seu tamanho?
// 0 = não
// 1 = apenas Classes Normais no Peco ficam com Tamanho Grande
// 2 = apenas Classes Baby no Peco ficam com Tamanho Médio
// 3 = Classes Normais ficam Grandes
//     e Classes Baby ficam Médias
character_size: 0

// Personagens inativos podem receber autoloot?
// Defina o tempo em segundos para que um personagem inativo pare de receber
// itens do Autoloot (0: desativado).
idle_no_autoloot: 0

// Distância mínima que uma loja/sala de chat deve estar de um NPC para ser criada.
// Padrão: 3 (0: desativado).
min_npc_vendchat_distance: 3
 
// Quanto as montarias alugadas devem aumentar a velocidade de movimento do jogador?
// Padrão é 25. 100 = 100% de aumento.
rental_mount_speed_boost: 25

//===================================
// Sistema VIP
//===================================
// Aumento de slots do armazém. Definir como 0 desativa.
// Dá mais slots acima do limite MIN_STORAGE.
// Nota: MIN_STORAGE + vip_storage_increase não pode exceder MAX_STORAGE.
// Padrão: 300
vip_storage_increase: 300

// Aumento da taxa de experiência base. Definir como 0 desativa. (Nota 2)
// Padrão: 50
vip_base_exp_increase: 50

// Aumento da taxa de experiência de job. Definir como 0 desativa. (Nota 2)
// Padrão: 50
vip_job_exp_increase: 50

// Multiplicador da penalidade de experiência para contas VIP.
// Padrão: 100 (100 = 1% de penalidade)
vip_exp_penalty_base: 100
vip_exp_penalty_job: 100

// Penalidade de Zeny para contas VIP.
// Perda de Zeny só ocorre se o jogador morrer para outro jogador.
// Padrão: 0 (100 = 1% de penalidade)
vip_zeny_penalty: 0

// Aumento de experiência do Manual de Batalha. Definir como 0 desativa.
// - Manual de Batalha normal/grosso: 50+(50/X) = 75%
// - Manual de Batalha HE: 100+(100/X) = 150%
// - Manual de Batalha x3: 200+(200/X) = 300%
// Nota: X é o valor da configuração.
// Padrão: 2
vip_bm_increase: 2

// Aumento de drop de itens. Definir como 0 desativa.
// Nota: 50 = 50% de aumento de drop.
// Para item_rate = 200: 200 * 50 / 100 = 100 de bônus somado ao base 200, totalizando 300.
// Padrão: 50
vip_drop_increase: 50

// Requisito de Gemstone.
// O grupo VIP pode ignorar o requisito de Gemstone para habilidades?
// 0 = Desativado
// 1 = Comportar como a Carta Mistress
// 2 = Remover todos os requisitos de gemstone (padrão)
vip_gemstone: 2

// Mostrar informações de taxa (EXP, Drop e mensagem de penalidade por morte)? (Nota 1)
vip_disp_rate: yes

// Reviver jogador morto ao teleportar? (Nota 1)
revive_onwarp: yes

// Nível base mínimo para receber bônus de Taekwon Ranker
// - 3x HP e SP máximos
// - Todas as habilidades de Taekwon
taekwon_ranker_min_lv: 90

// Pontos de fama ganhos
// Missão de Taekwon concluída
fame_taekwon_mission: 1
// Refinar arma forjada própria até +10
fame_refine_lv1: 1
fame_refine_lv2: 25
fame_refine_lv3: 1000
// Sucesso ao forjar uma arma nível 3 com 3 ingredientes adicionais
fame_forge: 10
// Limite de refino para dar ponto ao refinar arma forjada até +10
blacksmith_fame_refine_threshold: 10
// Sucesso ao preparar 'n' Poções Condensadas em sequência
fame_pharmacy_3: 1
fame_pharmacy_5: 3
fame_pharmacy_7: 10
fame_pharmacy_10: 50

// Como o servidor deve medir o tempo ocioso do personagem? (Nota 3)
// 0x0001 - Requisição de andar
// 0x0002 - Uso de habilidade em alvo (UseSkillToID)
// 0x0004 - Uso de habilidade em área (UseSkillToPos)
// 0x0008 - Uso de item (inclui equipar/desequipar)
// 0x0010 - Ataque
// 0x0020 - Chat (Sussurro, Grupo, Guilda, Battleground, etc)
// 0x0040 - Sentar/Levantar
// 0x0080 - Emoção
// 0x0100 - Dropar item
// 0x0200 - Comando @/#
// 0x0400 - Fechar janela de NPC
// 0x0800 - Fornecer entrada a NPC
// 0x1000 - Escolher opção no menu do NPC
// 0x2000 - Clicar no botão "próximo" do NPC
// 0x4000 - Finalizar barra de progresso do NPC
// Note que pelo menos 1 opção deve estar ativada.
// Quanto mais opções, mais fácil é burlar sistemas baseados em tempo ocioso (ex: checkidle()).
// Padrão: walk (0x1) + useskilltoid (0x2) + useskilltopos (0x4) + useitem (0x8) + attack (0x10)
// + qualquer interação com NPC (0x400,0x800,0x1000,0x2000,0x4000) = 0x7C1F
idletime_option: 0x7C1F

// Ajustar características especiais da classe Summoner.
// - Summoners pertencem à raça brute. Eles têm sua própria raça RC_PLAYER_DORAM (11)
//   para diferenciar da raça de monstros RC_BRUTE (2).
// - Summoners são de tamanho pequeno (0) ao invés de médio (1)
summoner_race: 11
summoner_size: 0

//================================
// Sistema de 4ª Classe
//================================
// Quantos pontos de traço (trait) os jogadores recebem ao mudar para 4ª classe?
// Padrão: 7
trait_points_job_change: 7

// Limite máximo dos atributos de traço.
// Atributos de traço: POW, STA, WIS, SPL, CON, CRT
// Oficial é 110.
max_trait_parameter: 110

// Percentual máximo de RES/MRES que pode ser ignorado por bônus de item/habilidade.
// Padrão: 50
max_res_mres_ignored: 50

// AP máximo
// Padrão: 1000
max_ap: 1000

// Taxa do AP máximo dos jogadores? (Padrão é 100)
ap_rate: 100

// Quantidade de AP com que o jogador irá renascer, 0 é o padrão.
// (Unidade em porcentagem do AP total, 100 é AP cheio, 0 é renascer com 0 AP.)
restart_ap_rate: 0

// AP é perdido quando o jogador morre?
// Padrão: yes
loose_ap_on_death: yes

// AP é perdido quando o jogador entra em mapas PVP/GVG/WoE/Battleground?
// Padrão: yes
loose_ap_on_map: yes

// O jogador mantém o AP ao deslogar?
// Padrão: yes
keep_ap_on_logout: yes
