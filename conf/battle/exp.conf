//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Traduzido originalmente por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é uma opção de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor está em porcentagem (100 significa 100%)
// Nota 3: O nível máximo das classes é armazenado na tabela de EXP.
//         Veja os arquivos db/exp.txt e db/exp2.txt para alterá-los.
//--------------------------------------------------------------

// Taxa na qual a EXP base é concedida. (Nota 2)
base_exp_rate: 50000

// Taxa na qual a EXP de classe (job) é concedida. (Nota 2)
job_exp_rate: 50000

// Ative isto para permitir que um jogador suba mais de um nível com uma única morte. (Nota 1)
multi_level_up: yes

// Permitir múltiplos níveis até um determinado nível?
// Isto só é acionado se multi_level_up estiver habilitado.
// Padrão: 0 (Ilimitado)
multi_level_up_base: 0
multi_level_up_job: 0

// Esta configuração pode limitar a experiência máxima que alguém pode obter por morte,
// especificada como uma % da barra de EXP atual. (A cada 10 = 1.0%)
// Por exemplo, se definir como 500, não importa quanta EXP o monstro conceda,
// ele nunca poderá fornecer mais que metade da barra de EXP atual.
max_exp_gain_rate: 0

// Método de cálculo da experiência obtida ao derrotar um monstro:
// 0 = usa dano causado / dano total como proporção de dano
// 1 = usa dano causado / HP máximo como proporção de dano
// 2 = igual a 0 + o primeiro atacante conta em dobro
exp_calc_type: 0

// Aumento de experiência por atacante. Ou seja, cada atacante adicional ao
// monstro faz com que ele conceda esta quantidade a mais de experiência
// (ex: 5 pessoas atacam com 25 aqui, +(25*4)% -> +100% de EXP)
exp_bonus_attacker: 25

// Número máximo de atacantes em que o bônus de EXP é limitado
// (ex: se definido como 5, o bônus máximo é 4*bonus-por-jogador, independentemente do número de atacantes)
exp_bonus_max_attacker: 12

// Conjurar habilidades que não causam dano ainda faz você contar como atacante? (Nota 1)
// Definir como yes faz habilidades como Lex Aeterna aumentarem a EXP que o monstro concede.
// Oficialmente, é necessário causar dano para contar.
exp_bonus_nodamage_attacker: no

// Taxa de bônus de EXP de MVP. (Nota 2)
mvp_exp_rate: 100

// Taxa de EXP base/job concedida por NPCs. (Nota 2)
quest_exp_rate: 100

// Taxa de EXP de classe (job) ao usar a habilidade Cura (Heal)
// (100 é igual à quantidade curada, 200 é o dobro.
// O equilíbrio da taxa de EXP é melhor utilizado entre 5 e 10)
heal_exp: 0

// Taxa de EXP obtida pelo processo de ressurreição, uma unidade é 0.01%.
// O cálculo da experiência é: valor da EXP * diferença de nível da pessoa ressuscitada / 100 * resurrection_exp/10000.
resurrection_exp: 0

// Taxa de EXP de classe (job) ao usar Desconto (Discount) e Superfaturar (Overcharge) em um NPC
// (em incrementos de 0.01% - 100 é 1%, 10000 é normal, 20000 é o dobro.)
// O cálculo é: (dinheiro recebido * nível da habilidade) * shop_exp / 10000.
shop_exp: 0

// EXP em PvP. Os jogadores recebem EXP em mapas PvP?
// (Nota: NÃO é EXP de jogadores, mas de progressão normal)
pvp_exp: yes

// Quando um jogador morre, como ele deve ser penalizado?
// 0 = Sem penalidade.
// 1 = Perde % do nível atual ao morrer.
// 2 = Perde % da experiência total ao morrer.
death_penalty_type: 1

// Taxa de penalidade de EXP base (Cada 100 equivale a 1% da EXP)
death_penalty_base: 100

// Taxa de penalidade de EXP de classe (job) (Cada 100 equivale a 1% da EXP)
death_penalty_job: 100

// Quando um jogador morre (para outro jogador), quanto de zeny deve ser penalizado?
// NOTA: É uma porcentagem do zeny, então 100 = 1%
zeny_penalty: 0

// Jogadores no nível máximo base/job perderão EXP ao morrer?
// 0: Nunca perde (padrão, como nos servidores oficiais).
// 1: Perde EXP base.
// 2: Perde EXP de classe (job).
death_penalty_maxlv: 0

// Exibirá a experiência obtida ao matar um monstro. (Nota 1)
disp_experience: no

// Exibirá o zeny obtido (de monstros, trocas, etc). (Nota 1)
disp_zeny: no

// Usar o conteúdo de db/statpoint.txt ao redefinir atributos e ao subir de nível? (Nota 1)
// Se não, uma equação será usada que preserva pontos de atributo ganhos/perdidos
// por meios externos (ex: compradores/vendedores de pontos de atributo)
use_statpoint_table: yes

// Usar o conteúdo de db/statpoint.yml ao redefinir atributos e ao subir de nível? (Nota 1)
// Se não, uma equação será usada que preserva pontos de traço (trait points) ganhos/perdidos
// por meios externos (ex: compradores/vendedores de pontos de traço)
use_traitpoint_table: yes

// Custo de EXP para conjurar PR_REDEMPTIO (Nota 2)
exp_cost_redemptio: 1

// Quantos jogadores são necessários para que a penalidade de EXP do PR_REDEMPTIO se torne 0?
// Se, por padrão, 'exp_cost_redemptio' for 1 (1%) e cada jogador ressuscitado reduzir a penalidade para 0.2%,
// isso significa que 'exp_cost_redemptio_limit' é 5.
exp_cost_redemptio_limit: 5