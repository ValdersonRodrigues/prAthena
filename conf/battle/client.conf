//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um interruptor de configuração (ligado/desligado, sim/não ou 1/0)
// Nota 2: O valor está em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for fornecida,
//         assuma os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário)
//--------------------------------------------------------------

// Atraso mínimo entre mensagens privadas/globais/grupo/guilda (em ms)
// Mensagens que violarem esse limite são silenciosamente omitidas.
min_chat_delay: 0

// Intervalo válido de tinturas e estilos no cliente.
min_hair_style: 0
max_hair_style: 42
min_hair_color: 0
max_hair_color: 8
min_cloth_color: 0 
max_cloth_color: 7

// Quando definido como yes, o campo de dano nos pacotes enviados de mapas de WoE será definido
// como -1, tornando impossível para GMs, Bots e clientes modificados saberem o
// dano real causado pelos ataques. (Nota 1)
hide_woe_damage: no

// Número de "estilo de cabelo" que identifica um pet.
// NOTA: O cliente usa o campo "estilo de cabelo" no pacote do mob para diferenciá-los de monstros.
// Este valor é sempre maior que o estilo de cabelo máximo disponível no cliente em questão.
// Valores conhecidos que funcionam (todos os clientes de 2005):
// sakexes mais antigos: 20
// sakexe 0614: 24
// sakexe 0628 (e posteriores): 100
pet_hair_style: 100

// Tamanho da área visível (quantos quadrados de distância um jogador pode ver)
area_size: 14

// Caminho máximo de caminhada (quantas células um jogador pode andar indo até o cursor)
max_walk_path: 17

// Valor máximo permitido de 'nível' que pode ser enviado nos pacotes de unidades.
// Use em conjunto com a configuração aura_lv para definir exatamente quando mostrar a aura.
// NOTA: Você também precisa ajustar o cliente se quiser que isso funcione.
// NOTA: O padrão é 99. Valores acima de 127 provavelmente se comportarão incorretamente.
// NOTA: Se você não sabe o que isso faz, não altere!!!
max_lv: 99

// Nível necessário para exibir uma aura.
// NOTA: Isso assume que enviar max_lv ao cliente exibirá a aura.
// NOTA: aura_lv não deve ser menor que max_lv.
// Exemplo: Se max_lv for 99 e aura_lv for 150, personagens com nível 99~149
//          serão enviados como estando todos no nível 98, e apenas personagens com nível
//          150 ou mais serão reportados como tendo nível 99 e mostrarão uma aura.
aura_lv: 99

// Tipos de unidades afetadas pelas configurações max_lv e aura_lv. (Nota 3)
// Nota: Se um tipo de unidade, que normalmente não exibe aura, for
//       definido, ele obterá uma aura quando atender ao requisito de nível.
// Padrão: 0 (nenhum)
client_limit_unit_lv: 0

// Ternos e vestidos de casamento serão exibidos quando equipados? (Nota 1)
wedding_modifydisplay: no

// Salvar cor das roupas. (Isso degrada o desempenho) (Nota 1)
save_clothcolor: yes

// Salvar estilos de corpo. (Nota 1)
save_body_style: yes

// Não exibir cores de roupas para a classe de casamento?
// Nota: Tanto save_clothcolor quanto wedding_modifydisplay precisam estar ativados
// para que esta opção tenha efeito. Defina como yes se o seu pacote de paletas de roupas
// não possui paletas de casamento (ou possui menos do que as outras classes)
wedding_ignorepalette: no

// Não exibir cores de roupas para o traje de Natal?
// Defina como yes se o seu pacote de paletas de roupas não possui paletas de Natal (ou possui menos do que as outras classes)
xmas_ignorepalette: no

// Não exibir cores de roupas para o traje de Verão?
// Defina como yes se o seu pacote de paletas de roupas não possui paletas de Verão (ou possui menos do que as outras classes)
summer_ignorepalette: no

// Não exibir cores de roupas para o traje Hanbok?
// Defina como yes se o seu pacote de paletas de roupas não possui paletas Hanbok (ou possui menos do que as outras classes)
hanbok_ignorepalette: no

// Não exibir cores de roupas para o traje de Oktoberfest?
// Defina como yes se o seu pacote de paletas de roupas não possui paletas de Oktoberfest (ou possui menos do que as outras classes)
oktoberfest_ignorepalette: no

// Defina como 1 se seus clientes tiverem problemas de langtype e não conseguirem exibir o motd corretamente
motd_type: 0

// Mostrar a versão do rAthena aos usuários no login?
display_version: yes

// Quando afetado pelo efeito de status "Alucinação", enviar o efeito ao cliente? (Nota 1)
// NOTA: Defina como 'no' se o cliente apresentar lag devido ao efeito de tela "Ondulado".
display_hallucination: yes

// Defina como 1 se seu cliente suportar temporizadores de alteração de status e você quiser usá-los
// Clientes a partir de 2009 suportam isso
display_status_timers: yes

// Embaralha o emoticon de dado no lado do servidor, para impedir que clientes forjem
// pacotes para obter o número desejado. (Nota 1)
client_reshuffle_dice: yes

// Ordena o carrinho, armazém da guilda, inventário e armazém antes de enviá-los ao cliente. (Nota 1)
// Servidores oficiais não os ordenam.
// NOTA: Ativar esta opção degrada o desempenho.
client_sort_storage: no

// Atualizar a posição do inimigo enquanto estiver em estado invisível? (Nota 1)
// NOTA: Definir como 'no' fará com que o cliente não atualize a posição do inimigo,
//       a menos que os jogadores tenham o efeito "Intravision".
//       Isso ajuda o cliente a lidar com WPE e hacks como Maya Purple.
//       Porém, isso prejudicará a exibição das animações do jogo enquanto jogadores estiverem invisíveis.
update_enemy_position: yes

// Quando um jogador se teleporta, muda de mapa ou faz login, ele ficará voltado
// para a direção que estava antes do teleporte?
// Oficial: Desativado, jogadores sempre ficam voltados para o Norte.
spawn_direction: no

// Mostrar a mensagem de recompensa de EXP de MVP para clientes 2013-12-23cRagexe e mais novos? (Nota 1)
// O kRO removeu o pacote e isso reativa a mensagem.
// Oficial: Desativado.
mvp_exp_reward_message: no

// Enviar temporizador de ping
// Intervalo em segundos para cada execução do temporizador.
ping_timer_inverval: 30

// Tempo limite de envio de pacotes em segundos antes que o pacote de ping possa ser enviado.
ping_time: 20

// Mostrar escala de habilidades para clientes 2015-12-23 e mais novos? (Nota 1)
// Oficial: yes
show_skill_scale: yes

// A conexão deve ser encerrada no lado do servidor após receber uma solicitação de desconexão do jogador? (Nota 1)
// Nota: Ativar isso é conhecido por causar problemas em clientes que fazem uso de chamadas REST API.
// Oficial: no
drop_connection_on_quit: no

// Tentativas do Detector de Macro
// Número de vezes que alguém pode falhar na detecção de macro antes de ser banido.
// Oficial: 3 (mínimo: 1)
macro_detection_retry: 3

// Tempo limite do Detector de Macro
// Quantidade de tempo em milissegundos antes que a detecção de macro falhe e o usuário seja banido.
// Oficial: 60000
macro_detection_timeout: 60000

// Tipo de punição do Detector de Macro
// 0 - Banimento
// 1 - Prisão
// Oficial: 0
macro_detection_punishment: 0

// Duração da punição do Detector de Macro
// Quantidade de tempo em minutos que o tipo de punição ficará ativo. Use 0 para infinito.
// Oficial: 0
macro_detection_punishment_time: 0

// Atraso do verificador de macro (por mapa)
// Defina como 0 para desativar
macrochecker_delay: 600000

// Ocultar unidades camufladas ao entrarem no campo de visão? (Nota 3)
// Padrão (Oficial): 0
hide_cloaked_units: 0
