//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um seletor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor é em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se não houver descrição,
//         considere os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Modo PK do servidor. Transforma todo o servidor em PvP (exceto cidades).
// A perda de experiência é dobrada se for morto por outro jogador.
// Quando jogadores caçam monstros mais de 20 níveis acima, recebem 15% de EXP adicional
// e 25% de chance de obter mais itens.
// Existe um arquivo nopvp.txt para definir mapas sem PK neste modo.
// Noviços não podem atacar nem ser atacados.
// O contador e ranking normal de PvP também são desativados.
// Nota: Se pk_mode for definido como 2 em vez de 1 (yes), os jogadores receberão
//   uma penalidade de maneira (manner) de 5 toda vez que matarem outro jogador
//   (veja a configuração manner_system para ajustar como isso afeta os jogadores)
pk_mode: 0

// Exibe uma mensagem quando o jogador entra em uma zona PK.
// Apenas durante o pk_mode (Nota 1)
pk_mode_mes: yes

// Configuração do sistema de maneira/karma.
// Define como a maneira negativa (bolha de chat vermelha) afeta os jogadores (adicione conforme necessário):
//  0: Sem penalidades.
//  1: Desativa o chat (inclui whispers, mensagens de grupo/guilda, etc)
//  2: Desativa o uso de skills
//  4: Desativa o uso de comandos
//  8: Desativa o uso/coleta/descarte de itens
// 16: Desativa criação de salas (chatrooms e lojas de vending)
manner_system: 15

// Para Modo PK. Define o nível mínimo para os jogadores começarem a praticar PK
pk_min_level: 55

// Para Modo PK. Define a diferença máxima de nível entre jogadores
// para que possam se atacar. 0 desativa esse limite.
pk_level_range: 0

// Para servidores PK. Configurações de ajuste de dano, seguem a mesma lógica
// das configurações de WoE (veja guild.conf)
pk_short_attack_damage_rate: 80
pk_long_attack_damage_rate: 70
pk_weapon_attack_damage_rate: 60
pk_magic_attack_damage_rate: 60
pk_misc_attack_damage_rate: 60

// Mostrar uso de skills no console? (apenas para debug) (padrão: off) (Nota 3)
skill_log: off

// Mostrar log de batalha? (apenas para debug) (padrão: off) (Nota 1)
battle_log: off

// Mostrar outros logs? (apenas para debug) (padrão: off) (Nota 1)
etc_log: off

// Deseja depurar pontos de warp? Se definido como yes, os pontos de warp aparecerão como bandeiras. (Nota 1)
// Também será executada na inicialização uma verificação que mostra quais warps levam
// diretamente sobre NPCs de toque (o que pode causar loops infinitos de teleporte)
warp_point_debug: no

// Escolhe se o servidor começa à noite (yes) ou de dia (no)
night_at_start: no

// Define a duração do dia em milissegundos (padrão: 7200000 = 2 horas)
// Defina como 0 para desativar o ciclo de dia (mas não o comando GM @day).
// Exceto 0, o mínimo é 60000 (1 minuto)
day_duration: 0

// Define a duração da noite em milissegundos (padrão: 1800000 = 30 minutos)
// Defina como 0 para desativar o ciclo de noite (mas não o comando GM @night).
// Exceto 0, o mínimo é 60000 (1 minuto)
night_duration: 0

// Permitir duelos em mapas PvP
duel_allow_pvp: no

// Permitir duelos em mapas GvG
duel_allow_gvg: no

// Permitir usar teleport/warp durante um duelo
duel_allow_teleport: no

// Sair automaticamente do duelo ao morrer
duel_autoleave_when_die: yes

// Tempo de espera entre usos do comando @duel (em minutos)
duel_time_interval: 60

// Restringir o duelo ao mesmo mapa
duel_only_on_same_map: no

// Determina o número máximo de personagens que podem ficar empilhados em uma célula.
// Oficial - Afeta apenas a movimentação das unidades, incluindo monstros.
// Se uma unidade parar em uma célula com mais personagens do que o limite,
// ela andará até a célula livre mais próxima.
// Defina como 0 para não haver verificação de empilhamento.
// Customizado - Cada célula cheia é considerada uma parede.
// NOTA: Para o modo customizado funcionar, é necessário compilar o servidor
// com suporte a limite de empilhamento (ver src/map/map.hpp)
official_cell_stack_limit: 1
custom_cell_stack_limit: 1

// Permitir autotrade apenas em mapas com a flag autotrade?
// no = permite autotrade em qualquer mapa
// yes = permite apenas em mapas com flag autotrade
at_mapflag: no

// Tempo (em minutos) para personagens em autotrade serem desconectados do servidor.
at_timeout: 0

// Impede que o jogador seja atacado durante autotrade? (ativa state.monster_ignore) (Nota 1)
at_monsterignore: no

// O autotrade deve disparar o evento OnPCLogout dos scripts? (Nota 1)
at_logout_event: yes

// Sistema de leilão, taxa por hora. Padrão: 12000
auction_feeperhour: 12000

// Preço máximo de venda em leilão
auction_maximumprice: 500000000

// Atraso mínimo entre pesquisas na loja (em segundos)
searchstore_querydelay: 10

// Número máximo de resultados de uma pesquisa em lojas antes de ser cancelada
searchstore_maxresults: 30

// Mostrar ganho e perda de cash points? (Nota 1)
// Padrão: no
cashshop_show_points: no

// Mostrar status da caixa de correio ao logar.
// Padrão: 0
// 0 = Não
// 1 = Sim
// 2 = Sim, apenas quando houver mensagens não lidas
mail_show_status: 0

// Quantidade de cartas que um usuário pode enviar por dia.
// Padrão: 100
// 0 = Ilimitado
mail_daily_count: 100

// Taxa para enviar zeny por correio (Nota 2)
// NOTA: Esse valor é fixo no cliente, é necessário diffar o cliente se mudar.
// Padrão: 2 (2%)
// 0 = Sem taxa
mail_zeny_fee: 2

// Quantidade de zeny paga por item anexado
// NOTA: Esse valor é fixo no cliente.
// Padrão: 2500
// 0 = Sem taxa
mail_attachment_price: 2500

// Peso máximo total que pode ser anexado a uma carta
// NOTA: Esse valor é fixo no cliente.
// Padrão: 2000
// 0 = Sem limite de peso
mail_attachment_weight: 2000

// Transformação em monstro é desativada durante a Guerra do Emperium?
// Se yes, a transformação é removida automaticamente ao entrar nos castelos durante WoE
mon_trans_disable_in_gvg: no

// O preço dos itens em lojas de itens/pontos pode receber desconto?
// 0 = Não (Padrão)
// 1 = Lojas de itens
// 2 = Lojas de pontos
// 3 = Lojas de itens e pontos
discount_item_point_shop: 0

// Não exibir a mensagem "login-serv has been asked to %s the player '%.*s'." (Nota 1)
disp_servervip_msg: no

// Atraso para permitir reenviar um novo correio (padrão e mínimo é 1000)
mail_delay: 1000

// Oculta itens da aba de favoritos para não serem vendidos a NPC. (Nota 1)
hide_fav_sell: no

// Ao procurar uma posição aleatória no mapa, quanto da borda deve ser ignorado?
// Oficialmente 15 células da borda não são consideradas.
// Em alguns mapas isso reduz muito a quantidade de monstros nas áreas externas.
// Também afeta o teleporte.
// Valores válidos: 1-40
map_edge_size: 15

// Quando um jogador derruba itens, eles podem se empilhar na mesma célula? (Nota 1)
// Oficialmente não há limite de itens na mesma célula.
// Se definido como "no", o item só será jogado em uma célula vazia.
// O sistema tentará achar uma célula livre em oito direções.
// Se não encontrar, o item não será dropado (fica no inventário).
item_stacking: yes