//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um interruptor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor é em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for dada,
//         assuma os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Deve ser usada a fórmula antiga (legacy) para o cálculo da taxa de captura de pets? (Nota 1)
// Fórmula Legacy Athena:
//		( Taxa base + ( nível do jogador - nível do monstro ) * 30 + luk do jogador * 20 ) * ( 200 - porcentagem atual de HP do monstro ) / 100
// Fórmula oficial: (Padrão)
//		Taxa base + ( 100 - porcentagem atual de HP do monstro ) * taxa base / 100
pet_legacy_formula: no

// Taxa para capturar pets (Nota 2)
pet_catch_rate: 100

// Quantas células de distância o jogador pode estar do monstro que está tentando capturar?
// O cliente automaticamente anda até o alcance ao tentar capturar um monstro.
// Padrão: 5
// Defina como 0 para desativar a verificação
pet_distance_check: 5

// Em servidores oficiais, jogadores não conseguem capturar monstros se estiverem escondidos (hide). (Nota 1)
pet_hide_check: yes

// É possível nomear um pet mais de uma vez? (Nota 1)
pet_rename: no

// Taxa na qual um pet se torna amigável ao ser alimentado. (Nota 2)
pet_friendly_rate: 100

// Taxa na qual um pet ficará com fome. (Nota 2)
pet_hungry_delay_rate: 100

// O pet precisa do seu equipamento para usar sua habilidade? (Nota 1)
// Esses bônus são não-oficiais e estão em import/pet_db.yml
pet_equip_required: yes

// O equipamento do pet deve ser destruído se o dono não tiver espaço suficiente no inventário? (Nota 1)
// O comportamento oficial é "yes", definir como "no" fará o item permanecer equipado.
pet_unequip_destroy: yes

// Quando o mestre ataca um monstro, o pet também deve atacar? (Nota 1)
pet_attack_support: no

// Quando o mestre recebe dano de um monstro, o pet deve contra-atacar? (Nota 1)
pet_damage_support: no

// Intimidade mínima necessária para que o pet ajude seu mestre. Padrão é 900
// (a intimidade vai de 0 a 1000). Nesse mínimo, a taxa de suporte é 50% do valor normal do pet.
// No máximo (1000), a taxa de suporte é 150%.
pet_support_min_friendly: 900

// Define se os pets usarão habilidades. (Nota 1)
// Nota: Habilidades ofensivas dos pets precisam de pelo menos pet_attack_support ou
// pet_damage_support para funcionar (elas disparam enquanto o pet está atacando).
pet_status_support: no

// Taxa na qual o pet irá ajudar seu dono em batalha. (Nota 2)
// Afeta pet_attack_support e pet_damage_support.
pet_support_rate: 100

// O dono do pet recebe experiência do dano causado pelo pet?
pet_attack_exp_to_master: no

// Taxa de experiência ganha quando o pet ataca monstros
pet_attack_exp_rate: 100

// Sistema de nível de pets. Use 0 para desativar (padrão).
// Quando ativado, o nível do pet é uma porcentagem fixa do nível do mestre. (Nota 2)
// Se 200%, o pet terá o dobro do nível; se 50%, terá metade do nível, etc.
pet_lv_rate: 0

// Quando o sistema de nível de pets está ativado, qual é o máximo de atributos dos pets?
pet_max_stats: 99

// Quando o sistema de nível de pets está ativado, estes são os limites impostos
// para dano mínimo/máximo. Note que isso limita apenas atk1 e atk2; se você
// habilitar pet_str, o dano máximo será base_atk + pet_max_atk2.
pet_max_atk1: 500
pet_max_atk2: 1000

// Pets são desativados durante a Guerra do Emperium (WoE)?
// Se definido como yes, os pets são automaticamente retornados para o ovo ao entrar em castelos durante WoE
// e também é proibido chocá-los dentro desses mapas.
pet_disable_in_gvg: no

// O dano fixo da habilidade petskillattack2 deve ignorar a defesa infinita de plantas? (Nota 1)
pet_ignore_infinite_def: yes

// O pet continuará atacando quando o mestre estiver morto? (Nota 1)
pet_master_dead: no

// Enviar aviso de auto-alimentação mesmo se a opção do cliente estiver desligada (Nota 1)
// Oficial: yes
pet_autofeed_always: yes

// Velocidade de caminhada do pet.
// 1: Velocidade de caminhada do mestre (oficial)
// 2: Valor DEFAULT_WALK_SPEED
// 3: Velocidade de caminhada definida no banco de dados dos monstros
pet_walk_speed: 1
