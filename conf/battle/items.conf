//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um seletor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor é em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se não houver descrição,
//         considere os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// O maior valor pelo qual um item pode ser vendido via a habilidade de vending do mercador. (em zeny)
vending_max_value: 1000000000

// Permitir colocar itens em uma loja de vending quando o zeny do jogador somado ao preço total
// dos itens exceder o máximo de zeny permitido? (Nota 1)
// Se definido como "yes", os itens serão colocados na loja, mas outros jogadores não poderão comprá-los.
// O comportamento oficial é "yes", mas em alguns servidores oficiais o cliente não permite isso.
vending_over_max: yes

// Imposto aplicado a todas as transações de vending (ex: 10000 = 100%, 50 = 0,50%)
// Quando um imposto é aplicado, o preço total é cobrado do comprador, mas
// o vendedor não recebe o valor total (ele recebe 100% - este imposto).
vending_tax: 500

// Valor mínimo total da compra para que o imposto seja aplicado.
// Oficialmente não há imposto para valores abaixo de 100 milhões de zeny.
// 0 aplicará imposto em todas as transações.
vending_tax_min: 100000000

// Mostrar o nome do comprador quando um item for vendido com sucesso
buyer_name: yes

// Taxa de sucesso de forja de armas. (Nota 2)
weapon_produce_rate: 100

// Taxa de sucesso de preparo de poções. (Nota 2)
potion_produce_rate: 100

// Os itens produzidos terão o nome do criador? (Nota 3)
// 0x01: Armas produzidas
// 0x02: Poções produzidas
// 0x04: Flechas produzidas
// 0x08: Água Benta/Ancilla produzidas
// 0x10: Poções Mortais produzidas
// 0x80: Outros itens produzidos.
produce_item_name_input: 0x03

// Um monstro invocado por galho seco é agressivo? (Nota 1)
dead_branch_active: yes

// Os monstros invocados devem verificar o nível base do jogador? (galhos secos) (Nota 1)
// Nos oficiais isso é no – monstros invocados por galhos secos/sangrentos podem ser de QUALQUER nível.
// Altere para 'yes' para invocar apenas monstros com nível menor ou igual ao nível base do jogador.
random_monster_checklv: no

// Ao mudar de mapa, verifica itens não marcados como "disponíveis" e
// os remove automaticamente do inventário/carrinho/armazém.
// NOTA: Um item não está disponível se não foi carregado do item_db.
// 0x1: Inventário
// 0x2: Carrinho
// 0x4: Armazém
item_check: 0x0

// Quanto tempo deve passar entre usos de itens?
// Afeta apenas o atraso entre usos de itens, prevenindo abuso de itens de cura. Recomendado ~500 ms
// Nos oficiais é 0, mas aqui é 100ms como medida contra bots/macros.
item_use_interval: 100

// Quanto tempo deve passar entre usos de comidas de cash? Padrão: 60000 (1 min)
cashfood_use_interval: 60000

// Nível necessário de bNoMagicDamage para bloquear mudanças de status (Carta Golden Thief Bug).
// Por exemplo, se deixado em 50. Um item pode dar bNoMagicDamage,40;
// que reduz o dano mágico em 40%, mas não bloqueia mudanças de status.
gtb_sc_immunity: 50

// Permitir empilhamento de efeitos de cartas de autospell?
// NOTA: Cartas diferentes que concedem a mesma skill sempre funcionarão
// independentemente desta configuração.
autospell_stacking: no

// Permitir consumir itens utilizáveis que estão desativados em item_noequip.txt? (Nota 1)
// no = não pode ser consumido
// yes = é consumido sem efeito
allow_consume_restricted_item: no

// Permitir equipar itens que estão desativados em item_noequip.txt? (Nota 1)
// no = não pode ser equipado e será removido ao entrar no mapa
// yes = pode ser equipado, mas não terá efeito
// Se o equipamento tiver cartas restritas, ignora esta checagem, mas continua sem efeito.
allow_equip_restricted_item: yes

// Permitir troca de equipamentos enquanto interage com NPCs? (Nota 1)
// Padrão nos oficiais: yes para Pré-renovação, no para Renovação
//item_enabled_npc: yes

// Permitir que map_addflooritem verifique se o item é dropável? (Nota 1)
// Se yes, itens não dropáveis serão destruídos em vez de aparecerem no mapa quando o inventário estiver cheio.
// Padrão: yes
item_flooritem_check: yes

// Define o tipo de vínculo padrão quando um item com BindOnEquip é equipado (ver db/[pre-]re/item_db.yml)
// 0 - Nenhum
// 1 - Conta
// 2 - Guilda
// 3 - Grupo
// 4 - Personagem
default_bind_on_equip: 4

// Permitir vender itens vinculados/restritos como moeda de Itemshop? (Nota 3)
// 0x0 = Itens vinculados/restritos não podem ser vendidos em Itemshops/Lojas
// 0x1 = Itens vinculados podem ser vendidos em Itemshops
// 0x2 = Itens restritos para venda podem ser vendidos em Itemshops
// 0x4 = Itens vinculados podem ser vendidos em Lojas,
//       pois a maioria dos itens restritos para troca ainda pode ser vendida em Lojas
// 0x8 = Apenas o líder da guilda pode vender itens BOUND_GUILD em Lojas ou Itemshops (se 0x1 ou 0x4 estiver definido)
allow_bound_sell: 0x0

// Oculta os últimos N caracteres do nome do jogador com asterisco (*)
// quando o jogador obtém um item com broadcast especial ou refina um item em nível com broadcast.
// Nota: Jogadores com nomes curtos podem ficar totalmente ocultos se este valor for alto.
broadcast_hide_name: 2

// Permitir vender item alugado para NPC shop? (Nota 1)
rental_transaction: yes

// Vender item alugado por 0 no NPC shop, independentemente do valor no item_db? (Nota 1)
rental_item_novalue: no

// Preço mínimo de compra de itens em lojas normais
// Oficialmente itens não podem ser comprados por menos de 1 Zeny
min_shop_buy: 1

// Preço mínimo de venda de itens em lojas normais
// Oficialmente itens podem ser vendidos por 0 Zeny
min_shop_sell: 0

// Itens que reduzem dano por elemento/raça devem contar todo dano de monstro como físico? (Nota 1)
// Oficialmente "Asprika" (item divino) reduz todo dano de monstros, não apenas físico
// Já o Chapéu de Xamã não reduz dano de monstros (reduz dano mágico em PVP)
// Isso afeta apenas itens com bonus3 bSubEle e bonus3 bSubRace.
cardfix_monster_physical: yes

// Determina se itens empilháveis devem ser contados separadamente para espaço no inventário durante trocas,
// mesmo que o outro jogador já possua o item.
// (Nos oficiais é 'yes')
trade_count_stackable: yes
