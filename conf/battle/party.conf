//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: Valor é um interruptor de configuração (on/off, yes/no ou 1/0)
// Nota 2: Valor é em porcentagem (100 significa 100%)
//--------------------------------------------------------------

// Se alguém roubar (habilidades gank/steal), mostrar o nome no grupo? (Nota 1)
show_steal_in_same_party: no

// Intervalo antes de atualizar os pontos do minimapa dos membros do grupo (em milissegundos)
party_update_interval: 1000

// Método usado para atualizar as barras de HP dos membros do grupo:
// 0: Aegis – a barra é atualizada toda vez que o HP muda (consome mais banda)
// 1: rAthena – a barra é atualizada junto com os pontos do mapa do grupo (até 1 segundo de atraso)
party_hp_mode: 0

// NOTA:
// O intervalo de nível para compartilhamento dentro do grupo é definido em conf/inter_athena.conf
// no valor "party_share_level".

// Quando o compartilhamento de itens do grupo ("Party Share") estiver ativado,
// anunciar no grupo qual membro recebeu o item e qual item ele recebeu? (Nota 1)
show_party_share_picker: yes

// Quais tipos de itens serão anunciados quando 'show_party_share_picker' estiver ativo?
// 1:   IT_HEALING,  2:   IT_UNKNOWN,  4:    IT_USABLE, 8:    IT_ETC,
// 16:  IT_WEAPON,   32:  IT_ARMOR,    64:   IT_CARD,   128:  IT_PETEGG,
// 256: IT_PETARMOR, 512: IT_UNKNOWN2, 1024: IT_AMMO,   2048: IT_DELAYCONSUME
// 262144: IT_CASH
show_picker.item_type: 112

// Método de distribuição quando o compartilhamento de itens do grupo estiver ativado:
// 
// 0: Normal (o item vai para um membro aleatório do grupo)
// 1: Compartilhamento de itens é desativado para drops que não sejam de monstros (drops de jogador/pet)
// 2: Round Robin (os itens são distribuídos de forma igual e em ordem entre os membros)
// 3: 1+2
party_item_share_type: 0

// O compartilhamento de exp/itens deve ser desativado para membros inativos do grupo?
// Defina como no, ou informe a quantidade de segundos (NÃO milissegundos) que devem passar
// para considerar um personagem inativo.
// Personagens em chat/vending são sempre considerados inativos.
// O estado de inatividade é resetado ao usar item/habilidade/atacar (ataque automático conta também)/mover-se.
idle_no_share: no

// Conceder bônus adicional de experiência por membro do grupo envolvido em grupos com divisão igual (excluindo você mesmo)?
// ex: Se definido como 10, um grupo com divisão igual de 5 pessoas receberá +40% de exp (4 membros * 10%):
//     140% de experiência total do grupo, então cada membro recebe 140%/5 = 28% de exp (em vez de 20%).
party_even_share_bonus: 0

// Exibir o nome do grupo independentemente de o jogador estar em uma guild.
// Servidores oficiais exibem o nome do grupo mesmo se o usuário não estiver em uma guild. (Nota 1)
display_party_name: yes

// Impedir que múltiplos personagens da mesma conta entrem no mesmo grupo. (Nota 1)
block_account_in_same_party: yes

// Impedir a troca de líder do grupo se o jogador especificado não estiver no mesmo mapa. (Nota 1)
change_party_leader_samemap: yes
