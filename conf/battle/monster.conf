//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: Valor é um interruptor de configuração (on/off, yes/no ou 1/0)
// Nota 2: Valor é em porcentagem (100 significa 100%)
// Nota 3: Valor é um campo de bits. Se nenhuma descrição for dada,
//         assuma tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Taxa de HP dos MVPs. (Nota 2)
mvp_hp_rate: 100

// Taxa de HP dos monstros normais (ou seja, monstros que não são MVPs) (Nota 2)
monster_hp_rate: 100

// Define várias configurações relacionadas à IA dos monstros. (Nota 3)
// 0x0001: Quando ativado, os monstros irão atualizar sua célula de destino a cada x células movidas.
//         (normalmente eles nunca atualizam a célula de destino até estarem a uma célula
//         antes do final do caminho. x = monster_chase_refresh, veja abaixo)
// 0x0002: Faz o monstro usar sua habilidade de "ataque rude" (geralmente teleporte)
//         se ele for atacado e não puder atacar de volta, independentemente de como foi
//         atacado (ex: GrimTooth). Caso contrário, o "ataque rude" só é ativado
//         se ele não puder alcançar o alvo em combate corpo-a-corpo (ex: sniping)
// 0x0004: Se não estiver definido, monstros que podem trocar de alvo só o farão quando
//         atacados dentro de uma distância de [alcance de ataque +1], caso contrário
//         monstros podem trocar de alvo e perseguir atacantes à distância.
//         Esta flag também sobrescreve o alvo do 'provoke'.
// 0x0008: Quando definido, os monstros se dispersam assim que perdem o alvo.
//         Use este modo para tornar muito mais difícil o "mob-train", escondendo
//         e reunindo-os em um único ponto (ex: treino com GrimTooth)
// 0x0010: Se definido, habilidades de monstro configuradas para aliados também
//         serão ativadas nele mesmo.
// 0x0020: Quando definido, a IA do monstro é executada para todos os monstros em mapas
//         que possuem jogadores, ao invés de apenas para monstros próximos aos jogadores.
// 0x0040: Quando definido, se o alvo do monstro mudar de mapa ou sair do campo de visão,
//         o monstro irá andar em direção a warps de NPC e/ou Portais de Warp de Sacerdote
//         dentro do seu campo de visão.
//         Ele só andará até warps que possa usar e apenas para warps que o tragam de volta
//         ao campo de visão do alvo (usar junto com mob_warp abaixo).
// 0x0080: Se não estiver definido, monstros em estado de ataque só mudarão de alvo quando
//         atacados por ataques normais. Defina isto se quiser que monstros também troquem
//         de alvo quando atingidos por habilidades.
// 0x0100: Quando definido, um monstro escolherá uma habilidade aleatória da sua lista
//         e começará por ela, ao invés de verificar as habilidades em ordem
//         (quando não definido, se um monstro tiver muitas habilidades, as do final
//         raramente serão escolhidas).
// 0x0200: Quando definido, o tempo de recarga de uma habilidade não será aplicado a todas
//         as entradas da mesma habilidade, mas apenas àquela entrada específica
//         (ex: o monstro tem Cura em seis linhas no mob_skill_db, apenas a linha usada
//         receberá o tempo de recarga). Isso tornará os monstros mais difíceis, especialmente MVPs.
// 0x0400: Defina isto para que os monstros tenham alcance 9 para todas as habilidades.
//         Caso contrário, obedecerão às regras normais de alcance.
// 0x0800: Quando definido, monstros provocados sempre mudarão o alvo para quem os provocou,
//         mesmo que normalmente não trocassem de alvo ao serem atacados.
// 0x1000: Quando definido, quando um monstro escolher uma habilidade mas não puder usá-la
//         porque não há alvo válido no alcance, ele procurará outra habilidade que possa usar.
//         Isso faz, por exemplo, o Greatest General usar "Earth Spike" no alcance 8-9,
//         enquanto oficialmente ele só usaria após já ter usado "Blind Attack" no alcance 0-7.
// 0x2000: Quando definido, os monstros se moverão logo após atacar ou usar uma habilidade.
//         Normalmente a IA do monstro fica inativa durante a animação de ataque.
// Exemplo: 0x140 -> Perseguir jogadores através de warps + usar habilidades em ordem aleatória.
monster_ai: 0

// Com que frequência um monstro deve repensar sua perseguição?
// 0: A cada 100ms (MIN_MOBTHINKTIME)
// 1: A cada célula movida
// x: A cada x células movidas ou uma célula antes do fim do caminho
// 32 (máx): Uma célula antes do fim do caminho (oficial)
// Independentemente desta configuração, um monstro sempre verificará alvos no alcance de ataque.
// Diminua este valor se quiser tornar os monstros mais reativos ao perseguir.
// Se quiser que os monstros atualizem a célula de destino durante a perseguição,
// também é necessário ativar monster_ai 0x0001, veja acima.
// Caso contrário, isto apenas define o número máximo de células que os monstros
// andarão após perderem o alvo (esconderijo, sem linha de visão, etc.).
monster_chase_refresh: 32

// Os monstros devem poder ser teleportados (adicione conforme necessário)?
// 0: Desativado.
// 1: Ativar teleporte de monstros ao ficarem sobre warps de NPC
// 2: Ativar teleporte de monstros ao ficarem sobre Portais de Warp de Sacerdote
// 4: Desativar teleporte quando o mapa de destino for um mapa 'nobranch'.
// 8: Ativar teleporte de monstros ao ficarem sobre Porta Dimensional
mob_warp: 0

// Define o tempo (em ms) durante o qual os monstros manterão sua IA ativa
// após todos os jogadores terem saído de sua proximidade.
// Mesmo após esse tempo, eles ainda andarão aleatoriamente e usarão habilidades ociosas
// até que todos os jogadores que os viram tenham deslogado ou até serem teleportados,
// chamados de volta ou removidos do mapa.
mob_active_time: 0
boss_active_time: 0

// Ajuste do alcance de visão de monstros e pets (coluna range2 no mob_db) (Nota 2)
view_range_rate: 100

// Alcance de perseguição é a distância mínima base que um monstro percorre antes de desistir
// (desde que o alvo esteja fora do campo de visão). Esta é a coluna range3 no mob_db. (Nota 2)
chase_range_rate: 100

// Qual nível de Olho de Abutre e Olho de Serpente os monstros devem ter aprendido?
// Oficialmente, monstros não aprendem essas habilidades, então suas habilidades à distância
// têm apenas alcance 9. Se você colocar um número maior que 0, o alcance será aumentado por esse valor.
monster_eye_range_bonus: 0

// Alcance em que looters procuram por loot (máx 32)
// Oficial: 12
// Athena antigo: 10
loot_range: 12

// Alcance em que monstros assistentes procuram aliados para ajudar (máx 32)
// Oficial: 11
// Athena antigo: 10
assist_range: 11

// Permitir que monstros sejam agressivos e ataquem primeiro? (Nota 1)
monster_active_enable: yes

// Os nomes do mob_db devem sobrescrever os nomes definidos nos arquivos de spawn?
// 0: Não
// 1: sempre usar a coluna Name do mob_db (nome em inglês)
// 2: sempre usar a coluna JName do mob_db (nome original KRO)
override_mob_names: 0

// Taxa de atraso de dano dos monstros (Nota 2)
// Isto afeta o atraso de dano enviado ao cliente e é o valor base para o atraso de movimento.
monster_damage_delay_rate: 100

// Ações de monstros que pegam itens.
// 0 = O monstro consumirá o item.
// 1 = O monstro não consumirá o item.
monster_loot_type: 0

// Como o monstro procura itens no chão para pegar?
// 0: Mais próximo (estilo antigo Athena)
// 1: Mais antigo no alcance (Oficial)
monster_loot_search_type: 1

// Chance de um monstro usar uma habilidade (Nota 2)
// Taxas altas levam a 100% de uso de habilidades com poucos/nenhum ataque normal.
// Defina como 0 para desativar habilidades de monstros.
mob_skill_rate: 100

// Ajuste do atraso de habilidades dos monstros (Nota 2)
// Após um monstro usar uma habilidade, há um atraso antes de poder reutilizá-la.
// Note que habilidades com atraso 0 não são afetadas por esta configuração.
mob_skill_delay: 100

// Taxa de monstros no mapa, 200 seria o dobro do normal. (Nota 2)
mob_count_rate: 100

// Taxa de respawn dos monstros no mapa. 50 faria os monstros nascerem duas vezes mais rápido (metade do tempo) (Nota 2)
// Nota: Isto não afeta monstros com respawn imediato (a maioria dos monstros normais)
mob_spawn_delay: 100
plant_spawn_delay: 100
boss_spawn_delay: 100

// O tempo de respawn dos monstros deve ter variação aplicada? (Nota 3)
// Em servidores oficiais, monstros invocados pelo comando boss_monster (principalmente MVPs) têm variação,
// no Athena antigo a variação é aplicada a todos os monstros.
// 0: Nenhum
// 1: Monstros chefe (oficial)
// 2: Monstros normais
// 3: Todos os monstros (Athena antigo)
mob_spawn_variance: 1

// Os monstros não devem nascer dentro do alcance de visão dos jogadores?
// 0 desativa, caso contrário é o número de tentativas antes de desistir
// e nascer dentro da visão do jogador, a menos que o máximo (100) seja usado,
// caso em que o monstro não nascerá e tentará novamente em 5 segundos.
// NOTA: Isso não afeta monstros que sempre nascem na mesma célula
// (como ovos de formiga), exceto se definido como máximo.
no_spawn_on_player: 0

// As coordenadas de spawn nos arquivos de spawn de monstros devem ser ignoradas? (Nota 1)
// Se definido como yes, todos os monstros terão um ponto de respawn aleatório em todo o mapa
// independentemente do que o arquivo de spawn diz.
force_random_spawn: no

// Cada célula central do monstro deve ser randomizada? (Nota 1)
// Oficialmente, ao iniciar o servidor, a célula central de cada monstro é definida como uma célula aleatória
// na área de spawn. Cada vez que o monstro nasce, ele aparecerá em uma área ao redor da célula central
// em vez do centro original definido no spawn. Isso resulta em uma área total de spawn muito maior
// e uma experiência diferente a cada reinício do servidor.
// Defina como "no" se quiser que todos os monstros de um spawn apareçam ao redor do centro original,
// tornando a área total muito menor (comportamento antigo do eAthena).
randomize_center_cell: yes

// Os escravos invocados herdam as características passivas/agressivas do mestre?
// 0: Não, mantém o modo original.
// 1: Escravos são sempre agressivos.
// 2: Escravos são sempre passivos.
// 3: Igual ao estado agressivo/passivo do mestre.
// 4: O modo é sobrescrito pelo modo do escravo (oficial)
slaves_inherit_mode: 4

// Os escravos invocados têm a mesma velocidade de movimento que o mestre?
// Não se aplica às Marine Spheres invocadas por Alquimistas
// NOTA: O padrão é 3 para servidores oficiais.
// 0: Nunca.
// 1: Se o mestre puder andar
// 2: Se o mestre não puder andar (mesmo monstros imóveis têm velocidade no mob_db)
// 3: Sempre
slaves_inherit_speed: 3

// Os escravos de MVP devem manter o alvo quando retornarem ao mestre? (Nota 1)
mob_slave_keep_target: yes

// Os escravos devem se teleportar de volta ao mestre se ficarem muito distantes durante a perseguição? (Nota 1)
// Oficialmente, eles podem se afastar o quanto quiser do mestre.
slave_stick_with_master: no

// Os escravos devem estar sempre ativos quando o mestre estiver ativo? (Nota 1)
// Oficialmente, pode acontecer de o mestre estar ativo e os escravos não.
slave_active_with_master: no

// Monstros invocados (alquimistas ou via @summon) ao atacar
// têm chance de ativar cartas de autospell do mestre? (Nota 1)
summons_trigger_autospells: yes

// Quando um monstro é atacado por outro monstro, ele retaliará contra o mestre
// desse monstro ao invés do próprio monstro?
// NOTA: Monstros invocados incluem tanto os via @summon quanto os invocados por Alquimistas
retaliate_to_master: yes

// Os monstros devem mudar temporariamente de alvo quando uma habilidade
// aciona uma habilidade de contra-ataque do monstro? (Nota 1)
// ex: Monstro ataca jogador B, e jogador A usa habilidade C.
// Se definido como yes e o monstro tiver uma habilidade acionada por C,
// então A será o alvo da habilidade, caso contrário B será o alvo.
mob_changetarget_byskill: no

// Se a classe do monstro for alterada, ele deve recuperar todo o HP? (Nota 1)
monster_class_change_full_recover: yes

// Mostrar algumas informações do monstro ao lado do nome? (adicione conforme necessário)
// (não funciona em guardiões ou Emperium)
// 1: Mostrar HP do monstro (Hp/MaxHp)
// 2: Mostrar HP do monstro (Percentual)
// 4: Mostrar nível do monstro
show_mob_info: 0

// Zeny obtido de monstros
zeny_from_mobs: no

// Monstros sobem de nível (o monstro sobe de nível cada vez que um jogador é morto e fica mais forte)
// A taxa de exp é calculada ((nível do monstro - nível original) * (exp * (mobs_level_up_exp_rate/100)))
// NOTA: Não se aplica a Guardiões de WoE.
mobs_level_up: no
mobs_level_up_exp_rate: 1

// Opções de Monstros Dinâmicos
// Usar monstros dinâmicos? (recomendado para servidores pequenos e médios)
dynamic_mobs: yes

// Remover monstros mesmo se estiverem feridos
mob_remove_damaged: yes

// Atraso antes de remover monstros de mapas vazios (padrão 5 min = 300 segundos)
mob_remove_delay: 300000

// Define em quem o npc_event do monstro é executado quando um monstro é morto.
// Tipo 1: No jogador que matou o monstro (se morto por não-jogador, usa tipo 0)
// Tipo 0: No jogador que causou mais dano ao monstro.
// NOTA: Isso afeta quem ganha o Castelo quando o Emperium é destruído.
mob_npc_event_type: 1

// Tempo em milissegundos para ativar proteção contra Kill Steal
// Defina como 0 para desativar.
// Se ativado e um jogador estiver usando @noks, o dano de outros jogadores (KS)
// fora do grupo será reduzido a 0.
ksprotection: 0

// Ativar ou não o túmulo de MVP.
// Veja http://irowiki.org/wiki/MVP#Gravestone
mvp_tomb_enabled: yes

// Atraso antes do túmulo do MVP aparecer.
// Padrão: 9 segundos
mvp_tomb_delay: 9000

// O tamanho de monstros invocados especialmente influencia experiência, drop e status?
// As taxas dobram para monstros grandes e caem pela metade para pequenos.
// Isso só é aplicado com os comandos 'monster', @monsterbig e @monstersmall. (Nota 1)
// Padrão: no
mob_size_influence: no

// Como um monstro deve ficar preso por uma Ice Wall lançada diretamente sobre ele?
// Em servidores oficiais, monstros só podem sair da Ice Wall para o oeste e sul.
// Se o alvo estiver ao norte ou leste, eles tentarão persegui-lo continuamente sem sucesso,
// entrando em um loop onde usarão habilidades ociosas e de perseguição.
// Monstros chefe, por outro lado, se comportam como presos, não se movem e usam
// habilidades ociosas e rudeattacked (quando atacados).
// 0: O monstro não ficará preso na Ice Wall.
// 1: O monstro se comportará como preso.
// 2-255: Número de loops que o monstro fará antes de se libertar.
// NOTA: Em alguns servidores, monstros normais se libertam após 15-35 segundos dependendo da velocidade.
// Em outros, ficam presos até a Ice Wall acabar. Muitos servidores oficiais (ex: iRO)
// bloqueiam completamente Ice Wall em mapas com monstros chefe.
// Padrão (menos explorável): mob - 75, boss - 0
// Padrão (mais oficial): mob - 220, boss - 1
mob_icewall_walk_block: 75
boss_icewall_walk_block: 0

// As barras de HP devem ser mostradas para monstros?
// Cliente 2012-04-04aRagexeRE ou superior é necessário.
monster_hp_bars_info: yes

// Um monstro deve renascer e um aviso ser impresso no map server
// quando ele não puder se mover por muito tempo?
// Isso pode ser jogabilidade legítima (ex: jogadores prendendo MVP em Ice Wall),
// mas se quiser prevenir exploits e ser notificado, defina como yes.
monster_stuck_warning: no

// Taxa em que monstros usam habilidades ociosas quando não há jogadores próximos (Nota 2)
// Em servidores oficiais, monstros usam habilidades ociosas se já tiverem sido vistos,
// mesmo que não haja jogadores próximos.
// Em servidores pequenos/médios isso pode causar metamorfose em ovos, Fabre/Pupa, etc.
// Para desativar, defina como 0.
mob_nopc_idleskill_rate: 100
boss_nopc_idleskill_rate: 100

// Taxa em que monstros se movem quando não há jogadores próximos (Nota 2)
// Em servidores oficiais, monstros sempre se movem se já tiverem sido vistos,
// mesmo que não haja jogadores próximos.
// Para desativar, defina como 0.
mob_nopc_move_rate: 100
boss_nopc_move_rate: 100

// Ao matar um monstro, conquistas do tipo AG_BATTLE
// devem ser ativadas para todos no mesmo grupo dentro da área?
// A área é limitada pela configuração area_size em battle.conf.
achievement_mob_share: no

// Tempo mínimo absoluto de respawn de um monstro em milissegundos.
// Também usado para atrasar o spawn de guardiões quando a guild não está carregada.
// Padrão (Oficial): 1000
mob_respawn_time: 1000

// Define o tempo (em ms) após o qual um monstro libera seu alvo quando preso.
// Durante esse tempo, monstros ainda usarão habilidades ociosas em alvos aleatórios,
// mas continuarão perseguindo o alvo original quando não estiverem mais presos.
mob_unlock_time: 2000
