//--------------------------------------------------------------
// Arquivo de Configuração de Funcionalidades do rAthena
//--------------------------------------------------------------
// Nota 1: O valor é uma opção de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor está em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for fornecida,
//         considere os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homúnculo, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Loja de compras (Note 1)
// Requer: 2010-04-27aRagexeRE ou posterior
feature.buying_store: on

// Pesquisa de lojas (Note 1)
// Requer: 2010-08-03aRagexeRE ou posterior
feature.search_stores: on

// Sugestões de atcommand (Note 1)
// Se um atcommand for digitado de forma incompleta, serão sugeridos os comandos completos.
feature.atcommand_suggestions: off

// Leilão (Note 1)
// A funcionalidade tornou-se instável em clientes a partir de 2012 (data exata desconhecida),
// foi corrigida em clientes a partir de 2013-05-15.
// A funcionalidade foi removida novamente em clientes de 2014-11-12 em diante.
feature.auction: off

// Sugestões de warp (Note 1)
// Mostrar sugestões ao tentar usar @warp para um mapa inexistente?
feature.warp_suggestions: off

// Sistema Bancário (Note 1)
// Requer: 2013-07-24aRagexe ou posterior
feature.banking: on

// O sistema bancário deve verificar estritamente o estado da interface ao depositar e sacar zeny? (Note 1)
// Nota: Desativado por padrão porque os clientes oficiais existentes não informam ao servidor
// o estado da interface bancária.
// Porém, esta configuração pode ser útil em casos de clientes que realmente informem
// o estado da interface ou clientes personalizados.
feature.banking_state_enforce: no

// Persistência de autotrade (Note 1)
// Vendedores que usaram @autotrade devem ser restaurados após um reinício?
feature.autotrade: on

// Em qual direção os autotraders reaparecidos devem olhar?
// Valores possíveis são de 0 a 7
// Padrão: 4 (Sul)
// -1 = Última direção do jogador
feature.autotrade_direction: 4

// Alterar a direção da cabeça do jogador?
// -1 = Última condição
//  0 = Frente
//  1 = Direita
//  2 = Esquerda
feature.autotrade_head_direction: 0

// Deseja que seus autotraders fiquem sentados?
// -1 = Última condição do jogador, sentado ou em pé
//  0 = Em pé
//  1 = Sentado
feature.autotrade_sit: 1

// Atraso em milissegundos para abrir vending/buyingstore após o jogador logar.
feature.autotrade_open_delay: 5000

// Interface de fila de Battlegrounds.
// Torna possível entrar na fila de um Battleground em qualquer lugar usando o menu de batalha.
// Requer: 2012-04-10aRagexe ou posterior
feature.bgqueue: on

// Roleta (Note 1)
// Requer: 2014-10-22bRagexe ou posterior
feature.roulette: on

// Recompensa bônus da roleta
// Multiplica a quantidade por 2 se o ID do item de recompensa
// for o mesmo que o ID do item bônus
feature.roulette_bonus_reward: on

// Conquistas (Achievement) (Note 1)
// Requer: 2015-05-13aRagexe ou posterior
feature.achievement: on

// Interface de Refinamento (Note 1)
// Requer: 2016-10-12aRagexeRE ou posterior
feature.refineui: on

// Troca de Equipamentos (Equipment Switch) (Note 1)
// Requer: 2017-02-08bRagexeRE ou posterior
feature.equipswitch: on

// Evolução de Pet (Note 1)
// Requer: 2014-10-08aRagexe ou posterior
feature.petevolution: on

// Alimentação Automática de Pet (Note 1)
// Requer: 2014-10-08aRagexe ou posterior
feature.petautofeed: on

// Em qual taxa de fome a alimentação automática do pet deve ser acionada? (Note 2)
// Padrão: 89
feature.pet_autofeed_rate: 89

// Alimentação Automática de Homúnculo (Note 1)
// Requer: 2017-09-20bRagexeRE ou posterior
feature.homunculus_autofeed: on

// Em qual taxa a alimentação automática do homúnculo deve ser acionada? (Note 2)
// Padrão: 30
//
// NOTA:
// Esta configuração só se aplica se os arquivos LUA do cliente estiverem com erro.
// Por padrão, o próprio cliente envia o pacote de alimentação automaticamente
// quando atinge o limite que é codificado internamente no cliente.
feature.homunculus_autofeed_rate: 30

// Sistema de Presença (Attendance) (Note 1)
// Requer: 2018-03-07bRagexeRE ou posterior
feature.attendance: on

// Sistema de Dirigível Privado (Note 1)
// Requer: 2018-03-21aRagexeRE ou posterior
feature.privateairship: on

// Sistema de Loja de Trocas (Barter Shop) (Note 1)
// Requer: 2019-01-16RagexeRE ou posterior
feature.barter: on

// Sistema Estendido de Loja de Trocas (Note 1)
// Requer: 2019-11-06RagexeRE ou posterior
feature.barter_extended: on

// Tempo limite em milissegundos para que um NPC dinâmico seja removido
// se não for utilizado.
// Padrão: 60000 (60s)
feature.dynamicnpc_timeout: 60000

// Alcance no eixo X em que o NPC dinâmico será criado em relação ao jogador.
// Padrão: 2
feature.dynamicnpc_rangex: 2

// Alcance no eixo Y em que o NPC dinâmico será criado em relação ao jogador.
// Padrão: 2
feature.dynamicnpc_rangey: 2

// Os NPCs dinâmicos devem olhar na direção do jogador? (Note 1)
// Padrão: no
feature.dynamicnpc_direction: no

// Sistema de Itemlink em comandos informativos relacionados (Note 1)
// Gera uma string de itemlink para um item e pode ser usada nos comandos
// npctalk, message, dispbottom e broadcast.
// O resultado é um nome de item clicável, assim como ao usar SHIFT+Clique
// no inventário/carrinho/janela de equipamentos do jogador.
// Requer: 2015-11-04Ragexe ou posterior
feature.itemlink: on

// Sistema de Itemlink em mensagens de NPC (Note 1)
// Gera uma string de itemlink para um item e pode ser usada no comando mes do NPC.
// Requer: 2010-01-01 ou posterior
feature.mesitemlink: on

// Forçar todos os mesitemlinks a serem envolvidos por colchetes (Note 1)
// Padrão: no
feature.mesitemlink_brackets: no

// Forçar todos os mesitemlinks a usarem o nome do banco de dados (Note 1)
// Padrão: no
feature.mesitemlink_dbname: no

// Ícones de Itemlink em mensagens de NPC (Note 1)
// Gera uma string de ícone de item para um item e pode ser usada no comando mes do NPC.
// Requer: 2023-03-02 ou posterior
feature.mesitemicon: on

// Forçar todos os mesitemicons a usarem o nome do banco de dados,
// caso a funcionalidade mesitemicon esteja desativada (Note 1)
// Padrão: no
feature.mesitemicon_dbname: no

// Interface do Estilista (Stylist UI) (Note 1)
// Requer: 2015-11-04 ou posterior
feature.stylist: on

// Os jogadores podem se reconectar em instâncias? (Note 1)
// Isto é habilitado por padrão no modo Renewal e
// desabilitado por padrão no modo Pre-Renewal.
// Se permitido, a mapflag "nosave" ainda será respeitada
// e pode impedir que jogadores retornem para a instância.
//feature.instance_allow_reconnect: yes