//--------------------------------------------------------------
// Arquivo de Configuração de Batalha do rAthena
// Originalmente traduzido por Peter Kieser <pfak@telus.net>
// Adaptado para um inglês mais simples por Ancyker
//--------------------------------------------------------------
// Nota 1: O valor é um interruptor de configuração (ligado/desligado, sim/não ou 1/0)
// Nota 2: O valor está em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for fornecida,
//         assuma os tipos de unidades (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Quem deve ter um valor de baseatk (faz com que STR afete o dano)? (Nota 3)
enable_baseatk: 0x9
enable_baseatk_renewal: 0x29F

// Quem pode ter esquiva perfeita? (Nota 3)
enable_perfect_flee: 1

// Quem pode ter ataques críticos? (Nota 3)
// (Observe que existem algumas habilidades que sempre causam acerto crítico independentemente disso)
enable_critical: 17

// Taxa de ajuste crítico para não-jogadores (Nota 2)
mob_critical_rate: 100
critical_rate: 100

// Quais tipos de unidades devem receber atraso de caminhada por ataques normais? (Nota 3)
// O atraso é igual à 'animação de ataque' (amotion). O cliente já bloqueia
// o envio de solicitações de movimento durante esse tempo, portanto, para personagens
// controlados pelo cliente, esta configuração é principalmente um mecanismo de segurança contra edições do cliente.
// Monstros geralmente não são afetados por isso, pois a IA deles fica inativa durante a animação de ataque,
// a menos que você personalize a IA deles (veja monster_ai 0x2000 em monster.conf)
attack_walk_delay: 0

// Usar o sistema legado de atraso de caminhada ao receber dano? (Nota 3)
// Oficialmente, ao ser atingido, você apenas para no centro da célula mais próxima.
// O atraso de caminhada apenas afeta o tempo que um monstro reage ao dano nesse caso.
// O sistema legado impede completamente comandos de movimento pela duração do atraso de caminhada, mas
// isso só se aplica se o alvo anteriormente pôde se mover por pelo menos a duração do atraso.
damage_walk_delay: 0

// Ajuste de atraso de movimento após ser atingido. (Nota 2)
// O atraso de 'não pode andar' após ser atingido é calculado como uma porcentagem da duração da animação de dano.
// Para monstros, esse atraso também determina quanto tempo leva até que eles reajam a um atacante.
pc_damage_walk_delay_rate: 20
damage_walk_delay_rate: 100

// Ajuste de atraso de movimento para ataques com múltiplos acertos.
// Quando atingidos por uma habilidade de múltiplos acertos como Lord of Vermillion ou Jupitel Thunder, os personagens
// ficarão incapazes de se mover por um adicional de "(número de acertos -1) * multihit_delay" milissegundos.
// Observe que habilidades que causam mais de 10 acertos são consideradas apenas como habilidades de 2 acertos.
// Esse atraso também é adicionado ao tempo que um monstro espera até reagir a um atacante.
// Oficial: 200
// Athena Legado: 80
multihit_delay: 200

// Taxa de atraso de dano para jogadores (Nota 2)
// Isso afeta o atraso de dano que é enviado ao cliente e é o valor base para o atraso de caminhada.
player_damage_delay_rate: 100

// Sempre ter endure? (Nota 3)
// Os tipos de unidades definidos aqui não podem ser interrompidos por dano.
// Observe que críticos não podem ser exibidos em alvos com endure devido a uma limitação do cliente.
// Isso significa que esta configuração torna impossível exibir acertos críticos nesses tipos de unidades.
infinite_endure: 0

// A raça ou o elemento devem ser usados para considerar alguém como morto-vivo?
// 0 = elemento morto-vivo; a raça ainda é imune a congelamento e petrificação (oficial)
// 1 = raça morto-vivo
// 2 = ambos (qualquer um funciona)
// 3 = elemento morto-vivo; a raça pode ser congelada e petrificada (athena legado)
undead_detect_type: 0

// O HP se recupera se for atingido por um atributo que seja o mesmo que o seu? (Nota 1)
attribute_recover: no

// Qual é a taxa mínima e máxima de acerto de ataques normais?
min_hitrate: 5
max_hitrate: 100

// Tipo de penalidade que é aplicada à FLEE quando mais de agi_penalty_count monstros estão mirando no jogador
// 0 = nenhuma penalidade é aplicada
// 1 = agi_penalty_num é reduzido da FLEE como uma %
// 2 = agi_penalty_num é reduzido da FLEE como um valor exato
agi_penalty_type: 1

// Quando a penalidade de agi está ativada, a quem ela deve se aplicar? (Nota 3)
// Por padrão, apenas jogadores recebem a penalidade.
agi_penalty_target: 1

// Quantidade de inimigos necessários mirando no jogador antes que a FLEE comece a ser penalizada
agi_penalty_count: 3

// Quantidade de FLEE penalizada por cada monstro atacante além de agi_penalty_count
agi_penalty_num: 10

// Tipo de penalidade que é aplicada tanto ao equipamento quanto à DEF de VIT quando mais de vit_penalty_count monstros estão mirando no jogador
// 0 = nenhuma penalidade é aplicada
// 1 = vit_penalty_num é reduzido da DEF como uma %
// 2 = vit_penalty_num é reduzido da DEF como um valor exato
vit_penalty_type: 1

// Quando a penalidade de vit está ativada, a quem ela deve se aplicar? (Nota 3)
// Por padrão, apenas jogadores recebem a penalidade.
vit_penalty_target: 1

// Quantidade de inimigos necessários mirando no jogador antes que a defesa comece a ser penalizada
vit_penalty_count: 3

// Quantidade de defesa de VIT penalizada por cada monstro atacante além de vit_penalty_count
vit_penalty_num: 5

// Usar método alternativo de cálculo de DEF para ataques físicos.
// Com 0, desativado (usa redução normal de def% com redução adicional de def2)
// Com 1 ou mais, a defesa é a subtração de (DEF * valor).
// ex: 10 + 50 def torna-se 0 + (10*tipo + 50)
weapon_defense_type: 0

// MDEF, igual ao acima. (MDEF * valor)
magic_defense_type: 0

// Alterar a direção do atacante para encarar o oponente a cada ataque? (Nota 3)
// NOTA: Em servidores oficiais, o empurrão de algumas habilidades como Firewall é sempre baseado
// na última direção caminhada. Mesmo ao atacar em uma direção completamente diferente, a
// direção do empurrão não muda, então, por exemplo, se você andar para o norte e depois atacar
// um inimigo ao sul, você ainda será empurrado para o sul pelo Firewall. Monstros imóveis
// sempre serão empurrados para o sul, pois sua direção padrão é norte.
attack_direction_change: 0

// Para aqueles que estão definidos aqui, seu elemento de ataque inato é "sem elemento"
// (100% contra todos os elementos de defesa) (Nota 3)
// NOTA: Esta é a configuração que faz com que não-jogadores possam causar dano total
// contra alvos do tipo Fantasma com ataques normais (ex: contra Ghostring).
attack_attr_none: 14

// Taxa na qual equipamentos podem quebrar (taxa base antes de ser modificada por qualquer habilidade)
// 1 = 0,01% de chance. Padrão em servidores oficiais: 0
equip_natural_break_rate: 0

// Taxa geral na qual seu próprio equipamento pode quebrar. (Nota 2)
// Esta taxa afeta a taxa de quebra por penalidade de habilidades como power-thrust e sua taxa natural de quebra
// (de equip_natural_break_rate). Se a habilidade de encantamento de um Sábio falhar e isso estiver acima de 0, a arma
// do personagem selecionado será quebrada.
equip_self_break_rate: 100

// Taxa geral na qual você pode quebrar o equipamento do alvo. (Nota 2)
// Isso afeta o comportamento de habilidades como acid terror e meltdown
equip_skill_break_rate: 100

// O dano deve ter um atraso antes de ser aplicado? (Nota 1)
// Algumas habilidades podem não ter atraso por padrão, independentemente desta configuração.
// A configuração oficial é sim, mesmo que isso degrade um pouco o desempenho.
delay_battle_damage: yes

// O tempo do dano deve ser sincronizado entre o cliente e o servidor? (Nota 1)
// Este não é um comportamento oficial, mas deve remover o atraso de posição após ser atingido por um monstro.
// Esta configuração afeta apenas ataques normais de monstros e tem prioridade sobre "delay_battle_damage".
// Muitas habilidades exibem o dano imediatamente, então definir "delay_battle_damage" como "no" ao mesmo
// tempo pode melhorar ainda mais a experiência, mas não funcionará para todas as habilidades.
// Cansado do Dark Illusion te acertar 5 segundos atrasado? Então ative isto.
synchronize_damage: no

// Flechas/munição são consumidas quando usadas com arco/arma de fogo?
// 0 = Não
// 1 = Sim
// 2 = Sim, mesmo para habilidades que não especificam consumo de flechas quando a
//     habilidade é baseada em arma e usada com armas de longo alcance (adivinha automaticamente quais
//     habilidades devem consumir munição quando ela é adquirida via carta ou plágio)
arrow_decrement: 1

// A munição deve ser desequipada ao desequipar uma arma?
// O comportamento oficial é "sim".
ammo_unequip: yes

// Uma arma adequada deve ser equipada ao equipar munição?
// O comportamento oficial é "sim".
ammo_check_weapon: yes

// O bônus de script de item 'Autospell' deve verificar alcance/obstáculos antes de conjurar?
// O comportamento oficial é "não"; definir isso como "sim" fará com que as habilidades usem
// o alcance definido. Por exemplo, Sonic Blow requer uma distância de 2 células antes que o autoconjuro seja permitido.
// Esta configuração também afeta autospellwhenhit.
autospell_check_range: no

// Se tanto o atacante quanto o alvo estiverem na mesma célula, o alvo deve ser empurrado para a esquerda?
// O comportamento oficial é "sim"; definir isso como "no" empurrará o alvo para trás do atacante.
knockback_left: yes

// Os jogadores podem usar Falcões e Wargs ao mesmo tempo? (Nota 1)
// Isso não é permitido em servidores oficiais.
warg_can_falcon: no

// O alvo deve ser capaz de desviar do dano usando snap para a borda da tela?
// O comportamento oficial é "não"
snap_dodge: no

// Conceder a habilidades/itens de jogadores a capacidade de "quebrar" equipamentos de não-jogadores. (Nota 1)
// Isso efetivamente aplicará o efeito de remoção de equipamento ao alvo não-jogador.
// NOTA: WS_MELTDOWN está isento desta verificação quando desativada.
// Oficial: não
break_mob_equip: no