// Configuração InterServer do Athena.
// Contém configurações compartilhadas/usadas por mais de 1 servidor.

// Opções para ambas as versões

// Registrar conexões Inter, etc.?
log_inter: 1

// Nome do arquivo de log do Inter
inter_log_filename: log/inter.log

// Faixa de nível para compartilhamento dentro do grupo
party_share_level: 15

// Quantidade de pontos de status que um novo personagem começa
start_status_points: 48

// Permitir trocar o emblema da guild durante o WoE?
emblem_woe_change: yes

// Quantos pixels transparentes podem existir no emblema antes de ser detectado como inválido? (Nota 2)
emblem_transparency_limit: 80

// Você pode especificar aqui a codificação (codepage) a ser usada nas tabelas MySQL.
// (Observe que este recurso requer MySQL 4.1+)
//default_codepage:

// Para IPs, idealmente no Linux, use localhost em vez de 127.0.0.1
// No Windows, use 127.0.0.1. Se você ver uma mensagem como
// "Can't connect to local MySQL server through socket '/tmp/mysql.sock' (2)"
// e estiver usando localhost, troque para 127.0.0.1

// Servidor MySQL do Login
login_server_ip: 127.0.0.1
login_server_port: 3306
login_server_id: ragnarok
login_server_pw: ragnarok
login_server_db: ragnarok
login_codepage:
login_case_sensitive: no

ipban_db_ip: 127.0.0.1
ipban_db_port: 3306
ipban_db_id: ragnarok
ipban_db_pw: ragnarok
ipban_db_db: ragnarok
ipban_codepage:

// Servidor MySQL do Character
char_server_ip: 127.0.0.1
char_server_port: 3306
char_server_id: ragnarok
char_server_pw: ragnarok
char_server_db: ragnarok

// Servidor MySQL do Map
map_server_ip: 127.0.0.1
map_server_port: 3306
map_server_id: ragnarok
map_server_pw: ragnarok
map_server_db: ragnarok

// Servidor MySQL do Web
web_server_ip: 127.0.0.1
web_server_port: 3306
web_server_id: ragnarok
web_server_pw: ragnarok
web_server_db: ragnarok

// Banco de dados MySQL de Logs
log_db_ip: 127.0.0.1
log_db_port: 3306
log_db_id: ragnarok
log_db_pw: ragnarok
log_db_db: ragnarok
log_codepage:
log_login_db: loginlog

// Configurações de reconexão MySQL
// - mysql_reconnect_type:
//   1: Quando o MySQL desconectar durante a execução, o servidor tentará reconectar
//      mysql_reconnect_count vezes e desligará se não conseguir.
//   2: Quando o MySQL desconectar durante a execução, tentará reconectar indefinidamente.
mysql_reconnect_type: 2
mysql_reconnect_count: 1

// NÃO ALTERE NADA ABAIXO DESTA LINHA A MENOS QUE VOCÊ CONHEÇA MUITO BEM SEU BANCO DE DADOS
// isto é destinado a pessoas que SABEM o que estão fazendo e que, por algum motivo, desejam alterar
// o layout do banco de dados. [CLOWNISIUS]

