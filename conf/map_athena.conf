//--------------------------------------------------------------
// Arquivo de Configuração do Map-Server do rAthena
//--------------------------------------------------------------

// Nota: "Comentários" são todo o texto à direita de uma barra dupla "//"
// Qualquer texto comentado não será interpretado pelos servidores, servindo
// apenas como informação/referência.

//--------------------------------------------------------------
//                     Informações de Configuração
//--------------------------------------------------------------
// Senhas de comunicação entre servidores, definidas em account.txt (ou equivalente)
userid: s1
passwd: p1

// IP do Character Server
// O map server conecta-se ao character server usando este endereço IP.
// NOTA: Isto é útil quando você está atrás de um firewall ou em
// uma máquina com múltiplas interfaces.
//char_ip: 127.0.0.1

// O map server escuta na interface com este endereço IP.
// NOTA: Isto permite executar múltiplos servidores em múltiplas interfaces
// usando as mesmas portas para cada servidor.
//bind_ip: 127.0.0.1

// Porta do Character Server
char_port: 6121

// IP do Map Server
// O endereço IP que os clientes usarão para se conectar.
// Defina isto como o IP público do seu servidor.
//map_ip: 127.0.0.1

// Porta do Map Server
map_port: 5121

// Formato do timestamp que será impresso antes de todas as mensagens.
// Pode ter no máximo 20 caracteres.
// Formatos comuns:
// %I:%M:%S %p (hora:minuto:segundo no formato 12h, AM/PM)
// %H:%M:%S (hora:minuto:segundo, formato 24h)
// %d/%b/%Y (dia/mês/ano)
// Para informações completas, consulte o manual do strftime().
//timestamp_format: [%d/%b %H:%M]

// Se a saída redirecionada contém sequências de escape (códigos de cor)
stdout_with_ansisequence: no

// Faz o servidor gravar tipos selecionados de mensagens em um arquivo na pasta /log/
//1: Registrar mensagens de Aviso (Warning)
//2: Registrar mensagens de Erro e Erro SQL.
//4: Registrar mensagens de Depuração (Debug)
// Exemplo: "console_msg_log: 7" registra os 3 tipos
// Mensagens registradas aqui ignoram a configuração console_silent
console_msg_log: 0

// Caminho do arquivo para armazenar as mensagens do console acima
console_log_filepath: ./log/map-msg_log.log

// Torna a saída do servidor mais silenciosa omitindo certos tipos de mensagens:
//1: Ocultar mensagens de Informação
//2: Ocultar mensagens de Status
//4: Ocultar mensagens de Aviso (Notice)
//8: Ocultar mensagens de Alerta (Warning)
//16: Ocultar mensagens de Erro e Erro SQL.
//32: Ocultar mensagens de Depuração (Debug)
// Exemplo: "console_silent: 7" oculta mensagens de informação, status e aviso (1+2+4)
console_silent: 0

// De onde todos os dados do banco de dados devem ser lidos?
db_path: db

// Ativar os atcommands @guildspy e @partyspy?
// Note que ativá-los diminui a performance de envio de pacotes.
enable_spy: no

// Ler dados dos mapas (GATs e RSWs) dos arquivos GRF ou de um diretório de dados
// conforme referenciado em grf-files.txt em vez do mapcache?
use_grf: no

// Comandos do Console
// Permite ativar/desativar comandos no console
// Isto previne o uso de >& log.file
console: off

// Tempo de salvamento automático do banco de dados
// Todos os personagens são salvos neste intervalo em segundos (exemplo:
// autosave de 60 segundos com 60 personagens online -> um personagem é salvo
// por segundo)
autosave_time: 300

// Intervalo mínimo de salvamento no banco (em ms)
// Previne salvar personagens mais rápido que este intervalo (evita que o
// save-load do char-server fique muito alto conforme aumenta o número de jogadores)
minsave_time: 100

// Além do autosave_time, os jogadores também serão salvos quando envolvidos
// nas seguintes situações (adicione conforme necessário):
// 1: após cada troca bem-sucedida
// 2: após abrir vending / cada transação de vending
// 4: após fechar storage / guild storage.
// 8: após chocar ou retornar um pet ao ovo.
// 16: após enviar com sucesso um mail com anexo
// 32: após enviar com sucesso um item para leilão
// 64: após obter/excluir/completar uma quest
// 128: após cada transação bancária (depósito/saque)
// 256: após cada recompensa de presença
// 4095: sempre
// NOTA: Estas configurações diminuem a chance de duplicações/perda de itens
// quando há um crash do servidor, ao custo de aumentar o lag entre map/char.
// Se seu servidor raramente cai, mas apresenta lag entre servidores,
// talvez seja melhor desativar estas opções.
save_settings: 4095

// Arquivo da mensagem do dia, exibido quando um personagem entra no jogo.
motd_txt: conf/motd.txt

// Quando @help ou @h é digitado por um GM, este arquivo é exibido para ajudar
// novos GMs a entenderem os comandos.
charhelp_txt: conf/charhelp.txt

// Carregar configuração de canais de:
channel_conf: conf/channels.conf

// Mapas:
import: conf/maps_athena.conf

import: conf/import/map_conf.txt