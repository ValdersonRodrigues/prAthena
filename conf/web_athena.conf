// Arquivo de configuração do Web Server do rAthena.

// Nota: "Comentários" são todos os textos à direita de uma dupla barra "//".
// Todo texto comentado não será interpretado pelos servidores, servindo apenas
// como informação/referência.

// O web server escuta na interface com este endereço IP.
// NOTA: Isso permite executar múltiplos servidores em múltiplas interfaces
// usando as mesmas portas para cada servidor.
//bind_ip: 127.0.0.1
 
// Porta do Web Server
web_port: 8888

// Formato de data/hora (timestamp) que será impresso antes de todas as mensagens.
// Pode ter no máximo 20 caracteres.
// Formatos comuns:
// %I:%M:%S %p (hora:minuto:segundo em formato 12 horas, AM/PM)
// %H:%M:%S (hora:minuto:segundo em formato 24 horas)
// %d/%b/%Y (dia/Mês/ano)
// Para informações completas de formatação, consulte o manual do strftime().
//timestamp_format: [%d/%b %H:%M]

// Se a saída redirecionada contém sequências de escape (códigos de cor)
stdout_with_ansisequence: no

// Faz o servidor registrar tipos selecionados de mensagens em um arquivo na pasta /log/
// 1: Registrar mensagens de Aviso (Warning)
// 2: Registrar mensagens de Erro e Erros de SQL.
// 4: Registrar mensagens de Depuração (Debug)
// Exemplo: "console_msg_log: 7" registra os 3 tipos
// As mensagens registradas aqui sobrescrevem a configuração console_silent
console_msg_log: 0

// Caminho do arquivo para armazenar as mensagens do console acima
console_log_filepath: ./log/web-msg_log.log

// Torna a saída do servidor mais silenciosa ao omitir certos tipos de mensagens:
// 1: Ocultar mensagens de Informação
// 2: Ocultar mensagens de Status
// 4: Ocultar mensagens de Aviso (Notice)
// 8: Ocultar mensagens de Advertência (Warning)
// 16: Ocultar mensagens de Erro e Erros de SQL.
// 32: Ocultar mensagens de Depuração (Debug)
// Exemplo: "console_silent: 7" oculta mensagens de informação, status e aviso (1+2+4)
console_silent: 0

// Imprimir requisições e respostas?
// Isso é útil para fins de depuração, pois irá imprimir
// a requisição e a resposta completas para cada transação.
print_req_res: off

// Permitir que imagens GIF sejam enviadas como emblema de guild?
allow_gifs: yes

// Permitir requisições HTTP a partir da origem especificada  
// Isso habilita o Compartilhamento de Recursos entre Origens (CORS) para compatibilidade com navegadores.  
// Apenas requisições da origem configurada serão aceitas.  
//   
// Formato: allowed_origin_cors: <protocolo>://<host>:<porta>  
// Exemplo: allowed_origin_cors: http://meusite.com:8080  
//   
// Nota de segurança: configure apenas origens confiáveis, 
// pois isso permite requisições cross-origin para sua API web.  
allowed_origin_cors:

import: conf/import/web_conf.txt
