// Arquivo de Configuração do Sistema de Canais
channel_config: {

	/* Cores disponíveis */
	colors: {
		Default: "0xffffff" /* Canais personalizados usarão a primeira da lista, a menos que uma cor seja selecionada via @channel. */
		Red: "0xff0000"
		Blue: "0x83cfe9"
		Orange: "0xe57c00"
		Cyan: "0x00b89d"
		Yellow: "0xffff90"
		Green: "0x28bf00"
		White: "0xFFFFFF"
		Purple: "0xD67FFF"
		LightGreen: "0xB6FF00"
		Normal: "0x00ff00"
		/* Adicione quantas cores desejar. */
	}

	/**
	 * Configuração de canal privado
	 * - Sempre CHAN_TYPE_PUBLIC
	 * - Sempre exibido no log do chat como "#nome_do_canal: <nome>: <mensagem>"
	 * - ID dos canais privados começa em 1000
	 **/
	private_channel: {
		allow: true			  // (bool)	Permitir que o jogador crie seu próprio canal?
		color: "Default"	  // (string)	Cor padrão, veja em colors
		delay: 1000			  // (int)	Atraso do chat para cada membro
		max_member: 1000	  // (int)	Máximo de membros
		self_notif: true	  // (bool)	Mostrar mensagem quando o jogador entra ou sai do canal
		join_notif: false	  // (bool)	Mostrar mensagem quando um jogador entra no canal
		leave_notif: false	  // (bool)	Mostrar mensagem quando um jogador sai do canal
		/* Recurso de moderação para o dono do canal, permitido: */
		ban: true			  // (bool)	Banir jogadores
		kick: true			  // (bool)	Expulsar jogadores
		color_override: false // (bool)	Permitir que jogadores mudem a cor do canal privado para a própria
		change_delay: false	  // (bool)	Permitir que jogadores mudem o atraso do canal privado para o próprio
	}

	/**
	 * Canais padrão do servidor
	 **/
	channels: (
	/**
	 * Estrutura
	{
		name: "#canal"		     // (string)	Nome do canal
		password: ""		     // (string)	Senha do canal
		alias: "[Canal]"	     // (string)	Mensagem exibida no lugar do nome do canal
		color: "Default"	     // (string)	Cor do canal
		type: "CHAN_TYPE_PUBLIC" // (string)	Tipo do canal: CHAN_TYPE_PUBLIC, CHAN_TYPE_ALLY, CHAN_TYPE_MAP
		autojoin: false		     // (bool)	Jogadores entrarão automaticamente no canal
		delay: 1000			     // (int)	Atraso do chat para cada jogador
		leave: true			     // (bool)	Jogador pode sair do canal
		chat: true			     // (bool)	Jogador pode falar neste canal
		color_override: false	 // (bool)	Permitir que jogadores mudem a cor do canal privado para a própria
		self_notif: true	     // (bool)	Mostrar mensagem quando o jogador entra ou sai do canal
		join_notif: false	     // (bool)	Mostrar mensagem quando o jogador entra no canal
		leave_notif: false	     // (bool)	Mostrar mensagem quando o jogador sai do canal
		groupid: (0,..,99)	     // (list,int)	Apenas jogadores com IDs de grupo válidos podem entrar. Grupo com 'channel_admin' sempre pode entrar.
		/// Todos os valores acima são configurações padrão
	},							 // Use vírgula se houver outro canal em seguida
	 **/
	{
		name: "#global"
		alias: "[Global]"
		color: "White"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
		leave: false
	},
	{
		name: "#support"
		alias: "[Suporte]"
		color: "Blue"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
	},
	{
		name: "#trade"
		alias: "[Comércio]"
		color: "LightGreen"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
	}
	)

	/**
	 * Configuração de canal para aliança de guilda
	 * Para a estrutura, veja 'channels' acima
	 **/
	ally: {
		name: "#ally"
		alias: "[Aliança]"
		color: "Green"
		type: "CHAN_TYPE_ALLY" // NÃO ALTERE ESTE VALOR
		delay: 1000
		autojoin: false
		leave: true
		chat: true
	}

	/**
	 * Configuração de canal para o mapa
	 * Para a estrutura, veja 'channels' acima
	 **/
	map: {
		name: "#map"
		alias: "[Mapa]"
		color: "Yellow"
		type: "CHAN_TYPE_MAP" // NÃO ALTERE ESTE VALOR
		delay: 1000
		autojoin: false
		leave: true
		chat: true
	}
}
