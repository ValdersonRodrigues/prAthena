// Arquivo de configuração do Login Server do Athena.
// Traduzido por Peter Kieser <pfak@telus.net>

// Nota: "Comentários" são todo o texto à direita de uma barra dupla "//"
// Qualquer texto comentado não será interpretado pelos servidores, servindo
// apenas como informação/referência.

// O login server escuta na interface com este endereço IP.
// NOTA: Isto permite executar múltiplos servidores em múltiplas interfaces
// usando as mesmas portas para cada servidor.
//bind_ip: 127.0.0.1
 
// Porta do Login Server
login_port: 6900

// Formato do timestamp que será impresso antes de todas as mensagens.
// Pode ter no máximo 20 caracteres.
// Formatos comuns:
// %I:%M:%S %p (hora:minuto:segundo no formato 12h, AM/PM)
// %H:%M:%S (hora:minuto:segundo, formato 24h)
// %d/%b/%Y (dia/mês/ano)
// Para informações completas, consulte o manual do strftime().
//timestamp_format: [%d/%b %H:%M]

// Se a saída redirecionada contém sequências de escape (códigos de cor)
stdout_with_ansisequence: no

// Faz o servidor gravar tipos selecionados de mensagens em um arquivo na pasta /log/
//1: Registrar mensagens de Aviso (Warning)
//2: Registrar mensagens de Erro e Erro SQL.
//4: Registrar mensagens de Depuração (Debug)
// Exemplo: "console_msg_log: 7" registra os 3 tipos
// Mensagens registradas aqui ignoram a configuração console_silent
console_msg_log: 0

// Caminho do arquivo para armazenar as mensagens do console acima
console_log_filepath: ./log/login-msg_log.log

// Torna a saída do servidor mais silenciosa omitindo certos tipos de mensagens:
//1: Ocultar mensagens de Informação
//2: Ocultar mensagens de Status
//4: Ocultar mensagens de Aviso (Notice)
//8: Ocultar mensagens de Alerta (Warning)
//16: Ocultar mensagens de Erro e Erro SQL.
//32: Ocultar mensagens de Depuração (Debug)
// Exemplo: "console_silent: 7" oculta mensagens de informação, status e aviso (1+2+4)
console_silent: 0

// Comandos do Console
// Permite ativar/desativar comandos no console
// Isto previne o uso de >& log.file
console: off

// É possível usar _M/_F para criar novas contas no servidor?
// Nota: Isto só funciona se a criptografia de senha do lado do cliente não estiver habilitada.
new_account: no

// Se new_account estiver ativado, altera o tamanho mínimo do nome da conta.
// Por padrão é '4' ou '6' (dependendo da nova interface de login).
// Não altere a menos que seu cliente use o patch 'Remove 4/6 letter User Name limit'.
//acc_name_min_length: 6

// Se new_account estiver ativado, altera o tamanho mínimo da senha.
// Por padrão é '4' ou '6' (dependendo da nova interface de login).
// Não altere a menos que seu cliente use o patch 'Remove 4/6 letter Password limit'.
//password_min_length: 6

// Sistema de proteção contra flood de registro de contas
// allowed_regs é o número de registros permitidos em time_allowed (em segundos)
allowed_regs: 1
time_allowed: 10

// Nome do arquivo de log. Todas as operações recebidas pelo servidor são registradas neste arquivo.
login_log_filename: log/login.log

// Registrar logs do login server?
// NOTA: O login server precisa dos logs para permitir banimentos dinâmicos por falha de senha.
log_login: yes

// Indica como exibir a data nos logs, para jogadores, etc.
date_format: %Y-%m-%d %H:%M:%S

// ID do grupo mínimo exigido para conectar ao servidor.
// -1: desativado
// 0 ou mais: ID do grupo
group_id_to_connect: -1

// ID mínimo do grupo exigido para conectar ao servidor.
// Não funcionará se group_id_to_connect estiver ativado.
// -1: desativado
// 0 ou mais: ID do grupo
min_group_id_to_connect: -1

// Qual grupo (ID) será definido como grupo VIP?
// Padrão: 5
vip_group: 5

// Quantos personagens são permitidos por conta?
// Você não pode exceder o limite de MAX_CHARS definido em mmo.hpp, ou chars_per_account
// usará o valor padrão de MAX_CHARS.
// 0 usará o valor padrão de MIN_CHARS.
chars_per_account: 0

// Aumento máximo de personagens para contas VIP (0 para desativar)
// Aumente MAX_CHARS se quiser aumentar vip_char_increase.
// Nota: A quantidade de personagens VIP = MAX_CHARS - chars_per_account.
// Nota 2: Esta configuração deve ser definida após chars_per_account.
// -1 usará o valor padrão MAX_CHAR_VIP (src/config/core.hpp)
vip_char_increase: -1

// Criar contas com tempo limitado?
// -1: novas contas são criadas sem limite de tempo (padrão)
// 0 ou mais: novas contas expiram automaticamente após este valor, em segundos
start_limited_time: -1

// Armazenar senhas como hash MD5 em vez de texto puro?
// NOTA: Não funciona com clientes que usam <passwordencrypt>
use_MD5_passwords: no

// Colorização da contagem de usuários na janela de login (requer PACKETVER >= 20170726)
// Desativar colorização e descrição em geral?
usercount_disable: no
// Quantidade de usuários exibidos em verde
usercount_low: 200
// Quantidade de usuários exibidos em amarelo
usercount_medium: 500
// Quantidade de usuários exibidos em vermelho
usercount_high: 1000

// Recursos de Ipban
ipban_enable: yes
// Sistema dinâmico de banimento por falha de senha
// Banir usuário após um número de tentativas falhas?
ipban_dynamic_pass_failure_ban: yes
// Intervalo (em minutos) para calcular tentativas falhas.
ipban_dynamic_pass_failure_ban_interval: 5
// Número máximo de tentativas falhas antes de banir.
ipban_dynamic_pass_failure_ban_limit: 7
// Tempo (em minutos) de duração do banimento.
ipban_dynamic_pass_failure_ban_duration: 5
// Intervalo (em segundos) para limpar IP bans expirados. 0 = desativado. padrão = 60.
// NOTA: Mesmo se desativado, bans expirados serão limpos ao iniciar/parar o login server.
// Jogadores ainda poderão logar se o ban expirou.
ipban_cleanup_interval: 60

// Intervalo (em minutos) para executar atualização DNS/IP. Desativado por padrão.
// Ative se seu servidor usa IP dinâmico.
//ip_sync_interval: 10

// Bloqueio por DNS Blacklist
// Se ativado, cada conexão será testada nas listas negras
// especificadas em dnsbl_servers (lista separada por vírgula)
use_dnsbl: no
dnsbl_servers: bl.blocklist.de, socks.dnsbl.sorbs.net
// Aqui estão alguns serviços gratuitos de DNS Blacklist: http://en.wikipedia.org/wiki/Comparison_of_DNS_blacklists
//==============================================================================
//   dnsbl_servers                 Descrição
// - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
// bl.blocklist.de                 IPs que atacam outros servidores/honeypots via SSH, FTP, IMAP, etc.
// ircbl.ahbl.org                  AHBL (proxies abertos, máquinas comprometidas, spammers)
// safe.dnsbl.sorbs.net            Todas as zonas em dnsbl.sorbs.net exceto "recent" e "escalations"
// sbl-xbl.spamhaus.org            Blacklist Spamhaus (spammers, proxies abertos)
// socks.dnsbl.sorbs.net           Servidores proxy SOCKS abertos
// tor.ahbl.org                    Relays e nós de saída Tor atuais

// Verificação de hash MD5 do cliente
// Se ativado, o login server verificará se o hash do cliente corresponde
// ao valor abaixo, e não permitirá clientes modificados.
// Nota: veja 'doc/md5_hashcheck.txt' para mais detalhes.
client_hash_check: off

// Ativar sistema de token de autenticação web
// Necessário para novos clientes que obtêm dados via API HTTP adicional
use_web_auth_token: yes

// Atraso (em milissegundos) para desativar o webtoken após o logout do personagem
// Existe uma condição de corrida quando o cliente desloga. O char-server pode
// revogar o token antes do cliente salvar as configurações.
disable_webtoken_delay: 10000

// Hashes MD5 do cliente
// O cliente com o hash especificado pode logar jogadores com
// group_id igual ou maior que o valor definido.
// Se você definir 'disabled' como hash, jogadores com group_id maior ou igual
// poderão logar independentemente do hash (mesmo sem enviar hash).
// Formato: group_id, hash
// Nota: veja 'doc/md5_hashcheck.txt' para mais detalhes.
//client_hash: 0, 113e195e6c051bb1cfb12a644bb084c5
//client_hash: 10, cb1ea78023d337c38e8ba5124e2338ae
//client_hash: 99, disabled

import: conf/inter_athena.conf
import: conf/import/login_conf.txt
