###########################################################################
# Banco de Dados de Grupos de Jogadores
###########################################################################
#
# Configurações de Grupos de Jogadores
#
###########################################################################
# - Id                    ID do grupo.
#   Name                  Nome do grupo.
#   Level                 Nível de GM usado para classificar grupos. (Padrão: 0)
#   LogCommands           Define se os atcommands devem ser registrados em log ou não. (Padrão: false)
#   Commands:             Lista de atcommands que podem ser usados por este grupo. (Padrão: nenhum)
#     <atcommand name>    Define se o atcommand especificado pode ser usado por este grupo ou não.
#   CharCommands:         Lista de charcommands que podem ser usados por este grupo. (Padrão: nenhum)
#     <charcommand name>  Define se o charcommand especificado pode ser usado por este grupo ou não.
#   Permissions:          Lista de permissões que o grupo possui. (Padrão: nenhuma)
#     <permission name>   Define se o grupo possui esta permissão ou não.
#   Inherit:              Lista de grupos que serão herdados. (Padrão: nenhum)
#     <group name>        Define se este grupo será herdado ou não.
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  - Id: 0
    # grupo 0 é o grupo padrão para toda nova conta
    Name: Player
    Level: 0
    Commands:
      changedress: true
      resurrect: true
    Permissions:
      # sem estas permissões básicas, jogadores normais não poderiam negociar ou formar grupo
      can_trade: true
      can_party: true
      attendance: true
  - Id: 1
    Name: Super Player
    # Pode fazer tudo o que Players pode e mais
    Inherit:
      Player: true
    Level: 0
    Commands:
      # Comandos informativos
      commands: true
      charcommands: true
      help: true
      rates: true
      uptime: true
      showdelay: true
      exp: true
      mobinfo: true
      iteminfo: true
      whodrops: true
      servertime: true
      jailtime: true
      hominfo: true
      homstats: true
      showexp: true
      showzeny: true
      whereis: true
      # Comandos de funcionalidades
      refresh: true
      noask: true
      noks: true
      autoloot: true
      alootid: true
      autoloottype: true
      autotrade: true
      request: true
      go: true
      breakguild: true
      channel: true
      langtype: true
    Permissions:
      attendance: false
  - Id: 2
    Name: Support
    Inherit:
      Super Player: true
    Level: 1
    Commands:
      version: true
      where: true
      jumpto: true
      who: true
      who2: true
      who3: true
      whomap: true
      whomap2: true
      whomap3: true
      users: true
      broadcast: true
      localbroadcast: true
    LogCommands: true
    Permissions:
      receive_requests: true
      view_equipment: true
  - Id: 3
    Name: Script Manager
    Inherit:
      Support: true
    Level: 1
    Commands:
      tonpc: true
      hidenpc: true
      shownpc: true
      loadnpc: true
      unloadnpc: true
      npcmove: true
      addwarp: true
    LogCommands: true
    Permissions:
      any_warp: true
  - Id: 4
    Name: Event Manager
    Inherit:
      Support: true
    Level: 1
    Commands:
      monster: true
      monstersmall: true
      monsterbig: true
      killmonster2: true
      cleanarea: true
      cleanmap: true
      item: true
      zeny: true
      disguise: true
      undisguise: true
      size: true
      raise: true
      raisemap: true
      day: true
      night: true
      skillon: true
      skilloff: true
      pvpon: true
      pvpoff: true
      gvgon: true
      gvgoff: true
      allowks: true
      me: true
      marry: true
      divorce: true
      refreshall: true
    CharCommands:
      item: true
      zeny: true
      disguise: true
      undisguise: true
      size: true
    LogCommands: true
    Permissions:
      can_trade: false
      any_warp: true
  - Id: 5
    Name: VIP
    # Pode fazer tudo o que Players pode
    Inherit:
      Player: true
    Level: 0
    Commands:
      rates: true
      who: true
  - Id: 10
    Name: Law Enforcement
    Inherit:
      Support: true
    Level: 2
    Commands:
      hide: true
      follow: true
      kick: true
      disguise: true
      fakename: true
      option: true
      speed: true
      mapmove: true
      kill: true
      recall: true
      ban: true
      block: true
      jail: true
      jailfor: true
      mute: true
      storagelist: true
      cartlist: true
      itemlist: true
      stats: true
    LogCommands: true
    Permissions:
      join_chat: true
      kick_chat: true
      hide_session: true
      who_display_aid: true
      hack_info: true
      any_warp: true
      view_hpmeter: true
      macro_detect: true
  - Id: 99
    Name: Admin
    Level: 99
    Inherit:
      Support: true
      Law Enforcement: true
    LogCommands: true
    Permissions:
      can_trade: true
      can_party: true
      command_enable: true
      all_skill: false
      all_equipment: false
      skill_unconditional: false
      use_check: true
      use_changemaptype: true
      all_commands: true
      channel_admin: true
      can_trade_bounded: true
      item_unconditional: false
      bypass_stat_onclone: true
      bypass_max_stat: true
      macro_register: true
      trade_unconditional: true
      #all_permission: true

Footer:
  Imports:
  - Path: conf/import/groups.yml
