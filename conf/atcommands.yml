###########################################################################
# Banco de Dados de Atcommands
###########################################################################
#
# Configurações de Atcommand
#
###########################################################################
# - Command                  Nome do comando.
#   Aliases:                 Apelidos para o comando. (Opcional)
#     - <NomeDoAlias>
#   Help                     Mensagem de ajuda do comando. (Opcional)
###########################################################################

Header:
  Type: ATCOMMAND_DB
  Version: 1

Body:
  - Command: accept
    Help: |
      Aceita um convite para um duelo.
  - Command: accinfo
    Aliases:
      - accountinfo
    Help: |
      Parâmetros: <nome do personagem>. Procura um personagem com o nome <nome do personagem>. Você pode usar % como curinga.
      Parâmetros: <ID da conta>. Procura informações de login da conta <ID da conta>.
      Exibe informações básicas da conta com o ID da conta <ID da conta> ou do personagem <nome do personagem> associado a ela.
  - Command: addfame
    Aliases:
      - famepoint
      - famepoints
    Help: |
      Parâmetros: <quantidade>.
      Adiciona ou reduz os pontos de fama do jogador em <quantidade>.
  - Command: addperm
    Help: |
      Parâmetros: <nome_da_permissao>
      Adiciona temporariamente uma permissão a um jogador.
  - Command: addwarp
    Help: |
      Parâmetros: <nome do mapa> <coord x> <coord y> <nome do NPC>
  - Command: adjgroup
    Help: |
      Parâmetros: <nível> <nome do personagem>
      Faz um ajuste temporário do nível de grupo de um jogador.
  - Command: adopt
    Help: |
      Parâmetros: <nome do personagem>
      Adota o jogador especificado <nome do personagem>.
  - Command: agi
    Help: |
      Parâmetros: <quantidade>
      Aumenta AGI pela quantidade informada.
  - Command: agitend
    Help: |
      Encerra a Guerra do Emperium
  - Command: agitend2
    Help: |
      Encerra a Guerra do Emperium SE
  - Command: agitend3
    Help: |
      Encerra a Guerra do Emperium TE
  - Command: agitstart
    Help: |
      Inicia a Guerra do Emperium
  - Command: agitstart2
    Help: |
      Inicia a Guerra do Emperium SE
  - Command: agitstart3
    Help: |
      Inicia a Guerra do Emperium TE
  - Command: alive
    Help: |
      Revive você da morte.
  - Command: allowks
    Help: |
      Ativa ou desativa o kill stealing neste mapa.
  - Command: allskill
    Aliases:
      - allskills
      - skillall
      - skillsall
    Help: |
      Concede todas as habilidades para você.
  - Command: auction
    Help: |
      Abre a janela de leilão.
  - Command: autoloot
    Help: |
      Parâmetros: <on|off|#>
      Faz com que os itens vão diretamente para o seu inventário.
  - Command: autolootitem
    Aliases:
      - alootid
    Help: |
      Parâmetros: Nenhum. Mostra uma ajuda curta.
      Parâmetros: +<ID do Item> para adicionar um ID de item
      Parâmetros: -<ID do Item> para remover um ID de item
      Parâmetros: reset para remover todos os IDs de itens
      Faz com que itens deste ID específico vão diretamente para o seu inventário.
  - Command: autoloottype
    Aliases:
      - aloottype
    Help: |
      Parâmetros: Nenhum. Mostra uma ajuda curta.
      Parâmetros: +<nome/ID do tipo> para adicionar um tipo de item
      Parâmetros: -<nome/ID do tipo> para remover um tipo de item
      Parâmetros: reset para remover todos os tipos de itens
      Faz com que itens deste tipo específico vão diretamente para o seu inventário.
      Lista de Tipos:
        healing = 0, usable = 2, etc = 3, weapon = 4, armor = 5,
        card = 6, petegg = 7, petarmor = 8, ammo = 10
  - Command: autotrade
    Aliases:
      - at
    Help: |
      Permite que você venda enquanto estiver offline.
  - Command: ban
    Aliases:
      - banish
    Help: |
      Parâmetros: <tempo> <nome>\n" "Bane temporariamente uma conta.
      Uso do tempo: ajuste (+/- valor) e unidade (y/a, m, d/j, h, mn, s)
      Exemplo: @ban +1m-2mn1s-6y testplayer
  - Command: baselevelup
    Aliases:
      - baselevel
      - baselvl
      - baselvup
      - baselvlup
      - blevel
      - blvl
      - lvup
    Help: |
      Parâmetros: <número de níveis>
      Aumenta o nível base pela quantidade de níveis desejada.
  - Command: bodystyle
    Help: |
      Parâmetros: <ID da classe>
      Parâmetros: off. Restaura o bodystyle padrão da classe.
      Altera o bodystyle do personagem para <ID da classe>.
  - Command: breakguild
    Help: |
      Desfaz a guilda do personagem conectado.
      Você deve ser o líder da guilda para usar este comando.
  - Command: broadcast
    Help: |
      Parâmetros: <mensagem>
      Envia uma mensagem global com o seu nome (em amarelo).
  - Command: camerainfo
    Aliases:
      - viewpointvalue
      - setcamera
    Help: |
      Mostra ou atualiza as configurações de câmera do cliente.
  - Command: cart
    Help: |
      Parâmetros: <ID do carrinho>
      Concede ou remove um carrinho de um jogador e também altera a skin do carrinho.
      IDs de carrinho disponíveis:
          0: remover carrinho
        1-5: carrinhos normais
        6-9: carrinhos novos
  - Command: cartlist
    Help: |
      Exibe uma lista de itens no carrinho.
  - Command: cash
    Help: |
      Parâmetros: <quantidade> - Concede a quantidade especificada de pontos de cash.
  - Command: changedress
    Aliases:
      - nocosplay
    Help: |
      Remove todos os trajes do personagem.
  - Command: changegm
    Help: |
      Parâmetros: <nome do personagem>
      Altera o líder da sua guilda (você deve ser o líder da guilda)
  - Command: changeleader
    Help: |
      Parâmetros: <nome do personagem>
      Altera o líder do seu grupo (você deve ser o líder do grupo)
  - Command: channel
    Aliases:
      - main
    Help: |
      Se você usar este comando sem parâmetros, receberá uma ajuda mais detalhada.
  - Command: changecharsex
    Help: |
      Altera o gênero do seu personagem.
  - Command: changelook
    Help: |
      Parâmetros: <posição> <ID da aparência>
      Altera a aparência do jogador para o ID especificado.
      Posições disponíveis:
        1: Topo
        2: Meio
        3: Baixo
        4: Arma
        5: Escudo
        6: Sapatos
        7: Capa
        8: Bodystyle
  - Command: changesex
    Help: |
      Altera o gênero da sua conta.
  - Command: char_ban
    Aliases:
      - charban
    Help: |
      Parâmetros: <tempo> <nome>
      Bane temporariamente um personagem.
      Uso do tempo: ajuste (+/- valor) e unidade (y/a, m, d/j, h, mn, s)
      Exemplo: @char_ban +1m-2mn1s-6y testplayer
  - Command: char_block
    Aliases:
      - block
    Help: |
      Parâmetros: <nome do personagem>
      Bloqueia permanentemente uma conta.
  - Command: char_unban
    Aliases:
      - charunban
    Help: |
      Parâmetros: <nome>
      Remove o banimento de um personagem.
  - Command: char_unblock
    Aliases:
      - unblock
    Help: |
      Parâmetros: <nome do personagem>
      Desbloqueia uma conta.
  - Command: charcommands
    Help: |
      Exibe uma lista de charcommands que você pode usar.
  - Command: checkquest
    Help: |
      Parâmetros: <ID da quest>
      Mostra informações de status da quest com o ID <ID da quest>.
  - Command: clanspy
    Help: |
      Parâmetros: <nome|ID do clã>
      Você receberá todas as mensagens do chat do clã (o log de chat deve estar habilitado).
  - Command: cleanarea
    Aliases:
      - cleararea
    Help: |
      Remove itens do chão dentro do alcance de visão.
  - Command: cleanmap
    Aliases:
      - clearmap
    Help: |
      Remove itens do chão no mapa atual.
  - Command: clearcart
    Help: |
      Remove todos os itens do carrinho.
  - Command: cleargstorage
    Help: |
      Remove todos os itens do armazém da guilda.
  - Command: clearstorage
    Help: |
      Remove todos os itens do armazém.
  - Command: clearweather
    Help: |
      Interrompe todos os efeitos climáticos no mapa atual.
  - Command: clone
    Help: |
      Parâmetros: <nome do personagem>
      Cria um clone de suporte do jogador especificado.
  - Command: cloneequip
    Aliases:
      - eqclone
    Help: |
      Parâmetros: <nome do personagem>
      Parâmetros: <ID do personagem>
      Copia os equipamentos do jogador <nome/ID do personagem>.
  - Command: clonestat
    Aliases:
      - stclone
    Help: |
      Parâmetros: <nome do personagem>
      Parâmetros: <ID do personagem>
      Copia os valores de status do jogador <nome/ID do personagem>.
  - Command: clouds
    Help: |
      Faz com que todos os mapas tenham o efeito climático de nublado.
  - Command: clouds2
    Help: |
      Faz com que todos os mapas tenham outro efeito climático de nublado.
  - Command: commands
    Help: |
      Exibe uma lista de atcommands que você pode usar.
  - Command: completequest
    Help: |
      Parâmetros: <ID da quest>
      Completa a quest com o ID <ID da quest>.
  - Command: con
    Help: |
      Parâmetros: <quantidade>
      Aumenta CON pela quantidade informada.
  - Command: costume
    Help: |
      Parâmetros: <traje>
      Altera a aparência visível do jogador para o traje selecionado <traje>.
      Trajes disponíveis:
        Hanbok
        Oktoberfest
        Summer
        Wedding
        Xmas
  - Command: crt
    Help: |
      Parâmetros: <quantidade>
      Aumenta CRT pela quantidade informada.
  - Command: day
    Help: |
      Desativa o modo noturno e restaura a iluminação normal, todos os personagens são afetados.
  - Command: delitem
    Help: |
      Parâmetros: <nome do item> <quantidade>
      Parâmetros: <ID do item> <quantidade>
      Remove <quantidade> do item especificado <nome/ID do item> do inventário do jogador.
  - Command: dex
    Help: |
      Parâmetros: <quantidade>
      Aumenta DEX pela quantidade informada.
  - Command: disguise
    Help: |
      Parâmetros: <nome|ID do monstro>
      Altera sua aparência para outros jogadores como um monstro.
  - Command: disguiseall
    Help: |
      Parâmetros: <nome|ID do monstro>
      Disfarça todos os personagens online.
  - Command: disguiseguild
    Help: |
      Parâmetros: <nome|ID do monstro>
      Disfarça todos os personagens online de uma guilda.
  - Command: displayskill
    Help: |
      Parâmetros: <ID da habilidade> {<nível da habilidade>}
      Exibe a animação de uma habilidade sem realmente utilizá-la.
  - Command: displayskillcast
    Help: |
      Parâmetros: <ID da habilidade> {<nível da habilidade> <flag de alvo no chão> <tempo de conjuração>}
      Exibe a animação de conjuração de uma habilidade sem realmente conjurá-la.
  - Command: displayskillunit
    Help: |
      Parâmetros: <ID da unidade da habilidade> {<nível da habilidade> <alcance>}
      Exibe a animação da unidade de habilidade sem realmente utilizá-la.
  - Command: displaystatus
    Help: |
      Parâmetros: <ID do status> <flag> <tick> {<val1> <val2> <val3>}
      Exibe a animação de um status sem realmente aplicar a mudança de status.
  - Command: divorce
    Help: |
      Divorcia um jogador.
  - Command: doom
    Help: |
      Mata todos os personagens NÃO GM do servidor.
  - Command: doommap
    Help: |
      Mata todos os personagens não GM do mapa.
  - Command: dropall
    Help: |
      Parâmetros: [<tipo de item>]
      Joga todas as suas posses no chão. Se nenhum tipo for especificado, todos os itens serão jogados.
  - Command: duel
    Help: |
      Inicia um duelo.
  - Command: dye
    Aliases:
      - ccolor
    Help: |
      Parâmetros: <nº da paleta de roupas>
      Altera a cor das roupas do seu personagem.
  - Command: effect
    Help: |
      Parâmetros: <ID do efeito> [<flag>]
      Aplica um efeito ao seu personagem.
  - Command: email
    Help: |
      Parâmetros: <email atual> <novo email>
      Altera o endereço de e-mail da sua conta.
  - Command: enchantgradeui
    Help: |
      Abre a interface de encantamento de grau.
  - Command: erasequest
    Help: |
      Parâmetros: <ID da quest>
      Remove a quest <ID da quest> do registro de quests.
  - Command: evilclone
    Help: |
      Parâmetros: <nome do personagem>
      Cria um clone agressivo do jogador especificado.
  - Command: exp
    Help: |
      Exibe os níveis atuais e a porcentagem de progresso.
  - Command: fakename
    Help: |
      Parâmetros: <nome>
      Altera temporariamente o seu nome para o nome escolhido.
  - Command: feelreset
    Help: |
      Reseta os mapas marcados do Star Gladiator.
  - Command: fireworks
    Help: |
      Faz com que todos os mapas tenham o efeito climático de fogos de artifício.
  - Command: fog
    Help: |
      Faz com que todos os mapas tenham o efeito climático de neblina.
  - Command: font
    Help: |
      Parâmetros: <tipo> - valor entre 0-9
      Define a fonte do cliente para <tipo>.
      Tipos disponíveis:
        0: Padrão
        1: RixLoveangel
        2: RixSquirrel
        3: NHCgogo
        4: RixDiary
        5: RixMiniHeart
        6: RixFreshman
        7: RixKid
        8: RixMagic
        9: RixJJangu
  - Command: fontcolor
    Help: |
      Parâmetros: <nome_da_cor>
      Define a cor da fonte do chat de canal apenas para o personagem que executou o comando.
  - Command: follow
    Help: |
      Parâmetros: <nome do personagem>
      Segue um jogador.
  - Command: fullstrip
    Help: |
      Parâmetros: <nome do personagem>
      Remove todos os itens equipados atualmente por <nome do personagem>.
  - Command: gat
    Help: |
      Para depuração (inspeciona ao redor do gat).
  - Command: guildlevelup
    Aliases:
      - glevel
      - glvl
      - guildlevel
      - guildlvl
      - guildlvlup
      - guildlvup
    Help: |
      Parâmetros: <# de níveis>
      Aumenta o nível da Guilda pela quantidade de níveis desejada.
  - Command: gmotd
    Help: |
      Transmite a Mensagem do Dia para todos os jogadores.
  - Command: go
    Help: |
      Parâmetros: <nome|número da cidade>
      Teleporta você para uma cidade.
      -3: (Ponto de Memo 2)  14: louyang         31: mora
      -2: (Ponto de Memo 1)  15: ponto inicial   32: dewata
      -1: (Ponto de Memo 0)  16: prisão/jail     33: ilha de malangdo
       0: prontera              17: jawaii             34: porto de malaya
       1: morocc                18: ayothaya       35: eclage
       2: geffen                  19: einbroch       36: lasagna
       3: payon                  20: lighthalzen
       4: alberta                 21: einbech
       5: izlude                   22: hugel
       6: aldebaran           23: rachel
       7: xmas (lutie)        24: veins
       8: comodo               25: moscovia
       9: yuno                     26: acampamento de midgard
      10: amatsu               27: manuk
      11: gonryun              28: splendide
      12: umbala               29: brasilis
      13: niflheim              30: el dicastes
  - Command: grade
    Help: |
      Parâmetros: <posição do equipamento> <quantidade +/-> 
  - Command: guild
    Help: |
      Parâmetros: <nome_da_guilda>
      Cria uma guilda.
  - Command: guildrecall
    Help: |
      Parâmetros: <nome|ID da guilda>
      Teleporta todos os personagens online da guilda até você.
  - Command: guildspy
    Help: |
      Parâmetros: <nome|ID da guilda>
      Você receberá todas as mensagens do chat da guilda (o log de chat deve estar habilitado).
  - Command: guildstorage
    Aliases:
      - gstorage
    Help: |
      Abre o armazém da guilda.
  - Command: gvgoff
    Aliases:
      - gpvpoff
    Help: |
      Desativa GvG no mapa atual.
  - Command: gvgon
    Aliases:
      - gpvpon
    Help: |
      Ativa GvG no mapa atual.
  - Command: hair_color
    Aliases:
      - haircolor
      - hcolor
    Help: |
      Parâmetros: <nº da paleta de cabelo>
      Altera a cor do cabelo.
  - Command: hair_style
    Aliases:
      - hairstyle
      - hstyle
    Help: |
      Parâmetros: <nº do estilo de cabelo>
      Altera o estilo de cabelo.
  - Command: hatch
    Help: |
      Cria um mascote a partir da lista de ovos do seu inventário.
  - Command: hatereset
    Help: |
      Reseta os monstros marcados do Star Gladiator.
  - Command: heal
    Help: |
      Parâmetros: [<HP> <SP>]
      Cura a quantidade desejada de HP e SP. Se nenhum valor for especificado, faz cura total.
  - Command: healap
    Help: |
      Parâmetros: [<AP>]
      Cura a quantidade desejada de AP. Se nenhum valor for especificado, faz cura total de AP.
  - Command: help
    Aliases:
      - h
    Help: |
      Parâmetros: <comando>
      Mostra a ajuda do comando especificado.
  - Command: hide
    Help: |
      Torna seu personagem invisível (invisibilidade de GM). Digite novamente para se tornar visível.
  - Command: hidenpc
    Help: |
      Parâmetros: <nome do NPC>
      Desativa um NPC.
  - Command: homevolution
    Aliases:
      - homevolve
    Help: |
      Evolui seu homúnculo, se possível.
  - Command: homfriendly
    Help: |
      Parâmetros: <nível de intimidade> - valor entre 0-1000
      Define o nível de intimidade do seu homúnculo para o valor desejado.
  - Command: homhungry
    Help: |
      Parâmetros: <nível de fome> - valor entre 0-100
      Define o nível de fome do seu homúnculo para o valor desejado.
  - Command: hominfo
    Help: |
      Exibe os atributos do homúnculo.
  - Command: homlevel
    Aliases:
      - hlvl
      - hlevel
      - homlvl
      - homlvup
    Help: |
      Parâmetros: <nível>
      Aumenta o nível do homúnculo em <nível>.
  - Command: hommutate
    Help: |
      Parâmetros: <ID do homúnculo mutado>
      Muta seu homúnculo para <ID do homúnculo mutado>, se possível.
  - Command: homshuffle
    Help: |
      Recalcula os atributos do homúnculo, como se ele tivesse sido evoluído novamente desde o nível 1.
  - Command: homstats
    Help: |
      Exibe os atributos do homúnculo.
    - Command: homtalk
    Help: |
      Params: <mensagem>
      Faz o homúnculo do jogador dizer o texto <mensagem>.
  - Command: identify
    Help: |
      Abre a janela de identificação se houver itens não identificados no seu inventário.
  - Command: identifyall
    Help: |
      Todos os itens não identificados no seu inventário serão automaticamente identificados.
  - Command: idsearch
    Help: |
      Params: <parte_do_nome_do_item>
      Procura todos os itens cujo nome contenha parte_do_nome_do_item
  - Command: int
    Help: |
      Params: <quantidade>
      Aumenta a INT pela quantidade informada.
  - Command: invite
    Help: |
      Convida um jogador para um duelo.
  - Command: item
    Help: |
      Params: <nome ou ID do item> <quantidade>
      Concede o item desejado.
  - Command: item2
    Help: |
      Params: <nome ou ID do item> <quantidade> <flag_identificado> <refino> <flag_quebrado> <Carta1> <Carta2> <Carta3> <Carta4>
      Concede o item desejado.
  - Command: itembound
    Help: |
      Params: <nome ou ID do item> <quantidade> <tipo de vínculo>
      Cria um item vinculado ao personagem.
      Os itens não podem ser dropados, vendidos, colocados em loja, leiloados ou enviados por correio,
      e em alguns casos não podem ser trocados ou armazenados.
      Tipos de vínculo disponíveis:
        1: Conta
        2: Guilda
        3: Grupo
        4: Personagem
  - Command: itembound2
    Help: |
      Params: <nome ou ID do item> <quantidade> <flag_identificado> <refino> <flag_quebrado> <Carta1> <Carta2> <Carta3> <Carta4> <tipo de vínculo>
      Cria um item vinculado ao personagem.
      Os itens não podem ser dropados, vendidos, colocados em loja, leiloados ou enviados por correio,
      e em alguns casos não podem ser trocados ou armazenados.
      Tipos de vínculo disponíveis:
        1: Conta
        2: Guilda
        3: Grupo
        4: Personagem
  - Command: iteminfo
    Aliases:
      - ii
    Help: |
      Params: <nome|ID do item>
      Mostra informações do item (tipo, preço etc).
  - Command: itemlist
    Aliases:
      - inventorylist
    Help: |
      Exibe uma lista de itens no inventário.
  - Command: itemreset
    Aliases:
      - clearinventory
    Help: |
      Remove todos os seus itens.
  - Command: jail
    Help: |
      Params: <nome do personagem>
      Envia o personagem especificado para a prisão.
  - Command: jailfor
    Help: |
      Params: <tempo> <nome do personagem>
      Envia o personagem especificado para a prisão pelo <tempo> informado.
  - Command: jailtime
    Help: |
      Exibe o tempo restante de prisão.
  - Command: jobchange
    Aliases:
      - job
    Help: |
      Params: <nome|ID da classe>
      Altera sua classe.
      ----- Aprendiz / 1ª Classe -----
         0 Aprendiz             1 Espadachim             2 Mago            3 Arqueiro
         4 Noviço               5 Mercador               6 Gatuno
      ----- 2ª Classe -----
         7 Cavaleiro             8 Sacerdote              9 Bruxo            10 Ferreiro
        11 Caçador              12 Assassino             14 Cruzado          15 Monge
        16 Sábio                17 Arruaceiro            18 Alquimista       19 Bardo
        20 Odalisca
      ----- Aprendiz High / 1ª Classe High -----
      4001 Aprendiz High     4002 Espadachim High     4003 Mago High    4004 Arqueiro High
