  - Command: sizeguild
    Help: |
      Altera o tamanho de todos os personagens online de uma guild.
  - Command: skillid
    Help: |
      Parâmetros: <nome>
      Procura uma habilidade pelo nome
  - Command: skilloff
    Help: |
      Desativa habilidades em um mapa.
  - Command: skillon
    Help: |
      Ativa habilidades em um mapa.
  - Command: skillpoint
    Aliases:
      - skpoint
    Help: |
      Parâmetros: <número de pontos> - Dá a você a quantidade desejada de pontos de habilidade.
  - Command: skilltree
    Help: |
      Parâmetros: <número da habilidade> <nome do personagem>
      Mostra a árvore de habilidades necessária para obter uma habilidade para o jogador alvo.
  - Command: slaveclone
    Help: |
      Parâmetros: <nome do personagem>
      Invoca um clone de suporte do jogador informado que segue o criador.
  - Command: snow
    Help: |
      Faz todos os mapas terem o efeito climático de neve.
  - Command: soulball
    Help: |
      Parâmetros: <quantidade> - valor entre 0-20
      Invoca a quantidade especificada de esferas espirituais ao seu redor.
  - Command: sound
    Help: |
      Parâmetros: <caminho do arquivo na pasta data ou no arquivo GRF>
      Reproduz um som da pasta data ou do arquivo GRF localizado no cliente.
  - Command: speed
    Help: |
      Parâmetros: <1-1000>
      Altera sua velocidade de movimento. 1 é o mais rápido e 1000 o mais lento. Padrão é 150.
  - Command: spiritball
    Help: |
      Parâmetros: <1-100>
      Dá a você "esferas espirituais" como da habilidade "Invocar Espíritos".
  - Command: spl
    Help: |
      Parâmetros: <quantidade>
      Aumenta SPL pelo valor informado.
  - Command: sta
    Help: |
      Parâmetros: <quantidade>
      Aumenta STA pelo valor informado.
  - Command: stat_all
    Aliases:
      - allstat
      - allstats
      - statall
      - statsall
    Help: |
      Parâmetros: <valor>
      Adiciona valor em todos os atributos (máximo se nenhum valor for informado).
  - Command: stats
    Help: |
      Mostra os atributos do jogador no chat.
  - Command: statuspoint
    Aliases:
      - stpoint
    Help: |
      Parâmetros: <número de pontos> - Dá a você a quantidade desejada de pontos de atributo.
  - Command: stockall
    Help: |
      Parâmetros: [<tipo de item>]
      Transfere itens do carrinho para o inventário. Nenhum tipo especificado transfere todos os itens.
  - Command: storage
    Help: |
      Abre o armazém.
  - Command: storeall
    Help: |
      Coloca todos os seus pertences no armazém.
  - Command: storagelist
    Help: |
      Mostra uma lista de itens no armazém.
  - Command: str
    Help: |
      Parâmetros: <quantidade>
      Aumenta STR pelo valor informado.
  - Command: stylist
    Help: |
      Abre a interface do estilista.
  - Command: summon
    Help: |
      Parâmetros: <nome|ID do monstro> {<duração>}
      Invoca o monstro com <nome|ID do monstro> e faz com que ele trate você como mestre.
      Se uma duração for especificada, ele ficará com você até que o tempo termine.
  - Command: tonpc
    Help: |
      Parâmetros: <nome do NPC>
      Teleporta para o NPC especificado.
  - Command: trade
    Help: |
      Parâmetros: <nome do personagem> - Abre uma janela de troca com outro jogador
  - Command: trait_all
    Aliases:
      - alltrait
      - alltraits
      - traitall
      - traitsall
    Help: |
      Parâmetros: <valor>
      Adiciona valor em todos os traços (máximo se nenhum valor for informado).
  - Command: traitpoint
    Aliases:
      - trpoint
    Help: |
      Parâmetros: <número de pontos> - Dá a você a quantidade desejada de pontos de atributo de traço.
  - Command: unban
    Aliases:
      - unbanish
    Help: |
      Parâmetros: <nome> - Remove o banimento de uma conta
  - Command: undisguise
    Help: |
      Restaura sua aparência normal.
  - Command: undisguiseall
    Help: |
      Restaura a aparência normal de todos os jogadores conectados.
  - Command: undisguiseguild
    Help: |
      Restaura a aparência normal de todos os personagens de uma guild.
  - Command: unjail
    Aliases:
      - discharge
    Help: |
      Parâmetros: <nome do personagem>
      Libera o personagem/prisioneiro especificado
  - Command: unloadnpc
    Help: |
      Parâmetros: <nome do NPC>
      Descarrega o NPC especificado pelo nome.
  - Command: unloadnpcfile
    Help: |
      Parâmetros: <caminho>
      Descarrega o arquivo de script especificado no caminho.
  - Command: unmute
    Help: |
      Parâmetros: <nome do personagem>
      Remove o silêncio do jogador <nome do personagem>.
  - Command: uptime
    Help: |
      Mostra há quanto tempo o servidor está online.
  - Command: users
    Help: |
      Mostra a distribuição de jogadores no servidor por mapa.
  - Command: useskill
    Help: |
      Parâmetros: <id da habilidade> <nível da habilidade> <alvo>
      Usa uma habilidade no alvo
  - Command: version
    Help: |
      Mostra a versão SVN do servidor.
  - Command: vip
    Help: |
      Parâmetros: <+/- tempo> <nome do personagem>
      Coloca um jogador em modo VIP por tempo limitado.
      Elementos de tempo: y/a, m, d/j, h, mn, s
  - Command: vit
    Help: |
      Parâmetros: <quantidade>
      Aumenta VIT pelo valor informado.
  - Command: where
    Help: |
      Parâmetros: <nome do personagem>
      Informa a localização de um personagem.
  - Command: whereis
    Help: |
      Parâmetros: <nome|ID do monstro>
      Mostra os mapas em que o monstro <nome|ID do monstro> normalmente aparece.
  - Command: who
    Aliases:
      - whois
    Help: |
      Parâmetros: [<nome>]
      Mostra uma lista de jogadores online e suas parties e guilds.
  - Command: who2
    Help: |
      Parâmetros: [<nome>]
      Mostra uma lista de jogadores online e suas classes.
  - Command: who3
    Help: |
      Parâmetros: [<nome>]
      Mostra uma lista de jogadores online e suas localizações.
  - Command: whodrops
    Help: |
      Parâmetros: <nome|ID do item>
      Mostra quem derruba um item (monstro com maior taxa de drop).
  - Command: whogm
    Help: |
      Parâmetros: [texto_correspondente] - Como @who+@who2+@who3, mas apenas para GM.
  - Command: whomap
    Help: |
      Parâmetros: <nome do mapa>
      Como @who, mas apenas para o mapa especificado <nome do mapa>.
  - Command: whomap2
    Help: |
      Parâmetros: <nome do mapa>
      Como @who2, mas apenas para o mapa especificado <nome do mapa>.
  - Command: whomap3
    Help: |
      Parâmetros: <nome do mapa>
      Como @who3, mas apenas para o mapa especificado <nome do mapa>.
  - Command: wis
    Help: |
      Parâmetros: <quantidade>
      Aumenta WIS pelo valor informado.
  - Command: zeny
    Help: |
      Parâmetros: <quantidade> - Dá a você a quantidade desejada de Zeny.
Footer:
  Imports:
    - Path: conf/import/atcommands.yml
