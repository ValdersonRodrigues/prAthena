// Arquivo de configuração de sockets do Athena
// traduzido para o PT BR (Vrods)


// Exibir relatórios de depuração (Quando algo dá errado durante o relatório, o relatório é salvo.)
debug: no

// Linux/Epoll: Máximo de eventos por ciclo
// Valor padrão:
//	(Máximo de conexões suportadas)/2
// NOTA: isto controla o máximo de eventos de socket coletados por ciclo (chamada a epoll_wait())
//       por exemplo, definir isto como 32 permitirá até 32 eventos (dados recebidos/novas conexões)
//       por ciclo do servidor.
// NOTA: Configuração recomendada é pelo menos metade do máximo de conexões suportadas
//       Definir isto para um valor menor pode causar travamentos/atrasos
//       Dependendo do tempo de CPU disponível
// NOTA: Esta configuração só está disponível no Linux quando compilado usando EPoll como despachante de eventos!
//
//epoll_maxevents: 1024

// Quanto tempo um socket pode ficar travado antes de fechar a conexão (em segundos)
stall_time: 60

//----- Configurações de Regras de IP -----

// Se os IPs são verificados ao conectar.
// Isso também ativa a proteção contra DDoS.
enable_ip_rules: yes

// Ordem das verificações
//   deny,allow     : Verifica regras de negação, depois regras de permissão. Permite se nenhuma regra corresponder.
//   allow,deny     : Verifica regras de permissão, depois regras de negação. Permite se nenhuma regra corresponder.
//   mutual-failure : Permite somente se uma regra de permissão corresponder e nenhuma regra de negação corresponder.
// (padrão é deny,allow)

order: deny,allow
// order: allow,deny
// order: mutual-failure

// Regras de IP
//   allow : Aceita conexões do intervalo de IP (mesmo que marcado como DDoS)
//   deny  : Rejeita conexões do intervalo de IP
// As regras são processadas em ordem, a primeira regra correspondente de cada lista (allow e deny) é usada

// allow: 127.0.0.1
// allow: 192.168.0.0/16
// allow: 10.0.0.0/255.0.0.0
// allow: all

// deny: 127.0.0.1


//---- Configurações de Proteção contra DDoS ----
// Se ddos_count pedidos de conexão forem feitos dentro de ddos_interval ms, é considerado um ataque DDoS

// Intervalo entre tentativas consecutivas (em ms)
// (padrão é 3000 ms, 3 segundos)
ddos_interval: 3000

// Limite de tentativas consecutivas
// (padrão é 5 tentativas)
ddos_count: 5

// Intervalo de tempo após o qual a ameaça de DDoS é considerada encerrada (em ms)
// Após esse tempo, as restrições de DDoS são removidas.
// (padrão é 600000 ms, 10 minutos)
ddos_autoreset: 600000


import: conf/import/packet_conf.txt
