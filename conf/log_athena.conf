//--------------------------------------------------------------
// Arquivo de Configuração de Logs do rAthena
//--------------------------------------------------------------
// Nota 1: O valor é um interruptor de configuração (on/off, yes/no ou 1/0)
// Nota 2: O valor é em porcentagem (100 significa 100%)
// Nota 3: O valor é um campo de bits. Se nenhuma descrição for dada,
//         considere os tipos de unidade (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenário, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Habilitar Logs? (Nota 3)
// 0x00000000 - Não registrar nada
// 0x00000001 - (T) Registrar trocas (trade)
// 0x00000002 - (V) Registrar transações de vending
// 0x00000004 - (P) Registrar itens dropados/pegos por jogadores
// 0x00000008 - (L) Registrar itens dropados/lootados por monstros
// 0x00000010 - (S) Registrar transações de NPC (comprar/vender)
// 0x00000020 - (N) Registrar transações de scripts (itens deletados/adquiridos por quests)
// 0x00000040 - (D) Registrar itens roubados de monstros (Steal/Gank)
// 0x00000080 - (C) Registrar itens usados por jogadores (consumíveis/comida de pet&hom&merc/itens usados por habilidades&ataques)
// 0x00000100 - (O) Registrar itens produzidos/ingredientes
// 0x00000200 - (U) Registrar itens prêmio de MVP
// 0x00000400 - (A) Registrar itens criados/deletados por jogadores (via comandos @/#)
// 0x00000800 - (R) Registrar itens colocados/retirados do armazém.
// 0x00001000 - (G) Registrar itens colocados/retirados do armazém da guild.
// 0x00002000 - (E) Registrar transações do sistema de correio.
// 0x00004000 - (I) Registrar transações do sistema de leilão.
// 0x00008000 - (B) Registrar transações de buying store
// 0x00010000 - (X) Registrar todas as outras transações (aluguéis expirando/inserção de cartas/itens removidos por item_check/
//           alianças removidas por divórcio/nascimento de pet (un)chocando/equipar (un)equipar armadura de pet/Habilidade de Refinar Arma/Habilidade Remove Trap/Stylist)
// 0x00020000 - ($) Registrar transações de cash
// 0x00040000 - (K) Registrar transações do banco da conta
// 0x00080000 - (F) Remover itens vinculados quando a guild/party é desfeita
// 0x00100000 - (Y) Registrar Roleta de Loteria
// 0x00200000 - (Z) Itens mesclados pelo processo de fusão de itens.
// 0x00400000 - (Q) Registrar itens dados por drops de quests.
// 0x00800000 - (H) Registrar itens consumidos pelo sistema de Aeronave Privada
// 0x01000000 - (J) Registrar transações da Loja de Trocas (Barter Shop)
// 0x02000000 - (W) Registrar transações do sistema Laphine
// 0x04000000 - (0) Interface de Enchantgrade
// 0x08000000 - (1) Interface de Reforma
// 0x10000000 - (2) Interface de Encantamento
// Exemplo: Registrar trades+vending+itens de script+itens criados: 1+2+32+1024 = 1059
// Observe que mover itens do inventário para o carrinho e vice-versa não é registrado por padrão.
enable_logs: 0xFFFFFFFF

// Usar Logs em MySQL? (Nota 1)
sql_logs: yes

// FILTROS DE LOG
// =============================================================
// se qualquer condição for verdadeira, o item será registrado
// 0 = Não registrar nada
// 1 = Registrar qualquer item
// Bits avançados por tipo de item: ||
// 0002 - Itens de Cura (0)
// 0004 - Itens Etc(3) + Flechas (10)
// 0008 - Itens Usáveis(2) + Iscas, Pergaminhos(11) + Itens Cash Usáveis(18)
// 0016 - Armas(4)
// 0032 - Escudos, Armaduras, Cabeças, Acessórios, etc(5)
// 0064 - Cartas(6)
// 0128 - Acessórios de Pet(8) + Ovos(7) (bem, monstros não dropam, mas usamos o mesmo sistema para TODOS os logs)
// 0256 - Registrar itens caros ( >= price_items_log)
// 0512 - Registrar grande quantidade de itens ( >= amount_items_log)
// 1024 - Registrar itens refinados (se o refine >= refine_items_log )
// 2048 - Registrar itens raros (se a chance de drop <= rare_items_log )

// Exemplos: (filtros de log)
// log_filter: 1    = registra QUALQUER item
// log_filter: 2    = registra somente itens de CURA
// log_filter: 4    = registra somente Itens Etc e Flechas
// log_filter: 64   = registra somente Cartas
// log_filter: 322  = registra somente itens de Cura, Cartas e itens cujo preço >= price_items_log
// log_filter: 4080 = registra todos os itens (incluindo raros e em grande quantidade), exceto cura, etc, flechas e usáveis
log_filter: 1

// Registrar itens com Refino >= refine_items_log
refine_items_log: 5
// Registrar itens com taxa mínima de drop <= rare_items_log
// 1 = 0.01%, 100 = 1% de chance de drop, etc
rare_items_log: 100
// não registrar se o preço de compra do item < price_items_log
price_items_log: 1000
// não registrar se a quantidade do item < amount_items_log
amount_items_log: 100
//=============================================================

// Registrar uso de Galho Seco (Dead Branch) (Nota 1)
log_branch: no

// Rastrear mudanças de Zeny
// Configuração do filtro
// 0 - não registrar; 1 - registrar qualquer mudança; 2.....1000000 - valor mínimo absoluto para registrar
log_zeny: 0

// Rastrear mudanças de Cash (Nota 1)
log_cash: yes

// Registrar drops de MVP (Nota 1)
// Obsoleto. Use Pick_Log. Mas este log pode ser útil para acompanhar MVPs mortos
log_mvpdrop: no

// Registrar AtCommands & Charcommands (Nota 1)
// Apenas comandos executados por grupos ('conf/groups.conf') com
// 'log_commands' definido como 'true' serão registrados.
log_commands: yes

// Registrar comandos NPC 'logmes' (Nota 1)
log_npc: yes

// Registrar CHAT (Global, Whisper, Party, Guild, Main chat, Clan) (Nota 3)
// FILTROS DE LOG
// =============================================================
// 0 = Não registrar
// 1 - Registrar mensagens Globais
// 2 - Registrar mensagens Whisper
// 4 - Registrar mensagens de Party
// 8 - Registrar mensagens de Guild
// 16 - Registrar mensagens do Main chat
// 32 - Registrar mensagens de Clan
// Exemplo:
// log_chat: 5 = registra Whisper & Party
// log_chat: 8 = registra apenas Guild
// log_chat: 63 = registra tudo
log_chat: 0

// Desativar log de chat durante WoE? (Nota 1)
log_chat_woe_disable: no

// Registrar alimentação
// Alimentação de pet ou homunculus deve ser registrada? (Nota 3)
// 0: Desativado
// 1: Pet
// 2: Homunculus
log_feeding: 3

// Formato do timestamp impresso no arquivo de log.
// Pode ter no máximo 20 caracteres.
// Formatos comuns:
// %I:%M:%S %p (hora:minuto:segundo 12h, AM/PM)
// %H:%M:%S (hora:minuto:segundo 24h)
// %d/%b/%Y (dia/mês/ano)
// Para formato completo, consulte o manual do strftime().
log_timestamp_format: %m/%d/%Y %H:%M:%S

// Arquivos/tabelas de log
// As configurações abaixo definem onde registrar.
// Se 'sql_logs' estiver ativo, serão usadas tabelas SQL,
// caso contrário, arquivos de texto.

// log_gm_db: log/atcommandlog.log
// log_branch_db: log/branchlog.log
// log_chat_db: log/chatlog.log
// log_mvpdrop_db: log/mvplog.log
// log_npc_db: log/npclog.log
// log_pick_db: log/picklog.log
// log_zeny_db: log/zenylog.log
// log_cash_db: log/cashlog.log
// log_feeding_db: log/feedinglog.log

log_gm_db: atcommandlog
log_branch_db: branchlog
log_chat_db: chatlog
log_mvpdrop_db: mvplog
log_npc_db: npclog
log_pick_db: picklog
log_zeny_db: zenylog
log_cash_db: cashlog
log_feeding_db: feedinglog

import: conf/import/log_conf.txt