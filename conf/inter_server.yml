##########################################################################
# Banco de Dados de Armazém (Storage)
##########################################################################
#
# Configurações do Armazém
#
##########################################################################
#	- ID                       ID do armazém.
#	  Name                     Nome do armazém que será enviado ao cliente para exibição na barra de título.
#	  Table                    Nome da tabela SQL onde o armazém é salvo. A estrutura da tabela é a mesma da tabela padrão de storage.
#	  Max                      Número máximo de itens. (Padrão: MAX_STORAGE)
###########################################################################
# Para acessar o armazém premium, use o comando de script 'openstorage2'.
# Se mais armazéns premium forem adicionados, copie a estrutura da tabela de storage e
# corresponda o nome da tabela neste config.
# O valor 'Max' dos armazéns premium não é ajustado pela configuração 'vip_storage_increase'
# nem por MIN_STORAGE.
###########################################################################

Header:
  Type: INTER_SERVER_DB
  Version: 1

Body:
  - ID: 0
    Name: "Storage"
    Table: storage

Footer:
  Imports:
    - Path: conf/import/inter_server.yml