###########################################################################
# Banco de Dados de Conquistas
###########################################################################
#
# Configurações de Conquistas
#
###########################################################################
# - Id                  ID da Conquista.
#   Group               Tipo de grupo da conquista. (Padrão: None)
#   Name                Nome da conquista.
#   Targets:            Lista de alvos exigidos pela conquista. (Padrão: null)
#     - Id              Valor de índice usado para métodos de importação.
#       Mob             Monstro alvo. (Padrão: 0)
#       Count           Quantidade alvo. (Padrão: 1)
#   Condition           Condição que deve ser atendida para que a conquista seja considerada completa. (Padrão: null)
#   Map                 Nome do mapa usado para o tipo AG_CHATTING. (Padrão: -1)
#   Dependents:         Lista de conquistas que precisam ser concluídas antes que esta conquista seja considerada completa. (Padrão: null)
#     - Id: <bool>      ID da conquista pré-requisito.
#   Rewards:            Lista de recompensas concedidas ao concluir. (Padrão: null)
#     Item              Nome do item.
#     Amount            Quantidade do item. (Padrão: 1)
#     Script            Script de bônus. (Padrão: null)
#     TitleId           ID do título. (Padrão: 0)
#   Score               Pontos de conquista concedidos ao concluir. (Padrão: 0)
###########################################################################

Header:
  Type: ACHIEVEMENT_DB
  Version: 2

Footer:
  Imports:
  - Path: db/pre-re/achievement_db.yml
    Mode: Prerenewal
  - Path: db/re/achievement_db.yml
    Mode: Renewal
  - Path: db/import/achievement_db.yml
